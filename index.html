    en:{ note:'Theta is the standard name for &bdquo;all the model parameters gathered into one vector&ldquo;. It is used when you do not want to list weights, biases and everything else separately, but to speak of them as a single point in a space. So an expression like θ ∈ ℝᴰ simply means &bdquo;a model with D parameters&ldquo;. Training is written as motion of that point: θ ← θ − η∇L. For a 7-billion-parameter model θ is a vector with 7 billion components, and the whole picture of a loss landscape is about a space with that many dimensions.',
         ex:'The line <span class="m">θ* = arg min<sub>θ</sub> L(θ)</span> summarizes nearly all of training. When a paper writes θ<sub>t</sub>, that is the state of the model after t steps — an entire model, not a single number.' } },

  { ill:'node:est',
    bg:{ note:'Шапката над буква винаги значи &bdquo;оценено от данни&ldquo;, за разлика от истинската, неизвестна стойност без шапка. Разликата не е педантизъм: оценката е случайна величина, която зависи от конкретната извадка, докато истинската стойност е фиксирана. Затова за оценката има смисъл да говориш за отклонение и дисперсия, а за истинската стойност — не. Същата конвенция важи и за предсказанията: ŷ е това, което моделът е произвел, y е това, което е било вярно. Когато в статия видиш шапка, първият въпрос е &bdquo;от кои данни е сметнато това и колко е стабилно&ldquo;.',
         ex:'Оценка на дисперсия с делене на n е сместена надолу; с n−1 е несместена. При n = 1000 разликата е 0.1% и никой не я вижда, при n = 5 е 25%. Шапката ти напомня, че числото има собствено разпределение.' },
    en:{ note:'A hat over a letter always means &bdquo;estimated from data&ldquo;, as opposed to the true, unknown value without one. The distinction is not pedantry: an estimate is a random variable depending on the particular sample, while the true value is fixed. That is why it makes sense to speak of bias and variance for an estimate and not for the truth. The same convention applies to predictions: ŷ is what the model produced, y is what was actually true. When you see a hat in a paper, the first question is &bdquo;from what data was this computed, and how stable is it&ldquo;.',
         ex:'Estimating variance by dividing by n is biased downward; by n−1 it is unbiased. At n = 1000 the difference is 0.1% and nobody notices, at n = 5 it is 25%. The hat reminds you that the number has a distribution of its own.' } },

  { ill:'node:gd',
    bg:{ note:'Ета обозначава learning rate — колко голяма стъпка прави оптимизаторът в посоката на градиента. Това е най-важният хиперпараметър в дълбокото обучение, по-важен от архитектурата и от избора на оптимизатор. Твърде голяма стойност и загубата скача или става NaN; твърде малка и обучението пълзи или засяда. Праговата стойност зависи от кривината: стабилността изисква η под 1/L, където L е константата на Липшиц на градиента. Рядко е постоянна през цялото обучение — почти винаги има warmup в началото и затихване към края.',
         ex:'Минимизираме <span class="m">L(θ) = θ²</span> от θ = 10. При <span class="m">η = 0.1</span>: 10 → 8 → 6.4 → 5.12, плавно сходене. При <span class="m">η = 0.6</span>: 10 → −2 → 0.4, осцилира но сходи. При <span class="m">η = 1.1</span>: 10 → −12 → 14.4, разходимост.' },
    en:{ note:'Eta denotes the learning rate — how large a step the optimizer takes along the gradient direction. It is the single most important hyperparameter in deep learning, more so than the architecture or the choice of optimizer. Too large and the loss spikes or turns to NaN; too small and training crawls or stalls. The threshold depends on curvature: stability requires η below 1/L, where L is the Lipschitz constant of the gradient. It is rarely constant across training — there is almost always a warmup at the start and a decay toward the end.',
         ex:'Minimizing <span class="m">L(θ) = θ²</span> from θ = 10. At <span class="m">η = 0.1</span>: 10 → 8 → 6.4 → 5.12, smooth convergence. At <span class="m">η = 0.6</span>: 10 → −2 → 0.4, oscillates but converges. At <span class="m">η = 1.1</span>: 10 → −12 → 14.4, divergence.' } },

  { ill:'node:momentum',
    bg:{ note:'Алфа и бета са най-претоварените букви в ML и значението им е изцяло въпрос на контекст. В Adam β₁ и β₂ са коефициентите на двете пълзящи средни: β₁ ≈ 0.9 за градиента, β₂ ≈ 0.999 за квадратите му. В бета разпределението α и β са двата параметъра на формата и се четат като &bdquo;брой успехи&ldquo; и &bdquo;брой неуспехи&ldquo;. В статистиката α е нивото на значимост, обикновено 0.05, а β е вероятността за грешка от втори род. В линейната регресия β са самите коефициенти. При четене на статия винаги проверявай коя от тези конвенции е в сила.',
         ex:'В Adam стойността <span class="m">β₁ = 0.9</span> значи, че инерцията ефективно осреднява последните около 10 градиента, а <span class="m">β₂ = 0.999</span> — последните около 1000. Оттам идва и нуждата от корекция на отклонението в първите итерации.' },
    en:{ note:'Alpha and beta are the most overloaded letters in ML, and their meaning is entirely a matter of context. In Adam, β₁ and β₂ are the coefficients of the two running averages: β₁ ≈ 0.9 for the gradient, β₂ ≈ 0.999 for its squares. In the Beta distribution α and β are the two shape parameters, read as &bdquo;successes&ldquo; and &bdquo;failures&ldquo;. In statistics α is the significance level, usually 0.05, and β the probability of a type-II error. In linear regression β are the coefficients themselves. When reading a paper, always check which convention is in force.',
         ex:'In Adam, <span class="m">β₁ = 0.9</span> means momentum effectively averages the last ten or so gradients, and <span class="m">β₂ = 0.999</span> the last thousand or so. Hence the need for bias correction in the first iterations.' } },

  { ill:'node:series',
    bg:{ note:'Гама е дисконтиращият фактор в обучението с подкрепление: колко по-малко тежи награда, получена една стъпка по-късно. Стойност 0 значи напълно късоглед агент, който гледа само непосредствената награда; стойност близо до 1 значи агент, който планира далеч напред. Математически гама прави безкрайната сума от награди сходяща — без нея възвръщаемостта може да е безкрайна и нищо не се сравнява. Ефективният хоризонт е приблизително 1/(1−γ), което дава директна интуиция за избора. Същата буква се среща и като параметър на гама разпределението и като мащаб в RBF кернела.',
         ex:'При <span class="m">γ = 0.99</span> хоризонтът е около 100 стъпки; при <span class="m">γ = 0.9</span> — само 10. Един параметър решава дали агентът ще жертва непосредствена награда за по-голяма след 50 хода, или изобщо няма да я забележи.' },
    en:{ note:'Gamma is the discount factor in reinforcement learning: how much less a reward received one step later is worth. A value of 0 means a completely myopic agent that sees only the immediate reward; a value near 1 means an agent planning far ahead. Mathematically gamma makes the infinite sum of rewards convergent — without it the return can be infinite and nothing is comparable. The effective horizon is roughly 1/(1−γ), which gives direct intuition for the choice. The same letter also appears as a parameter of the gamma distribution and as a scale in the RBF kernel.',
         ex:'At <span class="m">γ = 0.99</span> the horizon is about 100 steps; at <span class="m">γ = 0.9</span> only 10. One parameter decides whether the agent will trade immediate reward for a larger one 50 moves later, or never notice it at all.' } },

  { ill:'node:lse',
    bg:{ note:'Епсилон обикновено означава &bdquo;много малко число&ldquo; и има три различни роли в ML. Първата е числена: добавя се вътре в логаритъм или в знаменател, за да няма log(0) или деление на нула — типично 1e−8. Втората е шум: ε ~ N(0,1) е стандартният начин да означиш случайната съставка, включително при трика с репараметризацията и при дифузионните модели. Третата е теоретична: в дефиниции за граница и сходимост епсилон е произволно малкото допустимо отклонение. Контекстът винаги разграничава трите, но е полезно да знаеш, че една и съща буква върши толкова различна работа.',
         ex:'В Adam делителят е <span class="m">√ŝ + ε</span> с <span class="m">ε = 1e−8</span> — без него параметър с нулев градиент би дал деление на нула. В дифузионен модел мрежата се учи да предсказва точно този ε: <span class="m">x̃ = x + σε</span>.' },
    en:{ note:'Epsilon usually means &bdquo;a very small number&ldquo; and has three distinct roles in ML. The first is numerical: it is added inside a log or a denominator so there is no log(0) or division by zero — typically 1e−8. The second is noise: ε ~ N(0,1) is the standard way to denote the random component, including in the reparameterization trick and in diffusion models. The third is theoretical: in definitions of limits and convergence, epsilon is the arbitrarily small tolerance. Context always separates the three, but it helps to know one letter does such different work.',
         ex:'In Adam the divisor is <span class="m">√ŝ + ε</span> with <span class="m">ε = 1e−8</span> — without it a parameter with zero gradient would divide by zero. In a diffusion model the network learns to predict exactly this ε: <span class="m">x̃ = x + σε</span>.' } },

  { ill:'node:simplex',
    bg:{ note:'Малкото пи има три несвързани значения и объркването им е често. В обучението с подкрепление π е политиката — функцията, която за дадено състояние дава разпределение върху действията, тоест самото поведение на агента. В комбинаториката π е пермутация, тоест разбъркване на реда. В теория на вероятностите π често означава вектор от вероятности, например стационарното разпределение на марковска верига или теглата на компонентите в смес. И трите се различават лесно: политиката има аргументи π(a|s), пермутацията действа върху нещо, вероятностният вектор има индекси.',
         ex:'В PPO ограничението е върху KL между <span class="m">π<sub>нова</sub></span> и <span class="m">π<sub>стара</sub></span> — двете политики. В GMM същата буква с индекс, <span class="m">π<sub>k</sub></span>, е теглото на k-тата компонента и сумата на всички е 1.' },
    en:{ note:'Lower-case pi has three unrelated meanings and confusing them is common. In reinforcement learning π is the policy — the function that, for a given state, returns a distribution over actions, that is, the agent behaviour itself. In combinatorics π is a permutation, a reshuffling of order. In probability theory π often denotes a vector of probabilities, for example the stationary distribution of a Markov chain or the mixture weights of components. All three are easy to tell apart: a policy takes arguments π(a|s), a permutation acts on something, a probability vector carries indices.',
         ex:'In PPO the constraint is on the KL between <span class="m">π<sub>new</sub></span> and <span class="m">π<sub>old</sub></span> — two policies. In a GMM the same letter with an index, <span class="m">π<sub>k</sub></span>, is the weight of the k-th component, and all of them sum to 1.' } },

  { ill:'node:cond',
    bg:{ note:'Капа означава число на обусловеност: отношението на най-голямата към най-малката сингулярна стойност на матрица. Мери колко силно малка грешка на входа се раздува на изхода, и затова е практическа мярка за това дали числено ще имаш проблеми. Стойност 1 е идеална, стойност над 1000 значи, че при fp16 си изгубил цялата налична точност. Същото число описва и трудността на оптимизацията: при голямо капа повърхността на загубата е тесен каньон и градиентното спускане зигзагира. Точно затова стандартизацията на признаци не е козметика — тя директно намалява капа.',
         ex:'Признаци &bdquo;възраст&ldquo; (18-80) и &bdquo;доход&ldquo; (20k-200k) в един модел дават <span class="m">κ ≈ 3000</span>. След стандартизация κ пада към 1-10 и същият learning rate изведнъж работи. Никаква промяна в модела, само в мащаба.' },
    en:{ note:'Kappa denotes the condition number: the ratio of largest to smallest singular value of a matrix. It measures how strongly a small input error is amplified at the output, and is therefore a practical gauge of whether you will hit numerical trouble. A value of 1 is ideal; above 1000 means that in fp16 you have lost all the available precision. The same number describes the difficulty of optimization: at large kappa the loss surface is a narrow canyon and gradient descent zig-zags. That is precisely why feature standardization is not cosmetic — it directly reduces kappa.',
         ex:'Features &bdquo;age&ldquo; (18-80) and &bdquo;income&ldquo; (20k-200k) in one model give <span class="m">κ ≈ 3000</span>. After standardization κ drops to 1-10 and the same learning rate suddenly works. No change to the model, only to the scale.' } },

  { ill:'node:fourier',
    bg:{ note:'Малката омега означава честота — колко бързо се променя дадена компонента. Появява се основно при преобразуванието на Фурие, където всяка функция се разлага на сбор от синуси с различни омеги. В ML това е важно на две места: при позиционните кодирания в трансформъра, които са буквално синуси с геометрично нарастващи честоти, и при анализа на спектралния отклон — наблюдението, че мрежите напасват първо ниските честоти. Голяма омега значи бърза осцилация, тоест фина детайлност; малка омега значи бавна, глобална структура. Съотношението между тях обяснява защо изображенията, генерирани в началото на обучението, изглеждат размазани.',
         ex:'Позиционното кодиране използва честоти <span class="m">ω<sub>k</sub> = 1/10000^(2k/d)</span> — от бавни до много бързи. Бавните различават далечни позиции, бързите различават съседни. Затова моделът може да сравнява относителни разстояния с линейни операции.' },
    en:{ note:'Lower-case omega denotes frequency — how fast a given component oscillates. It appears mainly in the Fourier transform, where any function decomposes into a sum of sines with different omegas. In ML this matters in two places: in transformer positional encodings, which are literally sines with geometrically increasing frequencies, and in the analysis of spectral bias — the observation that networks fit low frequencies first. Large omega means fast oscillation, that is, fine detail; small omega means slow, global structure. The ratio between them explains why images generated early in training look blurry.',
         ex:'Positional encoding uses frequencies <span class="m">ω<sub>k</sub> = 1/10000^(2k/d)</span> — from slow to very fast. The slow ones distinguish distant positions, the fast ones adjacent ones. That is how the model compares relative distances with linear operations.' } },

  { ill:'node:probax',
    bg:{ note:'Главната омега означава извадково пространство: множеството на всички възможни изходи от един случаен експеримент, преди изобщо да им е приписана вероятност. Това е най-абстрактният обект в основите на вероятността и в практическата работа рядко се пише явно. Значението му е, че фиксира какво изобщо може да се случи — извън омега нищо не съществува. Условието P(Ω) = 1 е просто твърдението, че нещо задължително се случва. Същата буква в теория на сложността означава долна граница, тоест &bdquo;не може по-бързо от това&ldquo; — контекстът разграничава лесно.',
         ex:'За зар <span class="m">Ω = {1,2,3,4,5,6}</span>. За езиков модел върху речник от 50 000 токена, Ω за един токен има 50 000 елемента, а за текст от 1000 токена — <span class="m">50000<sup>1000</sup></span> елемента.' },
    en:{ note:'Capital omega denotes the sample space: the set of all possible outcomes of a random experiment, before any probability has been assigned. It is the most abstract object in the foundations of probability and is rarely written out in practical work. Its role is to fix what can happen at all — outside omega nothing exists. The condition P(Ω) = 1 is simply the statement that something must happen. The same letter in complexity theory means a lower bound, that is, &bdquo;it cannot be faster than this&ldquo; — context separates the two easily.',
         ex:'For a die, <span class="m">Ω = {1,2,3,4,5,6}</span>. For a language model over a 50,000-token vocabulary, Ω for one token has 50,000 elements, and for a 1000-token text <span class="m">50000<sup>1000</sup></span> of them.' } },

  { ill:'node:entropy',
    bg:{ note:'Главното H означава ентропия — средното количество изненада в едно разпределение, или еквивалентно колко бита ти трябват средно, за да го кодираш. Максимална е при равномерно разпределение и нула при пълна сигурност. Същата буква обозначава и матрицата на Хесе, но двете почти никога не се появяват в един и същ контекст. Ентропията на изходното разпределение на един модел е директна мярка за това колко е несигурен: висока ентропия значи размазано разпределение, ниска — уверено. Дървото на решенията избира разделяне точно по това колко ентропия премахва.',
         ex:'Честна монета: <span class="m">H = 1</span> бит. Нагласена с <span class="m">p = 0.9</span>: <span class="m">H = 0.47</span> бита. Равномерно по 50 000 токена: <span class="m">H = log₂50000 ≈ 15.6</span> бита — това е ентропията на модел, който не знае абсолютно нищо.' },
    en:{ note:'Capital H denotes entropy — the average amount of surprise in a distribution, or equivalently how many bits you need on average to encode it. It is maximal for a uniform distribution and zero under complete certainty. The same letter also denotes the Hessian matrix, but the two almost never appear in the same context. The entropy of a model output distribution is a direct measure of how unsure it is: high entropy means a smeared distribution, low means a confident one. A decision tree picks its split by exactly how much entropy it removes.',
         ex:'A fair coin: <span class="m">H = 1</span> bit. Biased at <span class="m">p = 0.9</span>: <span class="m">H = 0.47</span> bits. Uniform over 50,000 tokens: <span class="m">H = log₂50000 ≈ 15.6</span> bits — the entropy of a model that knows absolutely nothing.' } },

  { ill:'node:kl',
    bg:{ note:'Записът D<sub>KL</sub> означава разстояние на Кулбак-Лайблер — мярка колко се различават две разпределения. Не е истинско разстояние: не е симетрично и не спазва триъгълното неравенство, затова двойната черта вътре подчертава, че редът има значение. Винаги е неотрицателно и нула само когато двете разпределения съвпадат точно. Практически най-важното е кога е безкрайно: щом p слага маса там, където q слага нула, KL става ∞ и градиентът не носи никаква информация. Точно това е провалът, който Wasserstein разстоянието поправя, и точно затова KL се използва като наказание, а не като основна цел при GAN-ове.',
         ex:'Forward KL размазва q, за да покрие всички моди на p; reverse KL кара q да се залепи за една мода. VAE използва reverse KL и точно затова генерираните изображения често са размазани, но не и невъзможни.' },
    en:{ note:'The notation D<sub>KL</sub> denotes the Kullback-Leibler divergence — a measure of how different two distributions are. It is not a true distance: it is not symmetric and violates the triangle inequality, which is why the double bar inside stresses that order matters. It is always non-negative and zero only when the two distributions coincide exactly. Practically the most important question is when it is infinite: as soon as p puts mass where q puts none, KL becomes ∞ and the gradient carries no information at all. That is precisely the failure Wasserstein distance repairs, and precisely why KL is used as a penalty rather than a primary objective in GANs.',
         ex:'Forward KL smears q to cover every mode of p; reverse KL makes q latch onto a single mode. A VAE uses reverse KL, which is exactly why generated images are often blurry but never impossible.' } },

  { ill:'node:mi',
    bg:{ note:'Записът I(X;Y) означава взаимна информация: колко научаваш за едната величина, като видиш другата. Симетрична е, за разлика от KL, и е нула точно когато двете са независими. Основното ѝ предимство пред корелацията е, че улавя зависимости от всякакъв вид, не само линейни — величини с нулева корелация може да имат огромна взаимна информация. Формално се дефинира като KL между съвместното разпределение и произведението на маргиналите, тоест колко далеч е реалността от независимостта. В ML е основата на контрастивното обучение: InfoNCE е практическа долна граница на точно тази величина.',
         ex:'За X симетрично около нулата и <span class="m">Y = X²</span> корелацията е точно 0, но взаимната информация е голяма, защото Y се определя изцяло от X. Затова при подбор на признаци корелационната матрица пропуска неща, които взаимната информация вижда.' },
    en:{ note:'The notation I(X;Y) denotes mutual information: how much you learn about one variable by seeing the other. It is symmetric, unlike KL, and zero exactly when the two are independent. Its main advantage over correlation is that it captures dependence of any kind, not just linear — variables with zero correlation can carry enormous mutual information. Formally it is defined as the KL between the joint distribution and the product of the marginals, that is, how far reality sits from independence. In ML it underpins contrastive learning: InfoNCE is a practical lower bound on exactly this quantity.',
         ex:'For X symmetric about zero and <span class="m">Y = X²</span> the correlation is exactly 0, yet the mutual information is large, because Y is entirely determined by X. Hence a correlation matrix misses things during feature selection that mutual information sees.' } },

  { ill:'node:objective',
    bg:{ note:'L и J са двете обичайни имена за целевата функция — числото, което обучението минимизира. L идва от loss и се използва по-често в дълбокото обучение; J идва от cost и се среща повече в класическата оптимизация и в RL, където често означава нещо, което се максимизира. Малкото ℓ обикновено означава загубата за един пример, а голямото L — средното по целия набор. Разликата има значение при четене: ако видиш ∇L, това е градиент на средното, значи мащабът зависи от размера на батча. Всяка целева функция обикновено има два члена: съответствие с данните и наказание за сложност.',
         ex:'<span class="m">L(θ) = (1/N) Σ ℓ(f<sub>θ</sub>(x<sub>i</sub>), y<sub>i</sub>) + λR(θ)</span> обобщава почти цялото обучение. Ако забравиш делението на N, ефективният learning rate зависи от размера на батча и настройката спира да се пренася.' },
    en:{ note:'L and J are the two customary names for the objective function — the number training minimizes. L comes from loss and is more common in deep learning; J comes from cost and appears more in classical optimization and in RL, where it often denotes something being maximized. Lower-case ℓ usually means the loss for a single example, and capital L the average over the whole set. The distinction matters when reading: if you see ∇L, that is the gradient of an average, so its scale depends on the batch size. Every objective usually has two terms: fit to the data and a penalty for complexity.',
         ex:'<span class="m">L(θ) = (1/N) Σ ℓ(f<sub>θ</sub>(x<sub>i</sub>), y<sub>i</sub>) + λR(θ)</span> summarizes nearly all of training. Forget the division by N and the effective learning rate depends on batch size, so tuning stops transferring.' } },

  { ill:'node:lagrange',
    bg:{ note:'Ръкописното ℒ означава лагранжиан — комбинираната функция при оптимизация с ограничения. Строи се като целевата функция плюс множител по ограничението, и трикът е, че търсенето на седлова точка на този израз решава изходната задача. Множителят λ има директен смисъл: той е цената на ограничението, тоест колко би спечелила целта, ако разхлабиш условието с единица. Оттам идва дуалната формулировка на SVM, а с нея и кернел трикът. Внимавай да не объркаш ℒ с обикновеното L за загуба — ръкописният шрифт е нарочен и обикновено се спазва.',
         ex:'SVM: минимизирай <span class="m">½‖w‖²</span> при условие всяка точка да е правилно класифицирана с отстъп поне 1. Дуалът зависи от данните само през скаларните произведения — и точно там влиза кернелът.' },
    en:{ note:'The script ℒ denotes the Lagrangian — the combined function in constrained optimization. It is built as the objective plus a multiplier times the constraint, and the trick is that finding a saddle point of this expression solves the original problem. The multiplier λ has a direct meaning: it is the price of the constraint, that is, how much the objective would gain if you relaxed the condition by one unit. From there comes the dual formulation of SVM, and with it the kernel trick. Take care not to confuse ℒ with the ordinary L for loss — the script font is deliberate and usually respected.',
         ex:'SVM: minimize <span class="m">½‖w‖²</span> subject to every point being correctly classified with margin at least 1. The dual depends on the data only through dot products — and that is exactly where the kernel enters.' } },

  { ill:'g:argmin',
    bg:{ note:'Записът arg min значи &bdquo;аргументът, при който се достига минимумът&ldquo;, а не самата минимална стойност. Разликата е съществена: min L(θ) е число, arg min L(θ) е точка в пространството на параметрите. При обучение те интересува второто — искаш модела, не стойността на загубата му. Ако функцията има няколко еднакво добри минимума, arg min технически е множество, а не една точка; при неизпъкнали задачи това е нормално. Точно затова две обучения с различен seed дават различни модели, често с еднакво добра точност.',
         ex:'Ако <span class="m">L(θ) = (θ−3)²</span>, то <span class="m">min L = 0</span>, а <span class="m">arg min L = 3</span>. Първото ти казва колко добър е моделът, второто ти дава самия модел. В статии почти винаги ще видиш arg min, защото него търсиш.' },
    en:{ note:'The notation arg min means &bdquo;the argument at which the minimum is attained&ldquo;, not the minimum value itself. The distinction is essential: min L(θ) is a number, arg min L(θ) is a point in parameter space. During training you care about the second — you want the model, not the value of its loss. If the function has several equally good minima, arg min is technically a set rather than a single point; for non-convex problems that is the normal case. That is exactly why two training runs with different seeds give different models, often equally accurate.',
         ex:'If <span class="m">L(θ) = (θ−3)²</span>, then <span class="m">min L = 0</span> while <span class="m">arg min L = 3</span>. The first tells you how good the model is, the second gives you the model. Papers almost always write arg min, because that is what you are after.' } },

  { ill:'node:vec',
    bg:{ note:'Записът ℝⁿ означава множеството на всички редици от n реални числа, тоест n-мерното реално пространство. Всяка точка в него е един вектор, а n е броят координати. Това е стандартният начин да кажеш &bdquo;този обект се описва с n числа&ldquo;, без да уточняваш какви са те. В ML почти всичко живее в такова пространство: изображение 224×224 RGB е точка в ℝ¹⁵⁰⁵²⁸, embedding на дума — в ℝ⁷⁶⁸, параметрите на модел — в ℝ⁷·¹⁰⁹. Двойното удебелено R е конвенция за &bdquo;реални числа&ldquo;, различна от обикновеното R, което обикновено е нещо друго.',
         ex:'<span class="m">x ∈ ℝ³</span> значи, че x е вектор от три числа. Записът <span class="m">f: ℝⁿ → ℝᵐ</span> описва функция, която приема n числа и връща m — точно формата на един слой в мрежа.' },
    en:{ note:'The notation ℝⁿ denotes the set of all lists of n real numbers, that is, n-dimensional real space. Every point in it is a vector, and n is the number of coordinates. This is the standard way of saying &bdquo;this object is described by n numbers&ldquo; without specifying what they are. In ML nearly everything lives in such a space: a 224×224 RGB image is a point in ℝ¹⁵⁰⁵²⁸, a word embedding in ℝ⁷⁶⁸, the parameters of a model in ℝ⁷·¹⁰⁹. The double-struck R is a convention for &bdquo;the reals&ldquo;, distinct from a plain R, which usually means something else.',
         ex:'<span class="m">x ∈ ℝ³</span> means x is a vector of three numbers. The notation <span class="m">f: ℝⁿ → ℝᵐ</span> describes a function taking n numbers and returning m — exactly the shape of one layer in a network.' } },

  { ill:'node:setlogic',
    bg:{ note:'Знакът ∈ значи &bdquo;принадлежи на&ldquo; или &bdquo;е елемент на&ldquo; и свързва обект с множеството, в което той живее. Отляво стои елементът, отдясно — множеството. Това е най-често срещаният знак в математическите дефиниции и обикновено носи цялата информация за типа на обекта. Когато в статия срещнеш x ∈ ℝⁿ, това е еквивалентът на декларация на тип в програмирането. Зачеркнатият вариант ∉ значи обратното. Не се бърка с ⊆, което свързва две множества, а не елемент с множество — това е честа грешка при писане.',
         ex:'<span class="m">θ ∈ ℝ<sup>D</sup></span> значи &bdquo;моделът има D параметъра&ldquo;. <span class="m">π ∈ Π(μ,ν)</span> значи &bdquo;π е валиден транспортен план&ldquo;. Във всеки случай знакът ти казва точно какъв вид обект четеш.' },
    en:{ note:'The sign ∈ means &bdquo;belongs to&ldquo; or &bdquo;is an element of&ldquo; and links an object with the set it lives in. On the left sits the element, on the right the set. It is the most frequent sign in mathematical definitions and usually carries all the type information about the object. When a paper writes x ∈ ℝⁿ, that is the equivalent of a type declaration in programming. The struck-through variant ∉ means the opposite. It is not interchangeable with ⊆, which links two sets rather than an element and a set — a common writing error.',
         ex:'<span class="m">θ ∈ ℝ<sup>D</sup></span> means &bdquo;the model has D parameters&ldquo;. <span class="m">π ∈ Π(μ,ν)</span> means &bdquo;π is a valid transport plan&ldquo;. In every case the sign tells you exactly what kind of object you are reading.' } },

  { ill:'node:setlogic',
    bg:{ note:'Знаците ⊆ и ⊂ означават подмножество: всеки елемент на едното е и елемент на другото. Разликата между двата варианта е конвенция — някои автори използват ⊂ само за строго подмножество, други ги смятат за синоними, затова при четене е добре да провериш. Свързват две множества, за разлика от ∈, което свързва елемент с множество. В ML се среща при описване на подпространства, на носители на разпределения, и при формулиране на кои функции може да представи даден клас модели. Твърдението, че един клас хипотези е подмножество на друг, е точният начин да кажеш, че вторият е по-изразителен.',
         ex:'<span class="m">данни ⊂ ℳ ⊂ ℝ<sup>d</sup></span> е компактният начин да кажеш, че реалните данни заемат тънко многообразие вътре в огромно пространство — и точно това прави обучението изобщо възможно.' },
    en:{ note:'The signs ⊆ and ⊂ denote a subset: every element of one is also an element of the other. The difference between the two variants is a convention — some authors use ⊂ only for a strict subset, others treat them as synonyms, so it pays to check when reading. They link two sets, unlike ∈, which links an element with a set. In ML they appear when describing subspaces, the supports of distributions, and when stating which functions a given model class can represent. Saying one hypothesis class is a subset of another is the precise way of saying the second is more expressive.',
         ex:'<span class="m">data ⊂ ℳ ⊂ ℝ<sup>d</sup></span> is the compact way of saying that real data occupies a thin manifold inside an enormous space — and that is exactly what makes learning possible at all.' } },

  { ill:'node:setlogic',
    bg:{ note:'Обърнатото A означава &bdquo;за всяко&ldquo; и е универсалният квантор. Твърдение с ∀ казва, че нещо важи без изключение за целия обхват. Силата му зависи изцяло от това с какво е комбиниран и в какъв ред: &bdquo;∀x ∃y&ldquo; е много по-слабо от &bdquo;∃y ∀x&ldquo;, защото в първия случай подходящото y може да е различно за всяко x, а във втория трябва да има едно, което върши работа за всички. Тази разлика в реда на кванторите е може би най-честият източник на неразбиране при четене на теоретични статии. Гаранция с грешен ред на кванторите е несравнимо по-слаба, отколкото изглежда.',
         ex:'&bdquo;За всяко ε &gt; 0 съществува N…&ldquo; — стандартното начало на дефиниция за сходимост. Тук N зависи от ε и това е нормално. Ако беше &bdquo;съществува N за всяко ε&ldquo;, твърдението щеше да е много по-силно и обикновено невярно.' },
    en:{ note:'The inverted A means &bdquo;for all&ldquo; and is the universal quantifier. A statement with ∀ says something holds without exception across the whole range. Its strength depends entirely on what it is combined with and in what order: &bdquo;∀x ∃y&ldquo; is far weaker than &bdquo;∃y ∀x&ldquo;, because in the first the suitable y may differ for each x, while in the second there must be one that works for all. This difference in quantifier order is possibly the most common source of misreading in theory papers. A guarantee with the wrong quantifier order is incomparably weaker than it looks.',
         ex:'&bdquo;For every ε &gt; 0 there exists N…&ldquo; — the standard opening of a convergence definition. Here N depends on ε, and that is normal. Were it &bdquo;there exists N for every ε&ldquo;, the claim would be far stronger and usually false.' } },

  { ill:'node:setlogic',
    bg:{ note:'Обърнатото E означава &bdquo;съществува&ldquo; и е екзистенциалният квантор. Твърди, че поне един обект с дадено свойство има, без да казва кой е той или как да го намериш. Точно това е разликата между съществуване и конструкция: много теореми в оптимизацията гарантират, че оптимум съществува, но не дават никакъв начин да го намериш. Вариантът ∃! значи &bdquo;съществува точно един&ldquo; и е много по-силно твърдение. При четене на теоретични резултати винаги си струва да питаш дали доказателството е конструктивно, защото ако не е, практическата стойност може да е нулева.',
         ex:'Теоремата на Брение казва, че оптималното транспортно изображение <em>съществува</em> и е единствено — но не казва как да го сметнеш. Отделен ред работа е нужен, за да се стигне до алгоритъм като Синкхорн.' },
    en:{ note:'The inverted E means &bdquo;there exists&ldquo; and is the existential quantifier. It asserts that at least one object with a given property exists, without saying which one or how to find it. That is exactly the difference between existence and construction: many theorems in optimization guarantee that an optimum exists but give no way to locate it. The variant ∃! means &bdquo;there exists exactly one&ldquo; and is a much stronger claim. When reading theoretical results it is always worth asking whether the proof is constructive, because if it is not, the practical value may be nil.',
         ex:'Brenier theorem says the optimal transport map <em>exists</em> and is unique — but says nothing about how to compute it. A separate line of work is needed to reach an algorithm like Sinkhorn.' } },

  { ill:'node:setlogic',
    bg:{ note:'Знакът ∪ означава обединение — всичко, което е в едното или в другото множество, включително и в двете. Знакът ∩ означава сечение — само това, което е и в двете едновременно. Двата се четат като логическите &bdquo;или&ldquo; и &bdquo;и&ldquo;, което е и формалната връзка между теория на множествата и логиката. Във вероятностите правилото за обединение е P(A ∪ B) = P(A) + P(B) − P(A∩B), а изваждането е нужно, защото иначе сечението се брои два пъти. Само когато събитията са несъвместими, тоест сечението е празно, вероятностите просто се събират.',
         ex:'Вероятността поне един от два независими компонента да откаже с <span class="m">P = 0.01</span> всеки е <span class="m">0.01 + 0.01 − 0.0001 = 0.0199</span>, не 0.02. При стотици компоненти пренебрегването на сечението вече не е дребна разлика.' },
    en:{ note:'The sign ∪ means union — everything in one set or the other, including in both. The sign ∩ means intersection — only what is in both at once. They read as the logical &bdquo;or&ldquo; and &bdquo;and&ldquo;, which is also the formal link between set theory and logic. In probability the union rule is P(A ∪ B) = P(A) + P(B) − P(A∩B), and the subtraction is needed because otherwise the intersection is counted twice. Only when the events are disjoint, that is the intersection is empty, do the probabilities simply add.',
         ex:'The probability that at least one of two independent components fails, each with <span class="m">P = 0.01</span>, is <span class="m">0.01 + 0.01 − 0.0001 = 0.0199</span>, not 0.02. Across hundreds of components, ignoring the intersection stops being a small difference.' } },

  { ill:'g:arrow',
    bg:{ note:'Стрелката надясно има две различни значения и контекстът ги разграничава. В граници и сходимост тя значи &bdquo;клони към&ldquo;: xₙ → 0 казва, че редицата се приближава към нула. В дефиниции на функции значи &bdquo;изобразява в&ldquo;: f: ℝⁿ → ℝᵐ казва каква е формата на входа и на изхода. Второто значение носи същата информация като типова декларация в програмирането и е най-бързият начин да разбереш какво прави даден слой. Вариантът ↦ с малка вертикална чертичка е по-специфичен и означава как точно се изобразява конкретен елемент, а не цялото пространство.',
         ex:'<span class="m">f: ℝ<sup>768</sup> → ℝ<sup>50000</sup></span> описва изходния слой на езиков модел. А <span class="m">x ↦ Wx + b</span> казва какво точно прави с всеки елемент. Първото е за пространства, второто — за отделни точки.' },
    en:{ note:'The right arrow has two distinct meanings and context separates them. In limits and convergence it means &bdquo;tends to&ldquo;: xₙ → 0 says the sequence approaches zero. In function definitions it means &bdquo;maps into&ldquo;: f: ℝⁿ → ℝᵐ states the shape of the input and the output. The second meaning carries the same information as a type declaration in programming and is the fastest way to understand what a layer does. The variant ↦ with a small vertical bar is more specific and says how a particular element is mapped, rather than the whole space.',
         ex:'<span class="m">f: ℝ<sup>768</sup> → ℝ<sup>50000</sup></span> describes the output layer of a language model. And <span class="m">x ↦ Wx + b</span> says what it does to each element. The first is about spaces, the second about individual points.' } },

  { ill:'node:gd',
    bg:{ note:'Стрелката наляво означава присвояване: лявата страна получава стойността на дясната. Използва се вместо знак за равенство точно когато твърдението не е равенство, а действие — θ ← θ − η∇L не казва, че двете страни са равни, а че старото θ се заменя с новото. Това е същата разлика като между <code>=</code> и <code>==</code> в програмирането. Ако видиш формула, която с равенство би била противоречива, почти сигурно става дума за присвояване. В псевдокод на алгоритми този знак се среща постоянно и е ключът към четенето на итеративни методи.',
         ex:'<span class="m">θ ← θ − η∇L(θ)</span> е една стъпка на градиентно спускане. Като равенство това би значило ∇L = 0, тоест че вече си в оптимума — очевидно не е това, което се има предвид.' },
    en:{ note:'The left arrow denotes assignment: the left side takes the value of the right. It is used instead of an equals sign precisely when the statement is not an equality but an action — θ ← θ − η∇L does not say the two sides are equal, but that the old θ is replaced by the new one. This is the same distinction as between <code>=</code> and <code>==</code> in programming. If you meet a formula that would be contradictory as an equality, it is almost certainly an assignment. In algorithm pseudocode this sign appears constantly and is the key to reading iterative methods.',
         ex:'<span class="m">θ ← θ − η∇L(θ)</span> is one step of gradient descent. As an equality it would mean ∇L = 0, that is, that you are already at the optimum — plainly not what is intended.' } },

  { ill:'node:taylor',
    bg:{ note:'Вълнистото равенство означава приблизително равно и почти винаги крие премълчано условие за това кога приближението е валидно. В анализа обикновено означава, че разликата е малка от по-висок ред — при развитие в ред на Тейлър грешката расте като кубa на стъпката. В практическата работа често значи просто &bdquo;със закръгляне&ldquo;. Разликата има значение: приближение от първи ред е добро само в малка околност, което е точната причина learning rate-ът да не може да е произволно голям. Когато в статия видиш ≈, полезният въпрос е &bdquo;при какви условия и с каква грешка&ldquo;.',
         ex:'<span class="m">e<sup>x</sup> ≈ 1 + x + x²/2</span> дава при <span class="m">x = 0.1</span> стойност 1.105 срещу истинската 1.10517 — грешка под 0.02%. При <span class="m">x = 2</span> обаче дава 5.0 срещу 7.39, тоест 32% грешка. Същата формула, различна околност.' },
    en:{ note:'The wavy equals means approximately equal and almost always hides an unstated condition on when the approximation is valid. In analysis it usually means the difference is of higher order — in a Taylor expansion the error grows as the cube of the step. In practical work it often just means &bdquo;up to rounding&ldquo;. The distinction matters: a first-order approximation is good only in a small neighbourhood, which is the precise reason a learning rate cannot be arbitrarily large. When you see ≈ in a paper, the useful question is &bdquo;under what conditions and with what error&ldquo;.',
         ex:'<span class="m">e<sup>x</sup> ≈ 1 + x + x²/2</span> gives 1.105 at <span class="m">x = 0.1</span> against a true 1.10517 — under 0.02% error. At <span class="m">x = 2</span>, however, it gives 5.0 against 7.39, a 32% error. Same formula, different neighbourhood.' } },

  { ill:'g:prop',
    bg:{ note:'Знакът ∝ значи &bdquo;пропорционално на&ldquo;: двете страни се различават само с константа, която не зависи от променливата. Използва се, когато константата е известна, но неудобна за писане, или неизвестна, но несъществена. Най-важната му употреба в ML е при Бейс: постериор ∝ правдоподобие × приор, където премълчаната константа е нормировката P(D), която почти винаги е неизчислима. Понеже търсиш максимум, а константата не мести максимума, тя спокойно се изхвърля. Същият трик стои и зад score matching: градиентът на логаритмичната плътност не зависи от нормиращата константа.',
         ex:'<span class="m">p(θ|D) ∝ p(D|θ)p(θ)</span> — изхвърлената константа е <span class="m">p(D) = ∫p(D|θ)p(θ)dθ</span>, интеграл, който в общия случай не се смята. Затова MAP оценката е достъпна, а пълният постериор — не.' },
    en:{ note:'The sign ∝ means &bdquo;proportional to&ldquo;: the two sides differ only by a constant that does not depend on the variable. It is used when the constant is known but inconvenient to write, or unknown but irrelevant. Its most important use in ML is in Bayes: posterior ∝ likelihood × prior, where the suppressed constant is the normalizer P(D), which is almost always intractable. Since you are after a maximum and the constant does not move the maximum, it can safely be dropped. The same trick underlies score matching: the gradient of a log-density does not depend on the normalizing constant.',
         ex:'<span class="m">p(θ|D) ∝ p(D|θ)p(θ)</span> — the dropped constant is <span class="m">p(D) = ∫p(D|θ)p(θ)dθ</span>, an integral that is generally not computable. Hence the MAP estimate is accessible while the full posterior is not.' } },

  { ill:'node:orth',
    bg:{ note:'Знакът ⊥ означава перпендикулярност: скаларното произведение на двата обекта е нула. В две измерения това е познатият прав ъгъл, но понятието се обобщава до произволна размерност и дори до пространства от функции. Смисълът в ML е, че перпендикулярните посоки не си влияят — промяна по едната не се отразява на другата. Точно това свойство прави PCA компонентите независими и е причината ортогоналната инициализация да пази сигнала жив през дълбоки мрежи. При най-малките квадрати остатъкът е перпендикулярен на всички признаци, и точно това условие определя решението.',
         ex:'Ако <span class="m">a·b = 0</span>, двата вектора нямат обща компонента. При регресия условието остатъкът ⊥ признаците дава нормалните уравнения <span class="m">X<sup>T</sup>(y − Xβ) = 0</span> — оттам следва цялата формула за β.' },
    en:{ note:'The sign ⊥ denotes perpendicularity: the dot product of the two objects is zero. In two dimensions that is the familiar right angle, but the notion generalizes to any dimension and even to spaces of functions. Its meaning in ML is that perpendicular directions do not interfere — a change along one has no effect on the other. That property is what makes PCA components independent and why orthogonal initialization keeps a signal alive through deep networks. In least squares the residual is perpendicular to every feature, and that condition alone determines the solution.',
         ex:'If <span class="m">a·b = 0</span>, the two vectors share no component. In regression, the condition residual ⊥ features gives the normal equations <span class="m">X<sup>T</sup>(y − Xβ) = 0</span> — the whole formula for β follows from it.' } },

  { ill:'node:bigo',
    bg:{ note:'Голямото О описва как расте разходът с размера на входа, без да се интересува от константи и от по-бавно растящи членове. O(n²) значи, че удвояването на входа учетворява работата, независимо дали константата отпред е 3 или 300. Точно затова е полезно за архитектурни решения и безполезно за микрооптимизация. В ML най-важният пример е attention: O(n²) по дължина на последователността значи, че 100 пъти по-дълъг контекст струва 10 000 пъти повече. Почти всяка архитектурна иновация за дълъг контекст от последните години е опит да се свали точно тази степен.',
         ex:'Матричното умножение е <span class="m">O(n³)</span> — удвоиш ли модела, смятането става 8×. Sparse attention сваля до <span class="m">O(n√n)</span>, а Mamba до <span class="m">O(n)</span>. Разликата между n² и n при 128 000 токена е около 128 000 пъти.' },
    en:{ note:'Big O describes how cost grows with input size, ignoring constants and slower-growing terms. O(n²) means doubling the input quadruples the work, whether the leading constant is 3 or 300. That is exactly why it is useful for architectural decisions and useless for micro-optimization. In ML the most important example is attention: O(n²) in sequence length means a 100× longer context costs 10,000× more. Nearly every long-context architectural innovation of recent years is an attempt to lower exactly this exponent.',
         ex:'Matrix multiplication is <span class="m">O(n³)</span> — double the model and the compute goes up 8×. Sparse attention brings it to <span class="m">O(n√n)</span>, Mamba to <span class="m">O(n)</span>. At 128,000 tokens the gap between n² and n is about 128,000-fold.' } },

  { ill:'node:count',
    bg:{ note:'Удивителният знак след число означава факториел: произведението на всички цели числа от 1 до това число. Расте по-бързо от всяка експонента и точно затова изчерпателното търсене над пермутации е безнадеждно още при малки размери. В ML се появява в комбинаторни задачи — подредби, съответствия, брой възможни разбивания. Полезно е да имаш чувство за мащаба: 10! е около 3.6 милиона, 20! е вече 2.4·10¹⁸. Приближението на Стирлинг дава удобен начин да работиш с логаритъм от факториел, което е това, което реално ти трябва в изчисленията.',
         ex:'Съпоставянето на 20 предсказани обекта с 20 истински има <span class="m">20! ≈ 2.4·10<sup>18</sup></span> възможни съответствия. Унгарският алгоритъм намира оптималното за <span class="m">O(n³) = 8000</span> операции — разликата между невъзможно и мигновено.' },
    en:{ note:'An exclamation mark after a number denotes the factorial: the product of all integers from 1 up to it. It grows faster than any exponential, which is exactly why exhaustive search over permutations is hopeless even at small sizes. In ML it appears in combinatorial problems — orderings, matchings, counts of possible partitions. It helps to have a feel for the scale: 10! is about 3.6 million, 20! is already 2.4·10¹⁸. Stirling approximation gives a convenient way to work with the log of a factorial, which is what you actually need in computations.',
         ex:'Matching 20 predicted objects to 20 true ones has <span class="m">20! ≈ 2.4·10<sup>18</sup></span> possible assignments. The Hungarian algorithm finds the optimum in <span class="m">O(n³) = 8000</span> operations — the difference between impossible and instant.' } },

  { ill:'node:binomthm',
    bg:{ note:'Записът с две числа в скоби едно над друго се чете &bdquo;n над k&ldquo; и е биномният коефициент: броят начини да избереш k елемента от n, без да те интересува редът. Различава се от пермутациите точно по това — там редът има значение, тук не. Стойността е n! / (k!(n−k)!), но директното смятане с факториели препълва бързо, затова на практика се смята итеративно или в логаритми. Симетричен е: C(n,k) = C(n,n−k), тоест да избереш кои влизат е същото като да избереш кои остават. В ML се появява при биномното разпределение и при оценка на размера на пространства за търсене.',
         ex:'<span class="m">C(8,3) = 56</span> начина да избереш 3 от 8. Броят на всички подмножества на n елемента е <span class="m">2<sup>n</sup></span>, което при n = 30 вече е милиард — оттам идва и безнадеждността на изчерпателния подбор на признаци.' },
    en:{ note:'Two numbers in brackets, one above the other, read as &bdquo;n choose k&ldquo; and form the binomial coefficient: the number of ways to pick k elements from n when order does not matter. It differs from permutations in exactly that — there order matters, here it does not. The value is n! / (k!(n−k)!), but computing it directly with factorials overflows fast, so in practice it is computed iteratively or in logs. It is symmetric: C(n,k) = C(n,n−k), so choosing who is in is the same as choosing who is left out. In ML it appears in the binomial distribution and in sizing search spaces.',
         ex:'<span class="m">C(8,3) = 56</span> ways to pick 3 out of 8. The number of all subsets of n elements is <span class="m">2<sup>n</sup></span>, which at n = 30 is already a billion — hence the hopelessness of exhaustive feature selection.' } },

  { ill:'node:desc',
    bg:{ note:'Чертата над буква означава средно аритметично от извадка — сборът, разделен на броя. Различава се от мю, което е истинското средно на популацията: x с черта се смята от конкретни данни и затова е случайна величина със собствена дисперсия. Тази разлика е причината едно и също измерване върху различни извадки да дава различни числа. Стандартната грешка на извадковото средно е σ/√n, което дава директна интуиция колко данни ти трябват за дадена точност. Средното е чувствително към извънредни стойности — при асиметрични данни медианата казва повече.',
         ex:'Заплати 30, 32, 35, 38, 500 (хиляди): <span class="m">x̄ = 127</span>, медиана 35. Средното е технически вярно и практически безполезно. При оценка на модел върху 100 теста стандартната грешка е около 3% — разлика от 1% не значи нищо.' },
    en:{ note:'A bar over a letter denotes the arithmetic mean of a sample — the sum divided by the count. It differs from mu, the true population mean: x-bar is computed from concrete data and is therefore a random variable with its own variance. That distinction is why the same measurement on different samples gives different numbers. The standard error of the sample mean is σ/√n, giving direct intuition for how much data you need for a given precision. The mean is sensitive to outliers — for skewed data the median says more.',
         ex:'Salaries 30, 32, 35, 38, 500 (thousands): <span class="m">x̄ = 127</span>, median 35. The mean is technically correct and practically useless. Evaluating a model on 100 tests, the standard error is about 3% — a 1% difference means nothing.' } },

  { ill:'node:ols',
    bg:{ note:'Шапката над y означава предсказана стойност, за разлика от голото y, което е истинската. Разликата между двете е остатъкът и точно тя се минимизира при обучение. Конвенцията е универсална и полезна: щом видиш шапка, знаеш, че числото идва от модел, а не от данните. При регресия ŷ е точка от напасната права, при класификация обикновено е вероятност или вектор от вероятности. Полезно е да следиш дали ŷ означава изход преди или след активация — при кръстосана ентропия разликата между логити и вероятности е честа причина за бъгове.',
         ex:'MSE загубата е <span class="m">(1/N)Σ(y<sub>i</sub> − ŷ<sub>i</sub>)²</span>. В PyTorch <code>CrossEntropyLoss</code> очаква логити, а не вероятности — подадеш ли ŷ след softmax, softmax се прилага втори път и обучението тихо се влошава.' },
    en:{ note:'A hat over y denotes a predicted value, as opposed to a bare y, which is the true one. The difference between them is the residual, and that is exactly what training minimizes. The convention is universal and useful: whenever you see a hat, you know the number came from a model rather than from the data. In regression ŷ is a point on the fitted line; in classification it is usually a probability or a vector of them. It pays to track whether ŷ means the output before or after the activation — with cross-entropy, confusing logits and probabilities is a frequent source of bugs.',
         ex:'The MSE loss is <span class="m">(1/N)Σ(y<sub>i</sub> − ŷ<sub>i</sub>)²</span>. In PyTorch <code>CrossEntropyLoss</code> expects logits, not probabilities — feed it ŷ after a softmax and the softmax is applied twice, quietly degrading training.' } },

  { ill:'chip:nn|dense',
    bg:{ note:'W и b са стандартните имена за теглата и отместването на един слой: W е матрицата, b е векторът, добавен накрая. Изразът Wx + b се нарича афинно преобразувание и е атомарната операция, до която се свежда почти всичко в дълбокото обучение. Формата на W казва всичко за слоя: (изход × вход). Отместването b позволява на слоя да не минава задължително през нулата, което е разликата между линейно и афинно. В много съвременни архитектури b се изпуска, защото нормализацията след слоя така или иначе премахва средното — тогава параметрите намаляват без загуба на изразителност.',
         ex:'Слой от 768 към 3072 има <span class="m">W ∈ ℝ<sup>3072×768</sup></span>, тоест 2.36 милиона тегла, плюс 3072 отмествания. В трансформър с 96 слоя само FFN частта е около 450 милиона параметъра.' },
    en:{ note:'W and b are the standard names for the weights and bias of a layer: W is the matrix, b the vector added at the end. The expression Wx + b is called an affine transformation and is the atomic operation nearly everything in deep learning reduces to. The shape of W tells you everything about the layer: (output × input). The bias b lets the layer avoid passing through the origin, which is the difference between linear and affine. In many modern architectures b is dropped, because the normalization that follows removes the mean anyway — parameters go down with no loss of expressiveness.',
         ex:'A layer from 768 to 3072 has <span class="m">W ∈ ℝ<sup>3072×768</sup></span>, that is 2.36 million weights, plus 3072 biases. In a 96-layer transformer the FFN part alone is about 450 million parameters.' } },

  { ill:'node:simplex',
    bg:{ note:'Главното делта има две основни значения. Като префикс пред величина означава разлика или изменение: Δθ е промяната в параметрите, ΔL — промяната в загубата. Като самостоятелен символ означава симплекс — множеството на всички валидни вероятностни вектори, тоест неотрицателни числа, чиято сума е 1. При три класа това е равностранен триъгълник; при K класа е (K−1)-мерно обобщение. Всеки изход на softmax лежи строго вътре в него, никога на границата, защото за връх биха били нужни безкрайни логити. Точно затова моделът никога не достига пълна увереност.',
         ex:'Центърът <span class="m">(⅓,⅓,⅓)</span> е пълна несигурност, върховете са абсолютна сигурност. При <code>temperature=0.1</code> изходите се притискат към върховете, при <code>temperature=2</code> — към центъра.' },
    en:{ note:'Capital delta has two main meanings. As a prefix before a quantity it denotes a difference or change: Δθ is the change in parameters, ΔL the change in loss. As a standalone symbol it denotes the simplex — the set of all valid probability vectors, that is, non-negative numbers summing to 1. With three classes it is an equilateral triangle; with K classes a (K−1)-dimensional generalization. Every softmax output lies strictly inside it, never on the boundary, because reaching a vertex would need infinite logits. That is exactly why a model never attains complete certainty.',
         ex:'The centre <span class="m">(⅓,⅓,⅓)</span> is total uncertainty, the vertices absolute certainty. At <code>temperature=0.1</code> outputs squeeze toward the vertices, at <code>temperature=2</code> toward the centre.' } },

  { ill:'chip:nn|softmax',
    bg:{ note:'Буквата z има две различни, но еднакво чести значения в ML. В класификация z са логитите: суровите изходи на последния слой, преди softmax да ги превърне във вероятности. Те могат да са произволни реални числа, включително отрицателни, и само разликите между тях носят смисъл — добавянето на константа към всички не променя нищо. В генеративните модели z е латентната променлива: скритият код, от който декодерът произвежда данни. При VAE z се тегли от нормално разпределение, при GAN е чист шум. Контекстът различава двете лесно, но си струва да си наясно, че една буква върши толкова различна работа.',
         ex:'Логити <span class="m">z = (2, 1, 0)</span> дават softmax <span class="m">(0.665, 0.245, 0.090)</span>. Логити <span class="m">(12, 11, 10)</span> дават точно същото — само разликите значат нещо. При VAE <span class="m">z ∈ ℝ<sup>128</sup></span> е целият &bdquo;смисъл&ldquo; на изображението, свит в 128 числа.' },
    en:{ note:'The letter z has two distinct but equally common meanings in ML. In classification, z are the logits: the raw outputs of the final layer, before softmax turns them into probabilities. They can be any real numbers, negative included, and only the differences between them carry meaning — adding a constant to all of them changes nothing. In generative models z is the latent variable: the hidden code from which a decoder produces data. In a VAE z is drawn from a normal distribution; in a GAN it is pure noise. Context separates the two easily, but it is worth knowing one letter does such different work.',

  function resolveGIll(ref){
    if(!ref) return null;
    var p = ref.indexOf(':');
    var kind = ref.slice(0, p), key = ref.slice(p + 1);
    if(kind === 'node') return ILLUS[key];
    if(kind === 'chip') return CILLUS[key];
    if(kind === 'g') return GILLUS[key];
    return null;
  }

  var gSel = null;   // независим от основната селекция

  function renderGloss(){
    glossEl.innerHTML = GLOSSARY.map(function(row, i){
      return '<button type="button" class="gl" data-gi="' + i + '"><span class="g">' + row[0] +
             '</span><span class="n">' + tx(row[1], row[3]) +
             '<em>' + tx(row[2], row[4]) + '</em></span></button>';
    }).join('');
    glossEl.querySelectorAll('.gl').forEach(function(b){
      b.addEventListener('click', function(){ selectGloss(parseInt(b.getAttribute('data-gi'), 10)); });
    });
    if(gSel !== null) applyGloss();
  }

  function clearGloss(){
    gSel = null;
    glossEl.classList.remove('sel');
    glossEl.querySelectorAll('.gl').forEach(function(b){ b.classList.remove('sel'); });
    glossDetail.classList.remove('show');
  }

  function selectGloss(i){
    if(gSel === i){ clearGloss(); return; }
    gSel = i;
    applyGloss();
    if(glossDetail.scrollIntoView) glossDetail.scrollIntoView({ behavior:'smooth', block:'nearest' });
  }

  function applyGloss(){
    var row = GLOSSARY[gSel], x = GX[gSel];
    if(!row || !x){ clearGloss(); return; }
    glossEl.classList.add('sel');
    glossEl.querySelectorAll('.gl').forEach(function(b){
      b.classList.toggle('sel', parseInt(b.getAttribute('data-gi'), 10) === gSel);
    });
    var c = (lang === 'en') ? x.en : x.bg;
    gdGlyph.innerHTML = row[0];
    gdRead.textContent = tx(row[1], row[3]);
    gdMean.innerHTML = tx(row[2], row[4]);
    gdNote.innerHTML = c.note;
    gdEx.innerHTML = c.ex;
    var make = resolveGIll(x.ill);
    if(make){ gdSecIll.style.display = ''; gdIll.innerHTML = make(); }
    else { gdSecIll.style.display = 'none'; gdIll.innerHTML = ''; }
    glossDetail.classList.add('show');
  }

  // ---------- избор ----------
  function resetVisual(){
    document.querySelectorAll('.pill').forEach(function(p){ p.classList.remove('selected','lit-p','lit-s','kin'); });
    document.querySelectorAll('.chip').forEach(function(c){ c.classList.remove('lit-p','lit-s','chip-origin'); });
    mapEl.classList.remove('sel-on');
    mapEl.querySelectorAll('.nd').forEach(function(g){ g.classList.remove('on','near'); });
    mapEl.querySelectorAll('.link').forEach(function(l){ l.classList.remove('on'); });
  }

  function clearSelection(){
    selection = null;
    resetVisual();
    wrapEl.classList.remove('sel-active');
    detail.classList.remove('show');
    clearBtn.disabled = true;
    egoLinks.innerHTML = '';
  }

  function selectNode(id, scroll){
    if(selection && selection.mode === 'node' && selection.id === id){ clearSelection(); return; }
    selection = { mode:'node', id:id };
    apply();
    if(scroll && detail.scrollIntoView) detail.scrollIntoView({ behavior:'smooth', block:'center' });
  }
  function selectChip(rail, chip){
    if(selection && selection.mode === 'chip' && selection.rail === rail && selection.chip === chip){ clearSelection(); return; }
    selection = { mode:'chip', rail:rail, chip:chip };
    apply();
    if(detail.scrollIntoView) detail.scrollIntoView({ behavior:'smooth', block:'center' });
  }

  function weightBar(w){
    var s = '';
    for(var i = 1; i <= 10; i++) s += '<i class="' + (i <= w ? 'f' : '') + '"></i>';
    return '<div class="wbar">' + s + '</div>';
  }

  function apply(){
    resetVisual();
    wrapEl.classList.add('sel-active');
    mapEl.classList.add('sel-on');
    clearBtn.disabled = false;
    var egoNodes = [], hub = '';

    if(selection.mode === 'node'){
      var n = N_BY_ID[selection.id];
      var pill = document.getElementById('p-' + n.id);
      if(pill) pill.classList.add('selected');
      var mn = document.getElementById('mn-' + n.id);
      if(mn) mn.classList.add('on');

      // предпоставки и зависими — родство
      var kin = (n.req || []).concat(USEDBY[n.id] || []);
      kin.forEach(function(kid){
        var kp = document.getElementById('p-' + kid); if(kp) kp.classList.add('kin');
        var km = document.getElementById('mn-' + kid); if(km) km.classList.add('near');
      });
      mapEl.querySelectorAll('.link').forEach(function(l){
        if(l.getAttribute('data-a') === n.id || l.getAttribute('data-b') === n.id) l.classList.add('on');
      });

      // връзки към ML концепции
      (n.e || []).forEach(function(key){
        var p = key.split('|');
        var c = document.getElementById('c-' + p[0] + '-' + p[1]);
        if(c) c.classList.add(p[2] === 'p' ? 'lit-p' : 'lit-s');
        var meta = CHIP[p[0] + '|' + p[1]];
        if(meta) egoNodes.push({ label:chipLabel(meta), tag:meta.rail.n + ' · ' + railTitle(meta.rail), w:p[2],
                                 target:{ mode:'chip', rail:p[0], chip:p[1] } });
      });

      var c = content(n);
      dEn.textContent = nodeLabel(n);
      dBg.textContent = tx(n.en, '');
      var tier = TIER(n.w);
      dWeight.innerHTML = '<span class="d-wnum">' + T().wLabel + ' <b>' + n.w + '</b> ' + T().wOf + '</span>' + weightBar(n.w) +
                          '<span class="d-tier">' + esc(tier.name) + '</span>';
      dNote.innerHTML = c.note;

      secFormula.style.display = ''; dFormula.innerHTML = c.f;
      secSym.style.display = '';
      dSym.innerHTML = (c.sym || []).map(function(r){
        return '<tr><td class="g">' + r[0] + '</td><td class="n">' + r[1] + '</td><td class="m">' + r[2] + '</td></tr>';
      }).join('');
      secEx.style.display = ''; dEx.innerHTML = c.ex;

      if(ILLUS[n.id]){ secIllus.style.display = ''; dIllus.innerHTML = ILLUS[n.id](); }
      else { secIllus.style.display = 'none'; dIllus.innerHTML = ''; }

      var kinTxt = (n.req || []).length
        ? ' ' + T().before + (n.req || []).map(function(r){ return N_BY_ID[r] ? nodeLabel(N_BY_ID[r]) : r; }).join(', ') + '.'
        : '';
      egoCap.textContent = T().usedIn(egoNodes.length) + kinTxt;
      hub = nodeLabel(n);

    } else {
      var meta2 = CHIP[selection.rail + '|' + selection.chip];
      var chipEl = document.getElementById('c-' + selection.rail + '-' + selection.chip);
      if(chipEl) chipEl.classList.add('chip-origin');
      var matches = (REVERSE[selection.rail + '|' + selection.chip] || []).slice();
      matches.sort(function(a,b){
        if(a.w !== b.w) return a.w === 'p' ? -1 : 1;
        return N_BY_ID[b.id].w - N_BY_ID[a.id].w;
      });
      matches.forEach(function(m){
        var p2 = document.getElementById('p-' + m.id);
        if(p2) p2.classList.add(m.w === 'p' ? 'lit-p' : 'lit-s');
        var mm = document.getElementById('mn-' + m.id);
        if(mm) mm.classList.add('on');
        egoNodes.push({ label:nodeLabel(N_BY_ID[m.id]) + '  ·  ' + N_BY_ID[m.id].w,
                        tag:groupShort(G_BY_ID[N_BY_ID[m.id].g]), w:m.w,
                        target:{ mode:'node', id:m.id } });
      });

      dEn.textContent = meta2 ? chipLabel(meta2) : selection.chip;
      dBg.textContent = meta2 ? (meta2.rail.n + ' — ' + railTitle(meta2.rail)) : '';
      var core = matches.filter(function(m){ return N_BY_ID[m.id].w >= 9; }).length;
      var avg = matches.length ? (matches.reduce(function(s,m){ return s + N_BY_ID[m.id].w; }, 0) / matches.length) : 0;
      dWeight.innerHTML = '<span class="d-wnum">' + T().avgW + ' <b>' + avg.toFixed(1) + '</b></span>' +
                          weightBar(Math.round(avg)) +
                          '<span class="d-tier">' + matches.length + ' ' + T().topics + ', ' + core + ' ' + T().ofCore + '</span>';
      var names = matches.map(function(m){ return nodeLabel(N_BY_ID[m.id]); }).join(', ');
      dNote.innerHTML = matches.length ? T().chipNote(esc(names)) : T().chipNone;

      secFormula.style.display = 'none'; secSym.style.display = 'none';
      secEx.style.display = 'none';
      var makeC = CILLUS[selection.rail + '|' + selection.chip];
      if(makeC){ secIllus.style.display = ''; dIllus.innerHTML = makeC(); }
      else { secIllus.style.display = 'none'; dIllus.innerHTML = ''; }
      egoCap.textContent = T().needMath;
      hub = meta2 ? chipLabel(meta2) : '';
    }

    detail.classList.add('show');
    buildEgo(hub, egoNodes);
  }

  // ---------- его-граф ----------
  function egoHtml(n){
    var t = n.target;
    var attrs = t.mode === 'node'
      ? ' data-mode="node" data-id="' + esc(t.id) + '"'
      : ' data-mode="chip" data-rail="' + esc(t.rail) + '" data-chip="' + esc(t.chip) + '"';
    return '<button type="button" class="ego-node ' + (n.w === 'p' ? 'p' : 's') + '"' + attrs + '>' +
           (n.tag ? '<span class="tag">' + esc(n.tag) + '</span>' : '') + esc(n.label) + '</button>';
  }

  function buildEgo(hubText, nodes){
    nodes = nodes.slice().sort(function(a,b){ return (a.w === 'p' ? 0 : 1) - (b.w === 'p' ? 0 : 1); });
    if(!nodes.length){ secEgo.style.display = 'none'; egoLinks.innerHTML = ''; return; }
    secEgo.style.display = '';
    egoHub.textContent = hubText;
    var half = Math.ceil(nodes.length / 2);
    egoLeft.innerHTML = nodes.slice(0, half).map(egoHtml).join('');
    egoRight.innerHTML = nodes.slice(half).map(egoHtml).join('');
    drawEgoLinks();
  }

  function drawEgoLinks(){
    egoLinks.innerHTML = '';
    if(secEgo.style.display === 'none') return;
    if(getComputedStyle(egoLinks).display === 'none') return;
    var grid = egoLinks.parentNode, gr = grid.getBoundingClientRect();
    if(!gr.width) return;
    egoLinks.setAttribute('viewBox', '0 0 ' + gr.width + ' ' + gr.height);
    var hub = egoHub.getBoundingClientRect();
    var ns = 'http://www.w3.org/2000/svg', frag = document.createDocumentFragment();
    function connect(box, fromLeft){
      var r = box.getBoundingClientRect();
      var sx = (fromLeft ? hub.left : hub.right) - gr.left;
      var sy = hub.top + hub.height / 2 - gr.top;
      var tx = (fromLeft ? r.right : r.left) - gr.left;
      var ty = r.top + r.height / 2 - gr.top;
      var mid = sx + (tx - sx) * 0.5;
      var p = document.createElementNS(ns, 'path');
      p.setAttribute('class', box.classList.contains('p') ? 'p' : 's');
      p.setAttribute('d', 'M ' + sx + ' ' + sy + ' C ' + mid + ' ' + sy + ', ' + mid + ' ' + ty + ', ' + tx + ' ' + ty);
      frag.appendChild(p);
    }
    Array.prototype.forEach.call(egoLeft.children, function(b){ connect(b, true); });
    Array.prototype.forEach.call(egoRight.children, function(b){ connect(b, false); });
    egoLinks.appendChild(frag);
  }

  secEgo.addEventListener('click', function(ev){
    var b = ev.target.closest ? ev.target.closest('.ego-node') : null;
    if(!b) return;
    if(b.getAttribute('data-mode') === 'node') selectNode(b.getAttribute('data-id'));
    else selectChip(b.getAttribute('data-rail'), b.getAttribute('data-chip'));
  });

  // ---------- филтри ----------
  function applyFilters(){
    var q = filterInput.value.trim().toLowerCase();
    var min = parseInt(wmin.value, 10);
    NODES.forEach(function(n){
      var hay = (n.en + ' ' + n.bg).toLowerCase();
      var ok = (!q || hay.indexOf(q) !== -1) && n.w >= min;
      var p = document.getElementById('p-' + n.id);
      if(p) p.classList.toggle('hidden', !ok);
      var m = document.getElementById('mn-' + n.id);
      if(m) m.classList.toggle('dim', !ok);
    });
    document.querySelectorAll('.grp').forEach(function(g){
      var any = Array.prototype.some.call(g.querySelectorAll('.pill'), function(b){ return !b.classList.contains('hidden'); });
      g.style.display = any ? '' : 'none';
    });
    mapEl.querySelectorAll('.link').forEach(function(l){
      var a = document.getElementById('mn-' + l.getAttribute('data-a'));
      var b = document.getElementById('mn-' + l.getAttribute('data-b'));
      var hide = (a && a.classList.contains('dim')) || (b && b.classList.contains('dim'));
      l.style.display = hide ? 'none' : '';
    });
  }

  filterInput.addEventListener('input', applyFilters);
  wmin.addEventListener('input', function(){ wminOut.textContent = wmin.value; applyFilters(); });
  sortBtn.addEventListener('click', function(){
    sortByWeight = !sortByWeight;
    sortBtn.classList.toggle('on', sortByWeight);
    sortBtn.textContent = sortByWeight ? T().sortT : T().sortW;
    renderPicker();
    applyFilters();
    if(selection) apply();
  });
  clearBtn.addEventListener('click', clearSelection);
  gdClose.addEventListener('click', clearGloss);

  // ---------- локализация ----------
  function setText(id, value){ var el = document.getElementById(id); if(el) el.textContent = value; }
  function setHtml(id, value){ var el = document.getElementById(id); if(el) el.innerHTML = value; }

  function applyLang(){
    var t = T();
    document.documentElement.lang = lang;
    setHtml('tH1', t.h1);
    setHtml('tSub', t.sub.replace('<b>N</b>', '<b>' + NODES.length + '</b>'));
    setHtml('tByline',
      '<span>' + esc(t.byline) + '</span><span class="sep">·</span>' +
      '<span class="who">Stefan Nikolov</span><span class="sep">·</span>' +
      '<a href="https://www.linkedin.com/in/stefan-nikolov-b712a0166/" target="_blank" rel="noopener noreferrer">LinkedIn</a>');
    setText('tMapCap', t.mapCap);
    setText('tMapHint', t.mapHint);
    setHtml('tMapLegend',
      '<span><i class="d1"></i> ' + esc(t.mapLegend[0]) + '</span>' +
      '<span><i class="d2"></i> ' + esc(t.mapLegend[1]) + '</span>' +
      '<span><i class="ln"></i> ' + esc(t.mapLegend[2]) + '</span>' +
      '<span>' + esc(t.mapLegend[3]) + '</span>');
    setText('tPick', t.pick);
    filterInput.setAttribute('placeholder', t.search);
    setText('tWmin', t.wmin);
    sortBtn.textContent = sortByWeight ? t.sortT : t.sortW;
    clearBtn.textContent = t.clear;
    setText('tCapF', t.capF); setText('tCapSym', t.capSym);
    setText('tCapEx', t.capEx); setText('tCapIllus', t.capIllus);
    setText('tThG', t.thG); setText('tThR', t.thR); setText('tThM', t.thM);
    setHtml('tEgoLeg', '<span><i></i> ' + esc(t.egoLeg[0]) + '</span><span><i class="dash"></i> ' + esc(t.egoLeg[1]) + '</span>');
    setHtml('tLegend',
      '<span><i class="sw sw-p"></i> ' + esc(t.legend[0]) + '</span>' +
      '<span><i class="sw"></i> ' + esc(t.legend[1]) + '</span>' +
      '<span><i class="swatch"></i> ' + esc(t.legend[2]) + '</span>' +
      '<span>' + esc(t.legend[3]) + '</span>');
    setText('tGlossCap', t.glossCap);
    setText('tGdEx', t.gdEx); setText('tGdIll', t.gdIll);
    gdClose.textContent = t.gdClose;
    setHtml('tFooter', t.footer);

    renderMap();
    renderPicker();
    renderRails();
    renderGloss();
    applyFilters();
    if(selection) apply(); else clearSelection();
  }

  function setLang(next){
    if(next === lang) return;
    lang = next;
    try { localStorage.setItem('mlmath-lang', next); } catch(e){}
    Array.prototype.forEach.call(document.querySelectorAll('#langsw button'), function(b){
      b.setAttribute('aria-pressed', b.getAttribute('data-lang') === next ? 'true' : 'false');
    });
    applyLang();
  }

  document.getElementById('langsw').addEventListener('click', function(ev){
    var b = ev.target.closest ? ev.target.closest('button[data-lang]') : null;
    if(b) setLang(b.getAttribute('data-lang'));
  });

  // ---------- старт ----------
  var saved = null;
  try { saved = localStorage.getItem('mlmath-lang'); } catch(e){}
  if(saved === 'en' || saved === 'bg') lang = saved;
  Array.prototype.forEach.call(document.querySelectorAll('#langsw button'), function(b){
    b.setAttribute('aria-pressed', b.getAttribute('data-lang') === lang ? 'true' : 'false');
  });
  applyLang();

  var rt;
  window.addEventListener('resize', function(){
    clearTimeout(rt);
    rt = setTimeout(function(){ if(selection) drawEgoLinks(); }, 140);
  });
})();
</script>
