    sym:[['eta — natural parameter','The canonical parameterization. For Bernoulli it is the logit.'],
         ['sufficient statistic','The only thing the data tells you about the parameter. Everything else is redundant.'],
         ['log-normalizer','Ensures the total is 1. Its derivatives give the moments.'],
         ['base measure','A factor independent of the parameters.']],
    ex:'For Bernoulli the sufficient statistic is simply the number of successes — you do not need the whole sequence of 0s and 1s, just the sum. The practical consequence: generalized linear models (GLMs) — logistic regression for Bernoulli, Poisson regression for counts — are not separate models but one model with different link functions.' },

  causal:{ note:'The difference between &bdquo;these two move together&ldquo; and &bdquo;this causes that&ldquo;. Models learn correlations; decisions require causation. A confounder is the third thing that drives both and manufactures a spurious link.',
    sym:[['the do operator — intervention','Forcibly setting a value, rather than merely observing it.'],
         ['average treatment effect','The mean difference between &bdquo;treated&ldquo; and &bdquo;untreated&ldquo;.'],
         ['potential outcomes','What would happen with and without the intervention. You never observe both.'],
         ['confounder','A variable that affects both the cause and the effect.']],
    ex:'The model sees that customers shown an ad buy more, and concludes the ad works. But the ad was shown to people already searching for the product. The confounder is intent. The only clean route is a randomized A/B test; in observational data you need propensity scores, instrumental variables or difference-in-differences.' },

  prior:{ note:'It unifies all regularization under one principle. L2, L1, dropout, early stopping, noise injection — each constrains the effective complexity of the model, and each has a probabilistic interpretation.',
    f:'min <i>L</i>(<i>θ</i>) + <i>λ</i>‖<i>θ</i>‖<sup>2</sup>&nbsp;⇔&nbsp; Gaussian prior&nbsp;&nbsp; <span class="op">·</span>&nbsp;&nbsp; min <i>L</i>(<i>θ</i>) + <i>λ</i>‖<i>θ</i>‖<sub>1</sub>&nbsp;⇔&nbsp; Laplace prior',
    sym:[['regularization strength','Inversely proportional to the variance of the prior.'],
         ['L2 / Ridge','A Gaussian prior. Shrinks all weights smoothly toward zero without zeroing them.'],
         ['L1 / Lasso','A Laplace prior. Sets some weights to exactly zero — it selects features.'],
         ['effective degrees of freedom','How many parameters the model really uses after regularization.']],
    ex:'With 1000 features and 100 examples, plain regression has infinitely many solutions. Ridge picks the one with the smallest norm; Lasso the sparsest (typically 10–20 non-zero coefficients). The practical rule: Lasso when you believe few features matter; Ridge when you believe all of them matter a little.' },

  entropy:{ note:'How much surprise a distribution contains — or how many bits you need on average to encode it. Maximal for a uniform distribution, zero under complete certainty. All of information theory in ML starts here.',
    sym:[['entropy','The average amount of information. In bits with log₂, in nats with ln.'],
         ['information content','How surprising the event is. A rare event carries a lot of information.'],
         ['log base 2','The result is in bits.'],
         ['maximum entropy','Attained by a uniform distribution over K outcomes.']],
    ex:'A fair coin: <span class="m">H = −(0.5·log₂0.5 + 0.5·log₂0.5) = 1</span> bit. Biased with p = 0.9: <span class="m">H = 0.47</span> bits — more predictable. A decision tree picks the split that reduces entropy the most (information gain). The entropy of an LLM output distribution is also a measure of how unsure it is about the next token.' },

  xent:{ note:'The standard loss for every classification task and every language model. It measures how many bits you waste encoding the true distribution with the predicted one. It is identical to the negative log-likelihood — not a coincidence, but the same formula derived along two routes.',
    f:'<i>H</i>(<i>p</i>,<i>q</i>) = −Σ<sub><i>i</i></sub> <i>p</i><sub>i</sub> log <i>q</i><sub>i</sub>&nbsp;&nbsp; <span class="op">·</span>&nbsp;&nbsp; for one-hot: <i>L</i> = −log <i>q</i><sub>true class</sub>',
    sym:[['true distribution','With labels, a one-hot vector with a 1 on the correct class.'],
         ['predicted distribution','The softmax output.'],
         ['cross-entropy','Always ≥ H(p). Equality only when q = p.'],
         ['perplexity','The exponential of the cross-entropy. &bdquo;Effective number of equally likely choices.&ldquo;']],
    ex:'Three classes, the true one is the first, the model predicts <span class="m">(0.7, 0.2, 0.1)</span>: the loss is <span class="m">−log(0.7) = 0.357</span>. At <span class="m">(0.99, …)</span> the loss is 0.01; at <span class="m">(0.01, …)</span> it is 4.6. Note the asymmetry: the penalty for a confident mistake is drastic. A perplexity of 20 for an LLM means the model is as unsure as if choosing between 20 equally likely words.' },

  kl:{ note:'How different two distributions are. It is not a true distance — it is not symmetric, and that asymmetry has real consequences for how models behave. It appears in VAEs, in RLHF, in model distillation and in the definition of mutual information.',
    sym:[['KL from p to q','The double bar stresses that the order matters.'],
         ['non-negativity','Zero only when p and q coincide. It follows from the Jensen inequality.'],
         ['forward KL','Mode-covering — q spreads out to cover everywhere p is non-zero.'],
         ['reverse KL','Mode-seeking — q latches onto one peak and ignores the rest.']],
    ex:'The asymmetry is practical, not a technicality. A VAE uses reverse KL, which is exactly why generated images are often blurry but never impossible. RLHF adds <span class="m">KL(π<sub>new</sub> ‖ π<sub>ref</sub>)</span> as a penalty so the fine-tuned model does not drift too far from the base one — without it the model quickly finds ways to game the reward model.' },

  mi:{ note:'How much you learn about one thing by seeing the other. Unlike correlation, it captures dependence of any kind, not just linear. The basis of contrastive learning (InfoNCE) and of feature selection.',
    sym:[['mutual information','Symmetric: I(X;Y) = I(Y;X). Zero exactly when they are independent.'],
         ['conditional entropy','The uncertainty left about X once you know Y.'],
         ['InfoNCE','A practical contrastive lower bound.'],
         ['information bottleneck','Compress X while keeping the information about Y.']],
    ex:'The correlation between X and <span class="m">Y = X²</span> for symmetrically distributed X is exactly 0 — yet the mutual information is large, because the dependence is total. That is why mutual information catches things a correlation matrix misses during feature selection. SimCLR and CLIP optimize exactly a lower bound on the mutual information between two views of one object.' },

  jensen:{ note:'The inequality that lets you optimize something you cannot compute. Instead of the intractable log-likelihood you optimize a lower bound — and that is exactly the ELBO, the objective of a VAE and of all variational inference.',
    f:'<i>f</i>(𝔼[<i>X</i>]) ≥ 𝔼[<i>f</i>(<i>X</i>)] for concave <i>f</i>&nbsp;&nbsp; <span class="op">·</span>&nbsp;&nbsp; log <i>p</i>(<i>x</i>) ≥ 𝔼<sub><i>q</i></sub>[log <i>p</i>(<i>x</i>|<i>z</i>)] − <i>D</i><sub>KL</sub>(<i>q</i>‖<i>p</i>)',
    sym:[['ELBO — evidence lower bound','A lower bound on log p(x). You maximize it instead of the real target.'],
         ['variational posterior','The approximation the encoder produces.'],
         ['gap','The distance between the ELBO and the truth is exactly the KL between the approximation and the true posterior.'],
         ['concave / convex','Jensen flips direction depending on which kind of function you have.']],
    ex:'The VAE ELBO has two terms with a clear meaning: reconstruction (the decoder must return the input) minus KL (the latent code must look like N(0,I)). β-VAE simply puts a weight in front of the second term. The whole EM algorithm is also a lifting of the same lower bound, alternating an E-step and an M-step.' },

  count:{ note:'The art of counting without enumerating. You need it to size search spaces, to compute probabilities, and to understand why exhaustive hyperparameter search is hopeless.',
    sym:[['n factorial','n·(n−1)·…·1. Grows faster than any exponential.'],
         ['n choose k — binomial coefficient','The number of ways to pick k out of n when order does not matter.'],
         ['permutations','The number of ordered choices — order matters.'],
         ['choice with replacement','All n options are available every time.']],
    ex:'A hyperparameter search over 5 parameters with 4 values each: <span class="m">4<sup>5</sup> = 1024</span> combinations × 2 hours of training = 85 days. That is where random search and Bayesian optimization come from. Another example: 8 cards, choose 3 — <span class="m">C(8,3) = 56</span>. The number of subsets of n elements is <span class="m">2<sup>n</sup></span>, which at n = 30 is already a billion.' },

  binomthm:{ note:'How a power of a sum expands. It links combinatorics to algebra and is directly the basis of the binomial distribution — and from there of everything involving counting successes.',
    sym:[['a binomial raised to a power','It expands into n+1 terms.'],
         ['Pascal triangle','Each coefficient is the sum of the two above it.'],
         ['multinomial','The generalization to more than two terms — related to the categorical distribution.']],
    ex:'A model with accuracy 0.8 over 10 independent tests: the probability of exactly 3 mistakes is <span class="m">C(10,3)·0.2³·0.8⁷ = 0.201</span>. From here you also build the exact binomial confidence interval, which is more reliable than the normal approximation on small samples.' },

  graph:{ note:'Nodes and links. Social networks, molecules, knowledge graphs, the computation graph of the model itself — all of these are graphs. The adjacency matrix and the Laplacian turn a graph into linear algebra, which is where GNNs and spectral clustering start.',
    sym:[['vertices and edges','The nodes and the links between them.'],
         ['adjacency matrix','A_ij = 1 if there is an edge between i and j.'],
         ['diagonal degree matrix','How many neighbours each vertex has.'],
         ['graph Laplacian','Its eigenvalues reveal the cluster structure.'],
         ['neighbours of v','The set of vertices connected to v.']],
    ex:'A GNN layer is &bdquo;every node averages the messages from its neighbours and updates its vector&ldquo;. After k layers each node sees k hops out. The second-smallest eigenvalue of the Laplacian (the algebraic connectivity) says how easily the graph splits in two — the basis of spectral clustering.' },

  setlogic:{ note:'The language the rest of mathematics is written in. You do not compute with it, but you read it in every definition. The quantifiers &bdquo;for all&ldquo; and &bdquo;there exists&ldquo; are the difference between a statement that always holds and one that sometimes does.',
    f:'<i>A</i> ∪ <i>B</i>,&nbsp; <i>A</i> ∩ <i>B</i>,&nbsp; <i>A</i> ∖ <i>B</i>,&nbsp; <i>A</i> ⊆ <i>B</i>&nbsp;&nbsp; <span class="op">·</span>&nbsp;&nbsp; ∀<i>x</i> ∃<i>y</i> : <i>P</i>(<i>x</i>,<i>y</i>)',
    sym:[['is an element of','&bdquo;x ∈ A&ldquo; — x is a member of A.'],
         ['subset','Every element of one is also in the other.'],
         ['for all','The universal quantifier.'],
         ['there exists','The existential quantifier. Swapping quantifier order changes the meaning entirely.'],
         ['set difference','A ∖ B — in A but not in B.'],
         ['cardinality','The number of elements in the set.']],
    ex:'&bdquo;For every ε &gt; 0 there exists N…&ldquo; — the standard opening of a convergence definition. Reversing the quantifiers changes everything: &bdquo;∀x ∃y&ldquo; (for each x there is a suitable y, possibly different) is far weaker than &bdquo;∃y ∀x&ldquo; (there is one y that works for all). That distinction is exactly what separates a weak from a strong guarantee in theory papers.' },

  dp:{ note:'Solve the problem for small cases, keep the results, assemble the big solution. The forward-backward algorithm for HMMs, the CTC loss, beam search and value iteration in RL are all dynamic programming.',
    sym:[['recurrence relation','The cost for a problem of size n, expressed through smaller ones.'],
         ['memoization','Storing already-computed results so they are not recomputed.'],
         ['Bellman equation','The recursion that defines the optimal value of a state.'],
         ['value function','The expected total reward from state s onward.']],
    ex:'Naive Fibonacci makes <span class="m">O(2<sup>n</sup>)</span> calls; with memoization it becomes <span class="m">O(n)</span> — at n = 50 that is the difference between 10<sup>15</sup> and 50 operations. The same principle: the forward algorithm for an HMM computes the probability of an observed sequence in <span class="m">O(T·K²)</span> instead of <span class="m">O(K<sup>T</sup>)</span> by enumerating every path.' },

  bigo:{ note:'How cost grows with input size. The difference between O(n) and O(n²) in attention is the difference between a 4,000-token context and a 1,000,000-token one. Nearly every architectural innovation of recent years is essentially an attack on some complexity.',
    sym:[['big O — upper bound','Order of growth, ignoring constants.'],
         ['omega — lower bound','It cannot be faster than this.'],
         ['theta — tight bound','Both above and below.'],
         ['amortized complexity','The average per operation over a long run of operations.']],
    ex:'Self-attention is <span class="m">O(n²d)</span> in sequence length: 1000 tokens → 10<sup>6</sup> pairs; 100,000 tokens → 10<sup>10</sup> pairs, 10,000× more. Hence FlashAttention (same complexity, better memory behaviour), sparse attention (O(n√n)) and Mamba (O(n)). Matrix multiplication is <span class="m">O(n³)</span> — double the model and the compute goes up 8×.' },

  permsym:{ note:'When order should not matter — and how to build that into the architecture. Sets have no order, graphs have no vertex order, images are translation invariant. Baking in the right symmetry is one of the most powerful ways to reduce how much data you need.',
    f:'<i>f</i>(<i>πx</i>) = <i>f</i>(<i>x</i>) — invariance&nbsp;&nbsp; <span class="op">·</span>&nbsp;&nbsp; <i>f</i>(<i>πx</i>) = <i>πf</i>(<i>x</i>) — equivariance',
    sym:[['pi — permutation','A reshuffling of the order of the elements.'],
         ['invariance','The output does not change at all.'],
         ['equivariance','The output changes in the same way the input did.'],
         ['inductive bias','The assumption about problem structure baked into the architecture.']],
    ex:'Convolution is translation equivariant: move the object and the feature map moves with it — which is why CNNs need far less data than an MLP on images. Attention on its own is permutation invariant, and that is exactly why transformers require positional encoding: without it, &bdquo;dog bites man&ldquo; and &bdquo;man bites dog&ldquo; are the same thing.' },

  metric:{ note:'How you measure &bdquo;how alike are two things&ldquo;. The choice of metric decides the outcome of k-NN, k-means, vector search and contrastive learning. Cosine similarity ignores length, Euclidean does not, and that is a practical difference, not a philosophical one.',
    sym:[['distance','Must be ≥ 0, symmetric, and satisfy the triangle inequality.'],
         ['cosine similarity','The angle only, without the length. Range [−1, 1].'],
         ['Mahalanobis distance','Accounts for the correlations and the scale of each axis.'],
         ['Manhattan distance','Sum of absolute differences. More robust to outliers.']],
    ex:'Two embeddings pointing the same way but of different length: cosine similarity 1.0, Euclidean distance large. For text embeddings you almost always want cosine, because length encodes frequency more than meaning. If you normalize every vector to length 1, the two metrics become equivalent — which is exactly why vector databases normalize.' },

  hyperplane:{ note:'The geometric picture of every linear classifier. One neuron cuts the space in two with a plane. A deep network is many such planes, bent through one another — and that is exactly where the ability to describe complex boundaries comes from.',
    f:'<i>w</i><sup>T</sup><i>x</i> + <i>b</i> = 0&nbsp;&nbsp; <span class="op">·</span>&nbsp;&nbsp; distance = <span class="frac"><span class="n">|<i>w</i><sup>T</sup><i>x</i>+<i>b</i>|</span><span class="d">‖<i>w</i>‖</span></span>&nbsp;&nbsp; <span class="op">·</span>&nbsp;&nbsp; margin = <span class="frac"><span class="n">2</span><span class="d">‖<i>w</i>‖</span></span>',
    sym:[['normal vector','Perpendicular to the plane — the direction in which the output grows.'],
         ['bias / offset','Shifts the plane away from the origin.'],
         ['half-space','One side of the plane — one class.'],
         ['margin','The distance from the plane to the nearest points.']],
    ex:'Logistic regression finds <em>some</em> separating plane; SVM finds the one with the widest margin — more robust on new data. A ReLU network with 100 neurons in the first layer builds 100 hyperplanes and carves the space into polytopes; the output is piecewise linear over them. That is why deep ReLU networks can represent any continuous function.' },

  simplex:{ note:'The space of all probability distributions over K classes is a triangle (at K = 3) or its generalization. Softmax maps arbitrary numbers strictly inside it — never onto the boundary, which is why you can never reach perfect certainty.',
    f:'Δ<sup><i>K</i>−1</sup> = { <i>p</i> ∈ ℝ<sup><i>K</i></sup> : <i>p</i><sub>i</sub> ≥ 0, Σ<i>p</i><sub>i</sub> = 1 }',
    sym:[['delta — simplex','The set of all valid probability vectors.'],
         ['dimension','K probabilities, but only K−1 free — the last follows from the sum.'],
         ['vertices','The points of complete certainty — the one-hot vectors.'],
         ['temperature','softmax(z/T). Large T pushes toward the centre, small T toward the vertices.']],
    ex:'With three classes, every possible model output lies inside an equilateral triangle. The centre (1/3,1/3,1/3) is total uncertainty; the vertices are absolute confidence, which softmax never reaches (it would need infinite logits). At <code>temperature=0.1</code> outputs squeeze toward the vertices (confident and repetitive); at <code>temperature=2</code> toward the centre (varied and chaotic).' },

  manifold:{ note:'Real data lives on a thin curved surface inside an enormous space. A 224×224 image sits in ℝ<sup>150528</sup>, but real images occupy a vanishing fraction of it. That is why learning from a finite number of examples is possible at all.',
    f:'volume of ball / volume of cube → 0 as <i>d</i> → ∞&nbsp;&nbsp; <span class="op">·</span>&nbsp;&nbsp; data ⊂ ℳ<sup><i>k</i></sup> ⊂ ℝ<sup><i>d</i></sup>, <i>k</i> ≪ <i>d</i>',
    sym:[['manifold','A curved surface of low intrinsic dimension, embedded in a large space.'],
         ['intrinsic dimension far smaller','The data has far fewer degrees of freedom than coordinates.'],
         ['curse of dimensionality','In many dimensions everything is far from everything and distances lose meaning.'],
         ['latent space','The learned compact representation of the manifold.']],
    ex:'In 100 dimensions the ratio between the nearest and the farthest neighbour tends to 1 — k-NN stops working because &bdquo;near&ldquo; loses meaning. Hence PCA first, or a learned embedding. The latent space of a VAE (128 dimensions) is an attempt to parameterize the manifold of real images directly.' },

  fp:{ note:'A computer does not compute with real numbers, only with approximations. In large-model training this is not a detail: the choice of fp32 / fp16 / bf16 decides whether training converges at all and how much memory you need.',
    f:'<i>x</i> = (−1)<sup><i>s</i></sup> · <i>m</i> · 2<sup><i>e</i></sup>&nbsp;&nbsp; <span class="op">·</span>&nbsp;&nbsp; fp32: 8 exponent bits, 23 mantissa&nbsp;&nbsp; <span class="op">·</span>&nbsp;&nbsp; bf16: 8 exponent bits, 7 mantissa',
    sym:[['mantissa','The significant digits — it sets the precision.'],
         ['exponent','It sets the range — how large and how small a number is representable.'],
         ['machine epsilon','The smallest number that, added to 1, makes a difference. fp32: 1.2e−7.'],
         ['NaN / Inf','Result of 0/0 or overflow. Once one appears, it propagates everywhere.']],
    ex:'bf16 has the same range as fp32 but less precision — which is why it is preferred for training: fp16 overflows above 65,504, which happens with the loss, and that is exactly why loss scaling exists. In fp16, <span class="m">1 + 0.0001 = 1</span> — the increment simply vanishes. Hence the optimizer keeps an fp32 copy of the weights even when the arithmetic runs in fp16.' },

  lse:{ note:'How not to get NaN. A few tricks every library applies silently and that you need to recognize when writing your own loss. Log-sum-exp is the most important of them and sits right inside softmax.',
    f:'log Σ<i>e</i><sup><i>x</i><sub>i</sub></sup> = <i>c</i> + log Σ<i>e</i><sup><i>x</i><sub>i</sub>−<i>c</i></sup>,&nbsp;&nbsp; <i>c</i> = max<sub><i>i</i></sub> <i>x</i><sub>i</sub>',
    sym:[['LSE — log-sum-exp','Computing the log of a sum of exponentials without overflow.'],
         ['subtracting the maximum','The largest exponential becomes e⁰ = 1 — overflow is impossible.'],
         ['epsilon (1e−8)','Added inside a log or a denominator so there is no log(0) or division by zero.'],
         ['clamp','Forcing a value into a safe range.']],
    ex:'<span class="m">exp(1000)</span> is Inf in every format. But <span class="m">log(e<sup>1000</sup> + e<sup>999</sup>) = 1000 + log(1 + e<sup>−1</sup>) = 1000.31</span> — perfectly computable once you subtract the maximum. That is why you never write <code>log(softmax(x))</code> but <code>log_softmax(x)</code>, and never <code>softmax</code> plus <code>NLLLoss</code> separately but <code>CrossEntropyLoss</code>, which fuses them into one stable expression.' },

  fourier:{ note:'Any signal decomposes into frequencies. Convolution in time is multiplication in the frequency domain — the basis of fast convolutions, of positional encodings, and of analysing which frequencies a network actually learns.',
    sym:[['Fourier transform','Moving from the time domain to the frequency domain.'],
         ['omega — frequency','How fast the component oscillates.'],
         ['convolution','Sliding one function over the other and integrating.'],
         ['FFT — fast Fourier transform','An algorithm giving O(n log n) instead of O(n²).']],
    ex:'The positional encoding in a transformer is literally a set of sines and cosines at different frequencies — which lets the model compare relative positions with linear operations. A long convolution via FFT becomes <span class="m">O(n log n)</span> instead of <span class="m">O(n²)</span> — exactly the trick S4 and related state-space models use.' },

  interp:{ note:'How to build a smooth function through given points. In ML it shows up in image resizing, in positional encodings for new context lengths, and in additive models (GAMs).',
    f:'<i>S</i>(<i>x</i>) = Σ<sub><i>i</i></sub> <i>c</i><sub>i</sub><i>B</i><sub>i</sub>(<i>x</i>)&nbsp;&nbsp; <span class="op">·</span>&nbsp;&nbsp; linear: <i>y</i> = <i>y</i><sub>0</sub> + (<i>y</i><sub>1</sub>−<i>y</i><sub>0</sub>)<span class="frac"><span class="n"><i>x</i>−<i>x</i><sub>0</sub></span><span class="d"><i>x</i><sub>1</sub>−<i>x</i><sub>0</sub></span></span>',

  function polar(r, degrees){
    var a = degrees * Math.PI / 180;
    return { x: CX + r * Math.cos(a), y: CY + r * Math.sin(a) };

  function layout(){
    GROUPS.forEach(function(g, gi){
      var start = A0 + gi * 45, pad = 3.2, usable = 45 - 2 * pad;
      var buckets = {};
      g.nodes.forEach(function(n){ (buckets[n.w] = buckets[n.w] || []).push(n); });
      Object.keys(buckets).forEach(function(wk){
        var list = buckets[wk], m = list.length;
        list.forEach(function(n, i){
          var ang = start + pad + usable * (i + 1) / (m + 1);
          var r = R_IN + (10 - n.w) / 9 * (R_OUT - R_IN);
          var p = polar(r, ang);
          POS[n.id] = { x:p.x, y:p.y, ang:ang, r:r };
        });
      });
    });
  }

  function renderMap(){

      var b = A0 + gi * 45;

      out += '<path class="spoke" d="M' + p1.x.toFixed(1) + ' ' + p1.y.toFixed(1) + ' L' + p2.x.toFixed(1) + ' ' + p2.y.toFixed(1) + '"/>';
      var mid = b + 22.5, lp = polar(R_OUT + 42, mid);
      out += '<text class="grouplab" x="' + lp.x.toFixed(1) + '" y="' + (lp.y + 4).toFixed(1) + '" text-anchor="middle">' + esc(groupShort(g)) + '</text>';
    });
    // ребра-предпоставки
    NODES.forEach(function(n){
      (n.req || []).forEach(function(rid){
        var a = POS[n.id], b = POS[rid];
        if(!a || !b) return;
        var mx = (a.x + b.x) / 2, my = (a.y + b.y) / 2;
        var qx = CX + (mx - CX) * 0.72, qy = CY + (my - CY) * 0.72;
        out += '<path class="link" data-a="' + n.id + '" data-b="' + rid + '" d="M' + a.x.toFixed(1) + ' ' + a.y.toFixed(1) +
               ' Q' + qx.toFixed(1) + ' ' + qy.toFixed(1) + ' ' + b.x.toFixed(1) + ' ' + b.y.toFixed(1) + '"/>';
      });
    });
    // възли
    NODES.forEach(function(n){
      var p = POS[n.id];
      var rr = 3 + n.w * 0.62;
      out += '<g class="nd' + (n.w >= 9 ? ' core' : '') + '" id="mn-' + n.id + '" data-id="' + n.id + '" tabindex="0" role="button">' +
             '<title>' + esc(T().nodeTitle(n)) + '</title>' +
             '<circle cx="' + p.x.toFixed(1) + '" cy="' + p.y.toFixed(1) + '" r="' + rr.toFixed(1) + '"/></g>';
    });
    mapEl.setAttribute('aria-label', T().mapAria);
    mapEl.innerHTML = out;

    mapEl.querySelectorAll('.nd').forEach(function(g){
      g.addEventListener('click', function(){ selectNode(g.getAttribute('data-id'), true); });
      g.addEventListener('keydown', function(ev){
        if(ev.key === 'Enter' || ev.key === ' '){ ev.preventDefault(); selectNode(g.getAttribute('data-id'), true); }
      });
    });
  }

  { ill:'g:sum',
    bg:{ note:'Голямата гръцка сигма значи &bdquo;събери всичко по този индекс&ldquo;. Отдолу пише откъде тръгва броячът, отгоре — докъде стига, а отдясно е изразът, който се събира. Почти всяка загуба в ML е сума по примерите от батча, делена на техния брой. Когато видиш Σ без граници, обикновено се подразбира &bdquo;по всички&ldquo; — по всички примери, по всички класове, по всички измерения. Важното при четене е да разбереш кой индекс се движи и кой стои фиксиран, защото това решава каква е формата на резултата. Ако индексът се движи по клас, резултатът е число за пример; ако се движи по пример, резултатът е число за целия батч.',
         ex:'Кръстосаната ентропия за един пример е <span class="m">−Σ<sub>i</sub> p<sub>i</sub> log q<sub>i</sub></span> — сумата е по класовете, значи резултатът е едно число за този пример. Загубата на батча е <span class="m">(1/N) Σ<sub>n</sub> L<sub>n</sub></span> — тук сумата е по примерите. Двете Σ-та в един и същ ред означават различни неща и объркването им е класическа причина за грешна форма на тензора.' },
    en:{ note:'Capital Greek sigma means &bdquo;add everything up over this index&ldquo;. Below it you write where the counter starts, above it where it stops, and to the right sits the expression being added. Almost every loss in ML is a sum over the examples in a batch, divided by their count. When you see Σ with no limits, &bdquo;over all of them&ldquo; is usually implied — all examples, all classes, all dimensions. The thing to work out when reading is which index moves and which stays fixed, because that decides the shape of the result. If the index runs over classes, the result is one number per example; if it runs over examples, the result is one number for the whole batch.',
         ex:'Cross-entropy for a single example is <span class="m">−Σ<sub>i</sub> p<sub>i</sub> log q<sub>i</sub></span> — the sum is over classes, so the result is one number for that example. The batch loss is <span class="m">(1/N) Σ<sub>n</sub> L<sub>n</sub></span> — here the sum runs over examples. Two sigmas in the same line mean different things, and confusing them is a classic source of wrong tensor shapes.' } },

  { ill:'g:prod',
    bg:{ note:'Голямото пи е умножителният близнак на сигмата: вместо да събираш, умножаваш. В ML почти никога не се смята буквално, защото произведение от много числа под единица бързо пада под представимото за float. Затова навсякъде виждаш логаритъм пред него — логаритъмът превръща произведението в сума и проблемът изчезва. Появява се основно там, където се записва правдоподобие на независими наблюдения или вероятност на цяла последователност. Всеки път, когато срещнеш ∏ в статия, реалният код на негово място има сума от логаритми.',
         ex:'Правдоподобието на 1000 независими примера е <span class="m">∏<sub>i</sub> p(x<sub>i</sub>|θ)</span>. Ако всяко p е около 0.1, произведението е <span class="m">10<sup>−1000</sup></span> — точна нула във float64, чиято долна граница е около <span class="m">10<sup>−308</sup></span>. Логаритмуваш и получаваш <span class="m">Σ<sub>i</sub> log p(x<sub>i</sub>|θ) ≈ −2303</span> — напълно нормално число.' },
    en:{ note:'Capital pi is the multiplicative twin of sigma: instead of adding you multiply. In ML it is almost never computed literally, because a product of many numbers below one quickly falls beneath what a float can represent. That is why you always see a logarithm in front of it — the log turns the product into a sum and the problem disappears. It shows up mainly where you write the likelihood of independent observations, or the probability of a whole sequence. Every time you meet ∏ in a paper, the real code in its place holds a sum of logs.',
         ex:'The likelihood of 1000 independent examples is <span class="m">∏<sub>i</sub> p(x<sub>i</sub>|θ)</span>. If each p is around 0.1, the product is <span class="m">10<sup>−1000</sup></span> — exactly zero in float64, whose floor is about <span class="m">10<sup>−308</sup></span>. Take the log and you get <span class="m">Σ<sub>i</sub> log p(x<sub>i</sub>|θ) ≈ −2303</span> — a perfectly ordinary number.' } },

  { ill:'node:integral',
    bg:{ note:'Издълженото S е непрекъснатият вариант на сумата: там, където Σ събира краен брой членове, ∫ събира по цял континуум. Символът dx накрая не е декорация — той казва по коя променлива интегрираш, което при няколко променливи е единственото, което различава два иначе еднакви израза. В ML интегралът почти винаги значи едно от две: обща вероятност под крива или очаквана стойност. Рядко го смяташ на ръка; или има готова формула, или го приближаваш чрез сампълване. Когато в статия видиш интеграл, който авторите наричат неизчислим, това обикновено значи, че размерността е висока и единственият изход е Монте Карло или вариационна граница.',
         ex:'Площта под ROC кривата е буквално <span class="m">∫₀¹ TPR d(FPR)</span>. Условието едно разпределение да е валидно е <span class="m">∫ p(x) dx = 1</span>. А неизчислимият интеграл, който ражда цялото семейство VAE, е <span class="m">p(x) = ∫ p(x|z)p(z) dz</span> по 128-мерно z.' },
    en:{ note:'The elongated S is the continuous version of a sum: where Σ adds finitely many terms, ∫ adds over a whole continuum. The dx at the end is not decoration — it names the variable you integrate over, which with several variables is the only thing distinguishing two otherwise identical expressions. In ML an integral almost always means one of two things: total probability under a curve, or an expected value. You rarely compute one by hand; either a closed form exists, or you approximate it by sampling. When a paper calls an integral intractable, that usually means the dimension is high and the only way out is Monte Carlo or a variational bound.',
         ex:'The area under the ROC curve is literally <span class="m">∫₀¹ TPR d(FPR)</span>. The condition for a valid distribution is <span class="m">∫ p(x) dx = 1</span>. And the intractable integral that spawns the entire VAE family is <span class="m">p(x) = ∫ p(x|z)p(z) dz</span> over a 128-dimensional z.' } },

  { ill:'node:partial',
    bg:{ note:'Закръгленото &bdquo;де&ldquo; се използва, когато функцията има повече от една променлива, и означава производна само по една от тях, при фиксирани всички останали. Различава се от обикновеното d нарочно: d значи, че променливата е единствената, ∂ значи, че тя е една от много. В обучението на модел това е буквално най-често срещаният знак — за модел със 7 милиарда параметъра на всяка стъпка се смятат 7 милиарда частни производни. Записът ∂L/∂w се чете &bdquo;колко се променя загубата, ако мръдна това тегло съвсем малко&ldquo;. Точно това число оптимизаторът използва, за да реши накъде и колко да мести теглото.',
         ex:'За <span class="m">f(x,y) = x²y + 3y</span>: <span class="m">∂f/∂x = 2xy</span>, защото y се третира като константа; <span class="m">∂f/∂y = x² + 3</span>. В код това е <code>loss.backward()</code>, след което всеки параметър има запълнено поле <code>.grad</code> — по едно число за всеки от милиардите.' },
    en:{ note:'The curly d is used when a function has more than one variable, and it means the derivative with respect to just one of them, holding all the others fixed. It differs from the ordinary d deliberately: d means the variable is the only one, ∂ means it is one of many. In model training this is literally the most frequent sign — for a 7-billion-parameter model, 7 billion partial derivatives are computed at every step. The notation ∂L/∂w reads &bdquo;how much does the loss change if I nudge this weight slightly&ldquo;. That number is exactly what the optimizer uses to decide where and how far to move the weight.',
         ex:'For <span class="m">f(x,y) = x²y + 3y</span>: <span class="m">∂f/∂x = 2xy</span>, because y is treated as a constant; <span class="m">∂f/∂y = x² + 3</span>. In code this is <code>loss.backward()</code>, after which every parameter has a filled <code>.grad</code> field — one number for each of the billions.' } },

  { ill:'node:grad',
    bg:{ note:'Обърнатият триъгълник се чете &bdquo;набла&ldquo; и събира всички частни производни в един вектор със същата форма като входа. Той сочи в посоката, в която функцията расте най-бързо, затова обучението върви точно в обратната — оттам минусът в ∇L. Дължината му казва колко стръмно е в тази точка: близо нула значи плато или дъно. За модел със 7 милиарда параметъра градиентът също има 7 милиарда числа и заема толкова памет, колкото и самият модел. Когато някой каже просто &bdquo;градиентът&ldquo;, без уточнение, почти винаги има предвид градиента на загубата по параметрите.',
         ex:'За <span class="m">f(x,y) = x² + y²</span> в точката (3,4) градиентът е <span class="m">(6,8)</span>, с дължина 10. Стъпка с η = 0.1 те мести на <span class="m">(2.4, 3.2)</span> и загубата пада от 25 на 16. Същият знак се появява и като ∇log p — score-ът в дифузионните модели.' },
    en:{ note:'The inverted triangle reads &bdquo;nabla&ldquo; and gathers every partial derivative into one vector with the same shape as the input. It points in the direction where the function grows fastest, which is why training walks the opposite way — hence the minus in −∇L. Its length says how steep things are at that point: close to zero means a plateau or a bottom. For a 7-billion-parameter model the gradient also has 7 billion numbers and takes as much memory as the model itself. When someone just says &bdquo;the gradient&ldquo; with no qualifier, they almost always mean the gradient of the loss with respect to the parameters.',
         ex:'For <span class="m">f(x,y) = x² + y²</span> at (3,4) the gradient is <span class="m">(6,8)</span>, of length 10. A step with η = 0.1 moves you to <span class="m">(2.4, 3.2)</span> and the loss falls from 25 to 16. The same sign also appears as ∇log p — the score in diffusion models.' } },

  { ill:'node:hess',
    bg:{ note:'Наблата на квадрат означава втори производни — как се мени самият наклон. В едно измерение това е обикновената втора производна и казва дали кривата е извита нагоре или надолу. В много измерения се превръща в матрица, наречена хесиан, по едно число за всяка двойка параметри. Знаците на нейните собствени стойности решават дали точка с нулев градиент е минимум, максимум или седло. За големи модели пълният хесиан е физически неизчислим, затова всички практични методи работят с приближения: Adam пази само диагонала, K-FAC приближава чрез Кронекерово произведение.',
         ex:'За модел със 7 милиарда параметъра хесианът има около <span class="m">5·10<sup>19</sup></span> елемента — повече от всички байтове по всички твърди дискове на света. Затова Adam пази по две числа на параметър вместо матрица, а L-BFGS помни последните десет градиента.' },
    en:{ note:'Nabla squared denotes second derivatives — how the slope itself changes. In one dimension this is the ordinary second derivative and tells you whether the curve bends up or down. In many dimensions it becomes a matrix called the Hessian, one number for every pair of parameters. The signs of its eigenvalues decide whether a zero-gradient point is a minimum, a maximum or a saddle. For large models the full Hessian is physically uncomputable, so every practical method works with approximations: Adam keeps only the diagonal, K-FAC approximates it as a Kronecker product.',
         ex:'For a 7-billion-parameter model the Hessian has roughly <span class="m">5·10<sup>19</sup></span> entries — more than all the bytes on all the hard drives in the world. Hence Adam keeps two numbers per parameter instead of a matrix, and L-BFGS remembers the last ten gradients.' } },

  { ill:'node:expect',
    bg:{ note:'Двойното E в скоби значи &bdquo;средното, ако повториш експеримента безброй пъти&ldquo;. При дискретни величини е сума от стойност по вероятност, при непрекъснати — интеграл от същото. Индексът отдолу казва по кое разпределение осредняваш, а това е важно: 𝔼<sub>p</sub> и 𝔼<sub>q</sub> на един и същ израз са различни числа. Всяка функция на загуба в ML е очаквана стойност, която на практика се приближава със средното по батча. Ключовото свойство е линейността: 𝔼[aX + bY] = a𝔼[X] + b𝔼[Y] важи винаги, дори когато X и Y са зависими.',
         ex:'Зар: <span class="m">𝔼[X] = 3.5</span> — стойност, която самият зар никога не показва. При policy gradient целта е <span class="m">𝔼<sub>τ~π</sub>[R(τ)]</span> и цялата трудност е, че разпределението, по което осредняваш, зависи от параметрите, които оптимизираш.' },
    en:{ note:'The double-struck E in brackets means &bdquo;the average if you repeated the experiment endlessly&ldquo;. For discrete variables it is a sum of value times probability, for continuous ones an integral of the same. The subscript names the distribution you average over, and that matters: 𝔼<sub>p</sub> and 𝔼<sub>q</sub> of the same expression are different numbers. Every loss function in ML is an expectation, approximated in practice by the batch mean. The key property is linearity: 𝔼[aX + bY] = a𝔼[X] + b𝔼[Y] always holds, even when X and Y are dependent.',
         ex:'A die: <span class="m">𝔼[X] = 3.5</span> — a value the die itself never shows. In policy gradient the objective is <span class="m">𝔼<sub>τ~π</sub>[R(τ)]</span>, and the whole difficulty is that the distribution you average over depends on the very parameters you are optimizing.' } },

  { ill:'node:probax',
    bg:{ note:'Голямото P означава вероятност за събитие и винаги е число между 0 и 1. Пише се с главна буква, за да се различава от p, което обозначава плътност и може да е над единица. P се използва за дискретни събития — &bdquo;класът е котка&ldquo;, &bdquo;монетата падна ези&ldquo;, &bdquo;моделът сгреши&ldquo;. Аргументът в скобите е събитие, тоест множество от изходи, а не число. Правилото, което най-често се нарушава при бърз прочит, е че вероятностите на взаимно изключващи се събития се събират, но само ако наистина не могат да се случат заедно.',
         ex:'Ако softmax изходите ти не сумират до 1, някъде има бъг. Ако модел твърди <span class="m">P(котка) = 0.7</span> и <span class="m">P(куче) = 0.6</span> при взаимно изключващи се класове, това е невъзможно — значи си ползвал сигмоида там, където ти трябва softmax.' },
    en:{ note:'Capital P denotes the probability of an event and is always a number between 0 and 1. It is capitalised to distinguish it from p, which denotes a density and may exceed one. P is used for discrete events — &bdquo;the class is cat&ldquo;, &bdquo;the coin came up heads&ldquo;, &bdquo;the model was wrong&ldquo;. The argument in brackets is an event, that is, a set of outcomes, not a number. The rule most often violated on a quick read is that probabilities of mutually exclusive events add, but only if they genuinely cannot happen together.',
         ex:'If your softmax outputs do not sum to 1, there is a bug somewhere. If a model claims <span class="m">P(cat) = 0.7</span> and <span class="m">P(dog) = 0.6</span> for mutually exclusive classes, that is impossible — it means you used a sigmoid where a softmax was needed.' } },

  { ill:'node:pdf',
    bg:{ note:'Малкото p означава плътност, а не вероятност — и това е разликата, която се пропуска най-често. Плътността може спокойно да е над единица; вероятност се получава едва като я умножиш по ширина на интервал или я интегрираш. За непрекъсната величина вероятността да получиш точно определена стойност е нула, значи има смисъл само да питаш за интервал. Когато в статия видиш log p(x), почти винаги става дума за плътност, не за вероятност. При дискретни величини същата буква се използва за PMF, където стойностите наистина са вероятности и сумата им е 1.',
         ex:'Нормално разпределение със <span class="m">σ = 0.1</span> има пикова плътност около <span class="m">3.99</span> — стойност над 1, което е напълно нормално. Но <span class="m">P(X = 0) = 0</span>; смисъл има само <span class="m">P(−0.05 &lt; X &lt; 0.05) ≈ 0.38</span>.' },
    en:{ note:'Lower-case p denotes a density, not a probability — and that is the distinction most often missed. A density can comfortably exceed one; you only get a probability once you multiply it by an interval width or integrate it. For a continuous variable the probability of any exact value is zero, so only questions about intervals are meaningful. When a paper writes log p(x), it almost always means a density, not a probability. For discrete variables the same letter is used for a PMF, where the values really are probabilities and sum to 1.',
         ex:'A normal distribution with <span class="m">σ = 0.1</span> has a peak density of about <span class="m">3.99</span> — a value above 1, which is perfectly fine. But <span class="m">P(X = 0) = 0</span>; only <span class="m">P(−0.05 &lt; X &lt; 0.05) ≈ 0.38</span> is meaningful.' } },

  { ill:'node:condprob',
    bg:{ note:'Отвесната черта се чете &bdquo;при условие че&ldquo; и е може би най-натовареният знак в статистиката. P(A|B) значи: свий целия свят до случаите, в които B се е случило, и питай каква част от тях са A. Редът има значение — P(A|B) и P(B|A) са различни числа и бъркането им е класическа грешка при четене на диагностични резултати. Теоремата на Бейс е точно правилото за обръщане на реда и затова е толкова важна. В ML тази черта се среща навсякъде: p(y|x) е това, което класификаторът моделира, p(θ|D) е постериорът, p(x<sub>t</sub>|x<sub>&lt;t</sub>) е езиковият модел.',
         ex:'Тест с 99% точност за болест, засягаща 1 на 10 000: <span class="m">P(болен | положителен) = 0.0098</span>, тоест под 1%. Междувременно <span class="m">P(положителен | болен) = 0.99</span>. Двете числа се различават стотократно и разликата е само в реда на аргументите.' },
    en:{ note:'The vertical bar reads &bdquo;given that&ldquo; and is possibly the most overloaded sign in statistics. P(A|B) means: shrink the whole world down to the cases where B happened, and ask what fraction of those are A. Order matters — P(A|B) and P(B|A) are different numbers, and confusing them is the classic error when reading diagnostic results. Bayes theorem is precisely the rule for reversing the order, which is why it matters so much. In ML this bar is everywhere: p(y|x) is what a classifier models, p(θ|D) is the posterior, p(x<sub>t</sub>|x<sub>&lt;t</sub>) is a language model.',
         ex:'A 99%-accurate test for a disease affecting 1 in 10,000: <span class="m">P(sick | positive) = 0.0098</span>, under 1%. Meanwhile <span class="m">P(positive | sick) = 0.99</span>. The two numbers differ a hundredfold, and the only difference is the order of the arguments.' } },

  { ill:'node:rv',
    bg:{ note:'Вълничката се чете &bdquo;разпределено е като&ldquo; и свързва случайна величина с разпределението, от което идва. Отляво стои величината, отдясно — семейството и параметрите му. Знакът не значи равенство, а описание: X ~ N(0,1) не казва каква е стойността на X, а по какъв закон се тегли. В код това съответства на извикване на сампълър, а в статия — на предположение за модела. Същият знак се използва и за описване на батч: x<sub>i</sub> ~ p<sub>данни</sub> означава, че примерите са независими тегления от разпределението на данните.',
         ex:'В трика с репараметризацията <span class="m">z ~ N(μ, σ²)</span> се пренаписва като <span class="m">z = μ + σ·ε</span> с <span class="m">ε ~ N(0,1)</span>. Двете са едно и също разпределение, но само второто пропуска градиент към μ и σ — и точно затова VAE изобщо се обучава.' },
    en:{ note:'The tilde reads &bdquo;is distributed as&ldquo; and connects a random variable with the distribution it comes from. On the left sits the variable, on the right the family and its parameters. The sign is not equality but description: X ~ N(0,1) does not say what the value of X is, only by what law it is drawn. In code this corresponds to calling a sampler; in a paper, to a modelling assumption. The same sign describes a batch: x<sub>i</sub> ~ p<sub>data</sub> means the examples are independent draws from the data distribution.',
         ex:'In the reparameterization trick <span class="m">z ~ N(μ, σ²)</span> is rewritten as <span class="m">z = μ + σ·ε</span> with <span class="m">ε ~ N(0,1)</span>. The two are the same distribution, but only the second passes a gradient to μ and σ — which is exactly why a VAE trains at all.' } },

  { ill:'node:indep',
    bg:{ note:'Двойната отвесна черта означава независимост: знанието за едното не казва абсолютно нищо за другото. Формално това значи, че съвместната вероятност се разлага на произведение от маргиналите. По-полезната версия е условната независимост, писана A ⫫ B | C — двете може да са свързани, но щом знаеш C, връзката изчезва. Точно това допускане прави големите вероятностни модели изобщо изчислими: без него съвместното разпределение на 1000 двоични променливи има 2¹⁰⁰⁰ стойности. Всеки път, когато модел приема, че примерите в батча са независими, той използва този знак мълчаливо.',
         ex:'Наивният Бейс приема, че думите са независими при дадена класа — очевидно невярно, защото &bdquo;машинно&ldquo; и &bdquo;обучение&ldquo; вървят заедно, но моделът работи въпреки това. Марковското допускане в HMM е от същия вид: бъдещето ⫫ миналото | настоящето.' },
    en:{ note:'The double vertical bar denotes independence: knowing one thing tells you absolutely nothing about the other. Formally it means the joint probability factorizes into a product of the marginals. The more useful version is conditional independence, written A ⫫ B | C — the two may be related, but once you know C the relation disappears. That assumption is what makes large probabilistic models computable at all: without it the joint distribution of 1000 binary variables has 2¹⁰⁰⁰ values. Every time a model assumes the examples in a batch are independent, it is using this sign silently.',
         ex:'Naive Bayes assumes words are independent given the class — plainly false, since &bdquo;machine&ldquo; and &bdquo;learning&ldquo; travel together, yet the model works anyway. The Markov assumption in an HMM is the same species: future ⫫ past | present.' } },

  { ill:'node:norms',
    bg:{ note:'Двойните отвесни черти означават норма, тоест дължина или размер на вектор. Индексът долу казва коя норма: 2 е обичайната евклидова, 1 е сумата от абсолютните стойности, ∞ е най-голямата компонента. Без индекс почти винаги се разбира евклидовата. Нормата се появява на три различни места в ML и е полезно да ги различаваш: като разстояние между точки, като размер на градиента при отрязване, и като наказание за големи тегла при регуляризация. Различните норми дават качествено различни модели — L1 занулява координати точно, L2 само ги свива.',
         ex:'За <span class="m">x = (3, −4)</span>: L2 = 5, L1 = 7, L∞ = 4. При gradient clipping, ако <span class="m">‖g‖₂ = 12</span> а прагът е 1.0, целият вектор се умножава по 1/12 — посоката се запазва, дължината не.' },
    en:{ note:'The double vertical bars denote a norm, that is, the length or size of a vector. The subscript says which norm: 2 is the ordinary Euclidean one, 1 is the sum of absolute values, ∞ is the largest component. With no subscript, the Euclidean one is almost always meant. The norm appears in three distinct places in ML and it helps to keep them apart: as a distance between points, as the size of a gradient during clipping, and as a penalty on large weights in regularization. Different norms give qualitatively different models — L1 zeroes coordinates exactly, L2 merely shrinks them.',
         ex:'For <span class="m">x = (3, −4)</span>: L2 = 5, L1 = 7, L∞ = 4. In gradient clipping, if <span class="m">‖g‖₂ = 12</span> and the threshold is 1.0, the whole vector is multiplied by 1/12 — the direction is kept, the length is not.' } },

  { ill:'g:abs',
    bg:{ note:'Единичните отвесни черти около число означават абсолютна стойност — стойността без знака. Около вектор същият запис обикновено значи норма, а около матрица — детерминанта, така че контекстът решава. Абсолютната стойност е непрекъсната, но не е диференцируема в нулата, и точно това я прави интересна: върхът в нулата е причината L1 регуляризацията да произвежда точни нули. Обикновеното градиентно спускане не може да се справи с този връх, затова се използва проксимален оператор — меко отрязване. Когато в статия видиш |·| около нещо, първо се питай какъв е обектът вътре.',
         ex:'<span class="m">|−3| = 3</span>. При Lasso наказанието е <span class="m">λΣ|w<sub>i</sub>|</span> и точно върхът в нулата кара част от теглата да станат точно нула, а не просто малки. Същият знак около матрица значи друго: <span class="m">|A| = det(A)</span>, което при 2×2 е <span class="m">ad − bc</span>.' },
    en:{ note:'Single vertical bars around a number denote absolute value — the value with the sign stripped. Around a vector the same notation usually means a norm, and around a matrix a determinant, so context decides. Absolute value is continuous but not differentiable at zero, and that is exactly what makes it interesting: the corner at zero is why L1 regularization produces exact zeros. Plain gradient descent cannot handle that corner, so a proximal operator — soft thresholding — is used instead. When you see |·| around something in a paper, first ask what kind of object is inside.',
         ex:'<span class="m">|−3| = 3</span>. In Lasso the penalty is <span class="m">λΣ|w<sub>i</sub>|</span>, and it is precisely the corner at zero that drives some weights to exactly zero rather than merely small. The same sign around a matrix means something else: <span class="m">|A| = det(A)</span>, which for 2×2 is <span class="m">ad − bc</span>.' } },

  { ill:'node:dot',
    bg:{ note:'Точката между два вектора означава скаларно произведение: умножаваш съответните компоненти и събираш. Резултатът е едно число, не вектор, и точно това е смисълът на думата &bdquo;скаларно&ldquo;. Геометрично то е ‖a‖‖b‖cos θ, значи мери едновременно дължините и доколко двата вектора сочат в една посока. Нула означава перпендикулярност, тоест пълна несвързаност по тази мярка. Това е операцията, която един неврон изпълнява, която attention изпълнява между заявка и ключ, и която векторната база изпълнява при търсене — ако разбереш само една операция от линейната алгебра, нека е тази.',
         ex:'<span class="m">(1,2,3) · (4,5,6) = 4 + 10 + 18 = 32</span>. В attention резултатът се дели на <span class="m">√d</span>, преди да мине през softmax — без това деление при голямо d произведенията стават огромни и softmax се насища до one-hot.' },
    en:{ note:'The dot between two vectors denotes the dot product: multiply corresponding components and add. The result is a single number, not a vector, and that is exactly what &bdquo;scalar&ldquo; product means. Geometrically it equals ‖a‖‖b‖cos θ, so it measures the lengths and how far the two vectors point the same way, at once. Zero means perpendicular, that is, complete unrelatedness under this measure. This is the operation a neuron performs, that attention performs between a query and a key, and that a vector database performs when searching — if you understand only one operation from linear algebra, make it this one.',
         ex:'<span class="m">(1,2,3) · (4,5,6) = 4 + 10 + 18 = 32</span>. In attention the result is divided by <span class="m">√d</span> before the softmax — without that division, large d makes the products enormous and the softmax saturates into a one-hot.' } },

  { ill:'node:funcspace',
    bg:{ note:'Ъгловите скоби означават вътрешно произведение — по-абстрактният брат на точката. За обикновени вектори двете са едно и също, но записът със скоби продължава да работи и когато обектите не са вектори, а функции, матрици или елементи на безкрайномерно пространство. Точно затова кернел методите и Гаусовите процеси се пишат със скоби: там &bdquo;векторите&ldquo; са функции. Условията, които трябва да изпълнява, са три: симетричност, линейност по първия аргумент и положителност на ⟨x,x⟩. Всяко вътрешно произведение автоматично поражда норма чрез ‖x‖ = √⟨x,x⟩ и оттам понятие за ъгъл.',
         ex:'За функции в <span class="m">L²</span> вътрешното произведение е <span class="m">⟨f,g⟩ = ∫ f(x)g(x) dx</span>. Кернел трикът е точно това: <span class="m">K(x,x′) = ⟨φ(x), φ(x′)⟩</span>, където φ никога не се пресмята явно, а понякога дори е безкрайномерно.' },
    en:{ note:'Angle brackets denote an inner product — the more abstract sibling of the dot. For ordinary vectors the two are identical, but the bracket notation keeps working when the objects are not vectors but functions, matrices, or elements of an infinite-dimensional space. That is exactly why kernel methods and Gaussian processes are written with brackets: there the &bdquo;vectors&ldquo; are functions. Three conditions must hold: symmetry, linearity in the first argument, and positivity of ⟨x,x⟩. Every inner product automatically generates a norm through ‖x‖ = √⟨x,x⟩, and from there a notion of angle.',
         ex:'For functions in <span class="m">L²</span> the inner product is <span class="m">⟨f,g⟩ = ∫ f(x)g(x) dx</span>. The kernel trick is precisely this: <span class="m">K(x,x′) = ⟨φ(x), φ(x′)⟩</span>, where φ is never computed explicitly and is sometimes even infinite-dimensional.' } },

  { ill:'node:hadamard',
    bg:{ note:'Кръгчето с точка означава умножение елемент по елемент — това, което <code>*</code> прави в numpy и PyTorch. Формите на двата операнда трябва да съвпадат или да се излъчват едно към друго; резултатът е със същата форма. Различава се фундаментално от матричното умножение, при което една клетка на резултата изяжда цял ред и цяла колона. Появява се навсякъде, където има гейт или маска: LSTM гейтовете, dropout маските, маските за внимание. Когато четеш формула и видиш ⊙, това почти винаги значи &bdquo;пропусни толкова от този сигнал&ldquo;, а не &bdquo;смесù тези неща&ldquo;.',
         ex:'LSTM клетъчното състояние: <span class="m">c<sub>t</sub> = f<sub>t</sub> ⊙ c<sub>t−1</sub> + i<sub>t</sub> ⊙ ĉ<sub>t</sub></span>. Гейтът f е вектор от числа между 0 и 1 и решава за всяко измерение поотделно колко от старата памет да остане. Dropout е същото с маска от нули и единици.' },
    en:{ note:'The circled dot denotes element-wise multiplication — what <code>*</code> does in numpy and PyTorch. The shapes of the two operands must match or broadcast to each other; the result has the same shape. It differs fundamentally from matrix multiplication, where one output cell consumes a whole row and a whole column. It shows up wherever there is a gate or a mask: LSTM gates, dropout masks, attention masks. When you read a formula and see ⊙, it almost always means &bdquo;let this much of the signal through&ldquo;, not &bdquo;mix these things together&ldquo;.',
         ex:'The LSTM cell state: <span class="m">c<sub>t</sub> = f<sub>t</sub> ⊙ c<sub>t−1</sub> + i<sub>t</sub> ⊙ ĉ<sub>t</sub></span>. The gate f is a vector of numbers between 0 and 1 and decides, per dimension, how much of the old memory survives. Dropout is the same thing with a mask of zeros and ones.' } },

  { ill:'node:tensor',
    bg:{ note:'Кръстчето в кръгче означава тензорно или Кронекерово произведение — начин да комбинираш две пространства в едно по-голямо. При вектори резултатът е матрица от всички двойки произведения, при матрици — блокова матрица. В ML се среща на две много различни места: като начин да опишеш формата на многомерни данни, и като структурно приближение при оптимизация. Не се бъркай с ⊙, което е елемент по елемент и запазва формата — тензорното произведение размерността расте. При четене на статии за еквивариантни мрежи този знак се появява постоянно, защото там слоевете са тензорни произведения на представяния.',
         ex:'K-FAC приближава хесиан с милиарди елементи като <span class="m">A ⊗ B</span> на две малки матрици — вместо да пази n² числа, пази два блока с по n числа. Разликата е между невъзможно и изпълнимо.' },
    en:{ note:'The circled cross denotes a tensor or Kronecker product — a way of combining two spaces into a larger one. For vectors the result is a matrix of all pairwise products, for matrices a block matrix. In ML it turns up in two very different places: as a way of describing the shape of multidimensional data, and as a structural approximation in optimization. Do not confuse it with ⊙, which is element-wise and preserves shape — a tensor product grows the dimension. When reading papers on equivariant networks this sign appears constantly, because there the layers are tensor products of representations.',
         ex:'K-FAC approximates a Hessian with billions of entries as <span class="m">A ⊗ B</span> of two small matrices — instead of storing n² numbers it stores two blocks of n numbers each. The difference is between impossible and feasible.' } },

  { ill:'node:transpose',
    bg:{ note:'Горният индекс T означава транспониране: редовете стават колони, огледално спрямо главния диагонал. Елементът на позиция (i,j) отива на позиция (j,i), а формата m×n става n×m. Появява се навсякъде в backprop, защото ако прякото минаване е y = Wx, то градиентът към входа е Wᵀ пъти градиентът от изхода — същата матрица, но обърната. Полезно правило, което се забравя: транспонирането на произведение обръща реда, (AB)ᵀ = BᵀAᵀ. За симетрична матрица транспонирането не променя нищо, което е причината ковариационните матрици да са толкова удобни за работа.',
         ex:'<span class="m">A = [[1,2],[3,4]]</span> → <span class="m">Aᵀ = [[1,3],[2,4]]</span>. В код <code>A.T</code> обикновено не копира данни, а само сменя как се обхожда паметта — затова е евтино, но може да направи следващата операция по-бавна заради разпръснат достъп.' },
    en:{ note:'The superscript T denotes transposition: rows become columns, mirrored across the main diagonal. The entry at position (i,j) moves to (j,i), and a shape of m×n becomes n×m. It appears everywhere in backprop, because if the forward pass is y = Wx then the gradient to the input is Wᵀ times the gradient from the output — the same matrix, flipped. A useful rule that gets forgotten: transposing a product reverses the order, (AB)ᵀ = BᵀAᵀ. For a symmetric matrix transposition changes nothing, which is why covariance matrices are so convenient to work with.',
         ex:'<span class="m">A = [[1,2],[3,4]]</span> → <span class="m">Aᵀ = [[1,3],[2,4]]</span>. In code <code>A.T</code> usually copies no data and merely changes how memory is traversed — cheap, but it can make the next operation slower through scattered access.' } },

  { ill:'g:inv',
    bg:{ note:'Индексът минус едно означава обратна матрица — тази, която връща действието на изходната обратно. Съществува само за квадратни матрици с ненулева детерминанта; ако детерминантата е нула, матрицата смачква пространството и информацията е безвъзвратно изгубена. В теорията се пише навсякъде, но в реалния код почти никога не се пресмята явно, защото е бавно и числено нестабилно. Вместо това се решава линейна система чрез разлагане — LU, QR или Холецки — което е и по-бързо, и по-точно. Когато видиш A⁻¹b във формула, помни, че кодът отдолу почти сигурно вика <code>solve</code>, а не <code>inv</code>.',
         ex:'<span class="m">A = [[1,2],[3,4]]</span> има <span class="m">A⁻¹ = [[−2,1],[1.5,−0.5]]</span>. Но при Ridge регресия никой не смята <span class="m">(XᵀX + λI)⁻¹</span> — решава се системата <span class="m">(XᵀX + λI)β = Xᵀy</span>, което е кубично по-евтино и по-стабилно.' },
    en:{ note:'The superscript minus one denotes the matrix inverse — the matrix that undoes what the original does. It exists only for square matrices with a non-zero determinant; if the determinant is zero the matrix collapses space and the information is irretrievably lost. In theory it is written everywhere, but in real code it is almost never computed explicitly, because it is slow and numerically unstable. Instead a linear system is solved through a decomposition — LU, QR or Cholesky — which is both faster and more accurate. When you see A⁻¹b in a formula, remember that the code underneath almost certainly calls <code>solve</code>, not <code>inv</code>.',
         ex:'<span class="m">A = [[1,2],[3,4]]</span> has <span class="m">A⁻¹ = [[−2,1],[1.5,−0.5]]</span>. But in Ridge regression nobody computes <span class="m">(XᵀX + λI)⁻¹</span> — you solve the system <span class="m">(XᵀX + λI)β = Xᵀy</span>, which is cheaper and more stable.' } },

  { ill:'node:lstsq',
    bg:{ note:'Кинжалът означава псевдообратна матрица на Мур-Пенроуз — обобщение на обратната за случаите, когато обикновена обратна не съществува. Използва се, когато системата е предефинирана и няма точно решение, или недефинирана и има безброй решения. В първия случай псевдообратната дава решението с най-малка грешка, във втория — решението с най-малка норма. Точно това второ свойство е ключово за разбирането на съвременното дълбоко обучение: при препараметризирани модели има много точни напасвания и градиентното спускане намира именно това с минимална норма. Оттам идва и обяснението защо преобучението често е безобидно.',
         ex:'Най-малките квадрати се пишат компактно като <span class="m">β = X<sup>†</sup>y</span>. При 1000 признака и 100 примера има безброй решения; псевдообратната избира най-гладкото от тях, което е и причината то да обобщава добре.' },
    en:{ note:'The dagger denotes the Moore-Penrose pseudoinverse — a generalization of the inverse for cases where an ordinary inverse does not exist. It is used when a system is overdetermined and has no exact solution, or underdetermined and has infinitely many. In the first case the pseudoinverse gives the least-error solution, in the second the minimum-norm one. That second property is central to understanding modern deep learning: in overparameterized models there are many exact fits, and gradient descent lands on the minimum-norm one. From there comes the explanation of why overfitting is often benign.',
         ex:'Least squares is written compactly as <span class="m">β = X<sup>†</sup>y</span>. With 1000 features and 100 examples there are infinitely many solutions; the pseudoinverse picks the smoothest, which is also why it generalizes well.' } },

  { ill:'g:eye',
    bg:{ note:'Главното I означава единична матрица — единици по главния диагонал и нули навсякъде другаде. Тя е неутралният елемент за матричното умножение: AI = IA = A, точно както 1 е за числата. Размерът ѝ почти никога не се пише явно, а се подразбира от контекста, което понякога прави формулите двусмислени при бърз прочит. Появява се на три типични места: в дефиницията на обратна матрица, като добавка при регуляризация, и като ковариация на стандартен нормален шум. Добавянето на λI към почти сингулярна матрица е най-евтиният начин да я направиш обратима — това е цялата идея на Ridge регресията.',
         ex:'<span class="m">ε ~ N(0, I)</span> значи независим стандартен шум по всяка компонента — точно това се тегли в трика с репараметризацията. А <span class="m">(XᵀX + λI)</span> е обратима дори когато <span class="m">XᵀX</span> не е, защото λ вдига всички собствени стойности с λ.' },
    en:{ note:'Capital I denotes the identity matrix — ones along the main diagonal, zeros everywhere else. It is the neutral element of matrix multiplication: AI = IA = A, exactly as 1 is for numbers. Its size is almost never written explicitly and is inferred from context, which occasionally makes formulas ambiguous on a quick read. It appears in three typical places: in the definition of the inverse, as an additive term in regularization, and as the covariance of standard normal noise. Adding λI to a near-singular matrix is the cheapest way to make it invertible — that is the whole idea of Ridge regression.',
         ex:'<span class="m">ε ~ N(0, I)</span> means independent standard noise in each component — exactly what is drawn in the reparameterization trick. And <span class="m">(XᵀX + λI)</span> is invertible even when <span class="m">XᵀX</span> is not, because λ raises every eigenvalue by λ.' } },

  { ill:'node:rank',
    bg:{ note:'Означава следа: сумата на елементите по главния диагонал на квадратна матрица. Едно число, което обобщава цялата матрица и има изненадващо приятни свойства. Най-полезното е, че следата е равна на сумата на собствените стойности, което позволява да я смяташ, без изобщо да ги намираш. Второто полезно свойство е цикличността: tr(ABC) = tr(BCA), което често позволява да пренаредиш израз така, че да стане изчислим. В ML се среща в изрази с ковариации, в дефиницията на ефективни степени на свобода, и във формули за очаквани стойности на квадратични форми.',
         ex:'<span class="m">tr([[1,2],[3,4]]) = 1 + 4 = 5</span>. При Ridge регресия ефективният брой параметри е <span class="m">tr(H)</span>, където H е матрицата на изглаждането — число между 0 и броя признаци, което казва колко параметъра моделът реално използва.' },
    en:{ note:'Denotes the trace: the sum of the entries along the main diagonal of a square matrix. A single number summarizing the whole matrix, with surprisingly pleasant properties. The most useful is that the trace equals the sum of the eigenvalues, letting you compute it without ever finding them. The second is cyclicity: tr(ABC) = tr(BCA), which often lets you rearrange an expression until it becomes computable. In ML it appears in covariance expressions, in the definition of effective degrees of freedom, and in formulas for expectations of quadratic forms.',
         ex:'<span class="m">tr([[1,2],[3,4]]) = 1 + 4 = 5</span>. In Ridge regression the effective number of parameters is <span class="m">tr(H)</span>, where H is the smoother matrix — a number between 0 and the feature count, telling you how many parameters the model really uses.' } },

  { ill:'node:rank',
    bg:{ note:'Детерминантата е едно число, което казва колко пъти преобразуванието свива или раздува обема. Положителна значи, че ориентацията се запазва, отрицателна — че пространството е обърнато като огледало. Нула означава, че матрицата смачква пространството в по-ниска размерност и обратна матрица не съществува. В ML се появява основно в две места: в нормировката на многомерното нормално разпределение и в normalizing flows, където log|det J| е точно цената на промяната на плътността. Изчисляването ѝ е скъпо в общия случай, затова flows се строят със специална структура, при която якобианът е триъгълен и детерминантата е просто произведение на диагонала.',
         ex:'<span class="m">det([[1,2],[3,4]]) = 1·4 − 2·3 = −2</span> — обемът се удвоява и ориентацията се обръща. При normalizing flow с 128 измерения обща детерминанта би струвала <span class="m">O(128³)</span> на слой; с триъгълна структура пада до <span class="m">O(128)</span>.' },
    en:{ note:'The determinant is a single number saying how many times a transformation shrinks or expands volume. Positive means orientation is preserved, negative means space has been mirrored. Zero means the matrix collapses space into a lower dimension and no inverse exists. In ML it appears mainly in two places: in the normalizer of the multivariate normal, and in normalizing flows, where log|det J| is exactly the price of changing the density. Computing it is expensive in general, which is why flows are built with a special structure where the Jacobian is triangular and the determinant is simply the product of the diagonal.',
         ex:'<span class="m">det([[1,2],[3,4]]) = 1·4 − 2·3 = −2</span> — volume doubles and orientation flips. In a 128-dimensional normalizing flow a general determinant would cost <span class="m">O(128³)</span> per layer; with a triangular structure it drops to <span class="m">O(128)</span>.' } },

  { ill:'node:psd',
    bg:{ note:'Знакът ≻ 0 значи положително определена матрица: за всеки ненулев вектор x изразът xᵀAx е строго положителен. Еквивалентно, всичките ѝ собствени стойности са положителни. Геометрично това означава, че квадратичната форма е купа с едно дъно, отворена нагоре — точно случаят, в който оптимизацията е лесна. Вариантът ⪰ 0 допуска и нулеви собствени стойности, тоест плоски посоки; всяка ковариационна матрица е такава по конструкция. Когато хесианът е положително определен в точка с нулев градиент, точката е локален минимум — това е многомерният аналог на теста с втората производна.',
         ex:'<span class="m">A = [[2,0],[0,2]]</span> е кръгла купа и SGD стига до дъното за няколко стъпки. <span class="m">A = [[100,0],[0,1]]</span> също е положително определена, но е тесен каньон с число на обусловеност 100 — оттам идват Adam и нормализацията.' },
    en:{ note:'The sign ≻ 0 means a positive definite matrix: for every non-zero vector x the expression xᵀAx is strictly positive. Equivalently, all its eigenvalues are positive. Geometrically this means the quadratic form is a bowl with a single bottom opening upward — exactly the case where optimization is easy. The variant ⪰ 0 also allows zero eigenvalues, that is, flat directions; every covariance matrix is one by construction. When the Hessian is positive definite at a zero-gradient point, that point is a local minimum — the multidimensional analogue of the second-derivative test.',
         ex:'<span class="m">A = [[2,0],[0,2]]</span> is a round bowl and SGD reaches the bottom in a few steps. <span class="m">A = [[100,0],[0,1]]</span> is also positive definite but a narrow canyon with condition number 100 — hence Adam and normalization.' } },

  { ill:'node:eig',
    bg:{ note:'Малката ламбда има две основни значения в ML и контекстът ги различава лесно. В линейната алгебра това е собствена стойност: колко се разтяга пространството по дадена специална посока. В оптимизацията и регуляризацията е сила на наказанието — колкото по-голяма λ, толкова по-прост модел искаш. Като собствена стойност знакът и големината ѝ решават всичко: |λ| над 1 при повтарящо се умножение води до експлозия, под 1 — до изчезване. Точно това обяснява защо RNN се чупят при дълги последователности и защо спектралната нормализация помага.',
         ex:'В RNN една и съща матрица се прилага 100 пъти: при <span class="m">λ = 1.1</span> сигналът се умножава по <span class="m">13780</span>, при <span class="m">λ = 0.9</span> — по <span class="m">0.000027</span>. В Ridge регресията същата буква значи друго: <span class="m">λ = 0</span> е обикновена регресия, голямо λ свива всички коефициенти към нула.' },
    en:{ note:'Lower-case lambda has two main meanings in ML, easily told apart by context. In linear algebra it is an eigenvalue: how much space is stretched along a particular special direction. In optimization and regularization it is the strength of a penalty — the larger λ, the simpler the model you are asking for. As an eigenvalue its sign and magnitude decide everything: |λ| above 1 under repeated multiplication leads to explosion, below 1 to vanishing. That explains precisely why RNNs break on long sequences and why spectral normalization helps.',
         ex:'In an RNN the same matrix is applied 100 times: at <span class="m">λ = 1.1</span> the signal is multiplied by <span class="m">13,780</span>, at <span class="m">λ = 0.9</span> by <span class="m">0.000027</span>. In Ridge regression the same letter means something else: <span class="m">λ = 0</span> is plain regression, large λ shrinks every coefficient toward zero.' } },

  { ill:'node:gauss',
    bg:{ note:'Малката сигма най-често означава стандартно отклонение — типичното разстояние на една стойност от средното, в същите единици като данните. Квадратът ѝ е дисперсията, която се събира по-удобно, но е в квадратни единици. Същата буква обозначава и сингулярни стойности при SVD, и сигмоидната функция, така че контекстът е задължителен. При нормално разпределение сигмата дава директно интуиция: около 68% от масата е в ±1σ, около 95% в ±2σ. В ML се среща постоянно при инициализация на теглата, при описване на шум и при задаване на несигурност.',
         ex:'Инициализацията по He задава <span class="m">σ = √(2/n<sub>in</sub></span>) — при слой с 512 входа това е около 0.0625. Прекалено голяма сигма и активациите експлодират след няколко слоя; прекалено малка и изчезват, преди обучението изобщо да е започнало.' },
    en:{ note:'Lower-case sigma most often denotes the standard deviation — the typical distance of a value from the mean, in the same units as the data. Its square is the variance, which adds more conveniently but lives in squared units. The same letter also denotes singular values in SVD and the sigmoid function, so context is mandatory. Under a normal distribution sigma gives direct intuition: about 68% of the mass lies within ±1σ, about 95% within ±2σ. In ML it appears constantly in weight initialization, in describing noise, and in expressing uncertainty.',
         ex:'He initialization sets <span class="m">σ = √(2/n<sub>in</sub></span>) — for a layer with 512 inputs that is about 0.0625. Too large a sigma and activations explode after a few layers; too small and they vanish before training even begins.' } },

  { ill:'node:gauss',
    bg:{ note:'Главната сигма в контекст на разпределения означава ковариационна матрица — обобщението на дисперсията за много измерения. По диагонала стоят дисперсиите на отделните компоненти, извън диагонала — ковариациите между двойки. Тя винаги е симетрична и положително полуопределена, защото описва реален облак от точки. Геометрично задава формата и наклона на елипсоида: диагонална Σ значи ос-подравнен елипсоид, пълна Σ — наклонен. Внимавай да не я объркаш със същия знак за сумиране — различава се по това, че няма индекси отдолу и отгоре и стои като обект, а не като оператор.',
         ex:'VAE използва диагонална Σ, значи енкодерът връща само μ и log σ² — по едно число на измерение вместо цяла матрица. Пълна ковариация за 128-мерно латентно би искала 8256 числа на пример вместо 128.' },
    en:{ note:'Capital sigma in a distribution context denotes the covariance matrix — the multidimensional generalization of variance. Along the diagonal sit the variances of the individual components, off the diagonal the covariances between pairs. It is always symmetric and positive semi-definite, because it describes a real cloud of points. Geometrically it sets the shape and tilt of an ellipsoid: a diagonal Σ means an axis-aligned ellipsoid, a full Σ a tilted one. Be careful not to confuse it with the same sign for summation — it is distinguished by having no limits above and below, and by standing as an object rather than an operator.',
         ex:'A VAE uses a diagonal Σ, so the encoder returns only μ and log σ² — one number per dimension instead of a whole matrix. A full covariance for a 128-dimensional latent would need 8256 numbers per example instead of 128.' } },

  { ill:'node:gauss',
    bg:{ note:'Малкото мю обозначава средна стойност — центъра на разпределението. При многомерен случай е вектор с по едно число за всяко измерение и посочва къде е центърът на облака от точки. Различава се от x с черта, което е извадковото средно, сметнато от конкретни данни; мю е истинската стойност на популацията, която обикновено не знаеш. Тази разлика има значение: извадковото средно е случайна величина със собствена дисперсия, истинското мю е фиксирано число. При нормализация на слоеве мю се пресмята наново за всеки батч, което е и причината BatchNorm да се държи различно при обучение и при инференс.',
         ex:'BatchNorm при обучение използва μ на текущия батч; при инференс използва пълзящо средно, натрупано по време на обучението. Ако забравиш <code>model.eval()</code>, моделът продължава да нормализира по батча и предсказанията зависят от това с какво друго е дошъл примерът.' },
    en:{ note:'Lower-case mu denotes the mean — the centre of a distribution. In the multivariate case it is a vector with one number per dimension, pointing at the centre of the cloud of points. It differs from x-bar, which is the sample mean computed from concrete data; mu is the true population value you usually do not know. That distinction matters: the sample mean is a random variable with its own variance, the true mu is a fixed number. In layer normalization mu is recomputed for every batch, which is exactly why BatchNorm behaves differently in training and at inference.',
         ex:'BatchNorm in training uses the μ of the current batch; at inference it uses a running average accumulated during training. Forget <code>model.eval()</code> and the model keeps normalizing over the batch, so predictions depend on what else arrived alongside the example.' } },

  { ill:'node:objective',
    bg:{ note:'Тета е стандартното име за &bdquo;всички параметри на модела, събрани в един вектор&ldquo;. Използва се, когато не искаш да изброяваш поотделно теглата, отместванията и всичко останало, а да говориш за тях като за една точка в пространство. Затова изрази като θ ∈ ℝᴰ значат просто &bdquo;модел с D параметъра&ldquo;. Обучението се записва като движение на тази точка: θ ← θ − η∇L. При модел със 7 милиарда параметъра θ е вектор със 7 милиарда компоненти и цялата картина с релефа на загубата е за пространство с толкова измерения.',
         ex:'Записът <span class="m">θ* = arg min<sub>θ</sub> L(θ)</span> обобщава почти цялото обучение в един ред. Когато в статия видиш θ<sub>t</sub>, това е състоянието на модела след t стъпки — цял модел, не едно число.' },
