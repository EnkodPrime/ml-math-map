</head>
<body>
<style>
  :root{
    --bg:#eef1f5; --bg-panel:#ffffff; --bg-panel-2:#e6ebf0;
    --line:#c3ced9; --ink:#16324f; --ink-dim:#5b7188;
    --cyan:#1f7f93; --amber:#c97a1a; --amber-glow:rgba(201,122,26,0.16);
    --amber-strong:#a8600e;
    --track:#d5dde6;
    --font-display:'Bahnschrift','Segoe UI Semibold','Helvetica Neue',Arial,sans-serif;
    --font-body:'Segoe UI','Helvetica Neue',Arial,sans-serif;
    --font-mono:'Cascadia Mono','SF Mono',Consolas,'Roboto Mono',monospace;
    --font-math:'Cambria Math','STIX Two Math','Latin Modern Math','Times New Roman',serif;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#0a1930; --bg-panel:#0f2444; --bg-panel-2:#0c1d3a;
      --line:#1c3a63; --ink:#dce8f7; --ink-dim:#7f9cbf;
      --cyan:#5ad1e6; --amber:#f2a53c; --amber-glow:rgba(242,165,60,0.30);
      --amber-strong:#ffc067; --track:#16305a;
    }
  }
  :root[data-theme="dark"]{
    --bg:#0a1930; --bg-panel:#0f2444; --bg-panel-2:#0c1d3a;
    --line:#1c3a63; --ink:#dce8f7; --ink-dim:#7f9cbf;
    --cyan:#5ad1e6; --amber:#f2a53c; --amber-glow:rgba(242,165,60,0.30);
    --amber-strong:#ffc067; --track:#16305a;
  }
  :root[data-theme="light"]{
    --bg:#eef1f5; --bg-panel:#ffffff; --bg-panel-2:#e6ebf0;
    --line:#c3ced9; --ink:#16324f; --ink-dim:#5b7188;
    --cyan:#1f7f93; --amber:#c97a1a; --amber-glow:rgba(201,122,26,0.16);
    --amber-strong:#a8600e; --track:#d5dde6;
  }
  *{ box-sizing:border-box; }
  body{ margin:0; }

  .sheet{
    background:
      linear-gradient(var(--line) 1px, transparent 1px) 0 0/38px 38px,
      linear-gradient(90deg, var(--line) 1px, transparent 1px) 0 0/38px 38px,
      var(--bg);
    color:var(--ink);
    font-family:var(--font-body);
    min-height:100%;
    padding:28px 20px 64px;
  }
  .wrap{ position:relative; max-width:1180px; margin:0 auto; }

  header.top{ display:flex; flex-direction:column; gap:6px; margin-bottom:20px; }
  .topbar{ display:flex; align-items:center; justify-content:space-between; gap:14px; }
  .eyebrow{
    font-family:var(--font-mono); font-size:11px; letter-spacing:.14em;
    text-transform:uppercase; color:var(--cyan);
  }
  .langsw{
    display:inline-flex; border:1px solid var(--line); border-radius:6px;
    overflow:hidden; background:var(--bg-panel); flex:none;
  }
  .langsw button{
    appearance:none; -webkit-appearance:none; margin:0; cursor:pointer;
    font-family:var(--font-mono); font-size:11px; letter-spacing:.1em;
    background:transparent; color:var(--ink-dim); border:0;
    padding:6px 13px; line-height:1.2;
    transition:background .15s ease, color .15s ease;
  }
  .langsw button + button{ border-left:1px solid var(--line); }
  .langsw button:hover{ color:var(--ink); }
  .langsw button:focus-visible{ outline:2px solid var(--amber); outline-offset:-2px; }
  .langsw button[aria-pressed="true"]{ background:var(--amber); color:var(--bg-panel); font-weight:600; }
  h1{
    font-family:var(--font-display); font-weight:700;
    font-size:clamp(22px,3.4vw,32px); margin:0; letter-spacing:.01em;
    text-wrap:balance; color:var(--ink);
  }
  .sub{ color:var(--ink-dim); font-size:14.5px; max-width:70ch; line-height:1.55; margin:2px 0 0; }
  .byline{
    display:flex; align-items:center; gap:8px; flex-wrap:wrap;
    font-family:var(--font-mono); font-size:11.5px; color:var(--ink-dim);
    margin:10px 0 0; padding-top:9px; border-top:1px solid var(--line);
    max-width:70ch;
  }
  .byline .who{ color:var(--ink); }
  .byline .sep{ color:var(--line); }
  .byline a{
    color:var(--cyan); text-decoration:none;
    border-bottom:1px solid transparent; padding-bottom:1px;
    transition:border-color .15s ease;
  }
  .byline a:hover{ border-bottom-color:var(--cyan); }
  .byline a:focus-visible{ outline:2px solid var(--amber); outline-offset:2px; border-radius:2px; }

  .card{
    background:var(--bg-panel); border:1px solid var(--line); border-radius:10px;
    padding:16px 18px; margin-bottom:16px;
  }
  .card-cap{
    font-family:var(--font-mono); font-size:10.5px; letter-spacing:.1em;
    text-transform:uppercase; color:var(--ink-dim); margin:0 0 10px;
  }

  /* ---------- radial map ---------- */
  .map-head{ display:flex; align-items:baseline; justify-content:space-between; gap:14px; flex-wrap:wrap; margin-bottom:4px; }
  .map-hint{ font-size:12.5px; color:var(--ink-dim); max-width:60ch; line-height:1.5; margin:0 0 10px; }
  .map-box{ width:100%; overflow-x:auto; }
  #map{ display:block; width:100%; min-width:560px; height:auto; }
  #map .ring{ fill:none; stroke:var(--line); stroke-width:1; }
  #map .ring.major{ stroke-dasharray:3 4; }
  #map .spoke{ stroke:var(--line); stroke-width:1; }
  #map .ringlab{ font-family:var(--font-mono); font-size:11px; fill:var(--ink-dim); }
  #map .grouplab{ font-family:var(--font-mono); font-size:12px; fill:var(--cyan); letter-spacing:.06em; }
  #map .link{ stroke:var(--line); stroke-width:1; fill:none; opacity:.75; }
  #map .nd{ cursor:pointer; }
  #map .nd circle{ fill:var(--bg-panel-2); stroke:var(--cyan); stroke-width:1.4; transition:fill .15s ease, stroke .15s ease; }
  #map .nd text{ font-family:var(--font-body); font-size:11px; fill:var(--ink); pointer-events:none; }
  #map .nd:hover circle{ fill:var(--cyan); }
  #map .nd:focus-visible circle{ stroke:var(--amber); stroke-width:2.6; }
  #map .nd.core circle{ stroke:var(--amber); }
  #map.sel-on .nd{ opacity:.28; }
  #map.sel-on .nd.on{ opacity:1; }
  #map.sel-on .nd.on circle{ fill:var(--amber); stroke:var(--amber); }
  #map.sel-on .nd.near{ opacity:1; }
  #map.sel-on .nd.near circle{ stroke:var(--amber); }
  #map.sel-on .link{ opacity:.2; }
  #map.sel-on .link.on{ opacity:1; stroke:var(--amber); stroke-width:1.5; }
  #map .nd.dim{ display:none; }
  .map-legend{
    display:flex; gap:18px; flex-wrap:wrap; margin-top:10px;
    font-family:var(--font-mono); font-size:10.5px; color:var(--ink-dim); align-items:center;
  }
  .map-legend span{ display:inline-flex; align-items:center; gap:6px; }
  .map-legend i.d1{ width:14px; height:14px; border-radius:50%; border:1.6px solid var(--amber); display:inline-block; }
  .map-legend i.d2{ width:7px; height:7px; border-radius:50%; border:1.4px solid var(--cyan); display:inline-block; }
  .map-legend i.ln{ width:16px; height:0; border-top:1px solid var(--line); display:inline-block; }

  /* ---------- controls ---------- */
  .ctrl-row{ display:flex; align-items:center; gap:12px; flex-wrap:wrap; margin-bottom:12px; }
  .ctrl-label{
    font-family:var(--font-mono); font-size:11px; letter-spacing:.1em;
    text-transform:uppercase; color:var(--ink-dim); white-space:nowrap;
  }
  #filter{
    flex:1 1 200px; min-width:170px;
    background:var(--bg-panel-2); border:1px solid var(--line); border-radius:6px;
    color:var(--ink); font-family:var(--font-body); font-size:14px;
    padding:8px 12px; outline:none;
  }
  #filter:focus-visible{ outline:2px solid var(--amber); outline-offset:1px; }
  #filter::placeholder{ color:var(--ink-dim); }
  .btn{
    font-family:var(--font-mono); font-size:12px; letter-spacing:.04em;
    background:transparent; color:var(--ink-dim); border:1px solid var(--line);
    border-radius:6px; padding:7px 12px; cursor:pointer;
  }
  .btn:hover{ color:var(--ink); border-color:var(--ink-dim); }
  .btn:focus-visible{ outline:2px solid var(--amber); outline-offset:1px; }
  .btn:disabled{ opacity:.4; cursor:default; }
  .btn.on{ color:var(--amber-strong); border-color:var(--amber); background:var(--amber-glow); }
  .slide-wrap{ display:inline-flex; align-items:center; gap:8px; }
  #wmin{ width:130px; accent-color:var(--amber); }
  #wminOut{ font-family:var(--font-mono); font-size:12px; color:var(--ink); min-width:2.4em; font-variant-numeric:tabular-nums; }

  /* ---------- picker ---------- */
  .grp{ margin-bottom:12px; }
  .grp:last-child{ margin-bottom:0; }
  .grp-title{
    font-family:var(--font-mono); font-size:10.5px; letter-spacing:.08em;
    text-transform:uppercase; color:var(--ink-dim); margin:0 0 7px;
    display:flex; align-items:center; gap:8px;
  }
  .grp-title em{ font-style:normal; color:var(--cyan); text-transform:none; letter-spacing:0; font-size:11px; }
  .grp-row{ display:flex; flex-wrap:wrap; gap:7px; }

  .pill{
    appearance:none; -webkit-appearance:none; margin:0; text-align:left; cursor:pointer;
    display:inline-flex; align-items:center; gap:8px;
    font-size:12.5px; font-family:var(--font-body); line-height:1.25;
    background:var(--bg-panel-2); color:var(--ink);
    border:1px solid var(--line); border-radius:6px; padding:5px 9px 5px 6px;
    transition:background .15s ease, border-color .15s ease, opacity .15s ease, color .15s ease;
  }
  .pill:hover{ border-color:var(--cyan); }
  .pill:focus-visible{ outline:2px solid var(--amber); outline-offset:2px; }
  .pill .w{
    font-family:var(--font-mono); font-size:10.5px; font-variant-numeric:tabular-nums;
    color:var(--ink-dim); background:var(--bg-panel); border:1px solid var(--line);
    border-radius:4px; padding:1px 4px; min-width:22px; text-align:center;
  }
  .pill.t4 .w{ color:var(--amber-strong); border-color:var(--amber); }
  .pill.t3 .w{ color:var(--cyan); border-color:var(--cyan); }
  .pill.hidden{ display:none; }
  .wrap.sel-active .pill{ opacity:.32; }
  .wrap.sel-active .pill.selected{
    opacity:1; background:var(--amber); border-color:var(--amber); color:var(--bg-panel); font-weight:600;
  }
  .wrap.sel-active .pill.selected .w{ background:transparent; color:var(--bg-panel); border-color:var(--bg-panel); }
  .wrap.sel-active .pill.lit-p{ opacity:1; background:var(--amber-glow); border-color:var(--amber); color:var(--amber-strong); }
  .wrap.sel-active .pill.lit-s{ opacity:1; border-color:var(--amber); color:var(--ink); }
  .wrap.sel-active .pill.kin{ opacity:1; border-color:var(--cyan); color:var(--ink); box-shadow:0 0 0 1px var(--cyan) inset; }

  /* ---------- detail ---------- */
  .detail{ display:none; margin-top:14px; padding-top:14px; border-top:1px dashed var(--line); }
  .detail.show{ display:block; }
  .d-head{ display:flex; align-items:flex-start; gap:10px; flex-wrap:wrap; }
  .d-dot{ width:9px; height:9px; border-radius:50%; background:var(--amber); margin-top:7px; flex:none; box-shadow:0 0 0 4px var(--amber-glow); }
  .d-titles{ flex:1 1 260px; min-width:0; }
  .d-en{ font-family:var(--font-display); font-weight:700; font-size:17px; color:var(--ink); letter-spacing:.01em; }
  .d-bg{ font-size:13.5px; color:var(--cyan); margin-top:1px; }
  .d-weight{ display:flex; flex-direction:column; gap:4px; align-items:flex-end; }
  .d-wnum{ font-family:var(--font-mono); font-size:12px; color:var(--ink-dim); font-variant-numeric:tabular-nums; }
  .d-wnum b{ color:var(--amber-strong); font-size:15px; }
  .wbar{ display:flex; gap:2px; }
  .wbar i{ width:9px; height:8px; background:var(--track); border-radius:1px; display:block; }
  .wbar i.f{ background:var(--amber); }
  .d-tier{ font-family:var(--font-mono); font-size:10px; letter-spacing:.07em; text-transform:uppercase; color:var(--ink-dim); }

  .d-note{ font-size:13.5px; line-height:1.6; color:var(--ink); margin:10px 0 0; max-width:78ch; }

  .sec{ margin-top:16px; }
  .sec-cap{
    font-family:var(--font-mono); font-size:10px; letter-spacing:.08em;
    text-transform:uppercase; color:var(--ink-dim); margin:0 0 8px;
  }
  .fcard{
    background:var(--bg-panel-2); border:1px solid var(--line); border-radius:10px;
    padding:14px 16px; overflow-x:auto;
  }
  .mf{ font-family:var(--font-math); font-size:17px; line-height:2; color:var(--ink); white-space:nowrap; }
  .mf .v{ font-style:italic; }
  .mf .op{ color:var(--ink-dim); font-style:normal; }
  .mf .hl{ color:var(--amber-strong); }
  .frac{ display:inline-flex; flex-direction:column; vertical-align:middle; text-align:center; margin:0 .22em; line-height:1.15; }
  .frac .n{ border-bottom:1px solid currentColor; padding:0 .3em 1px; }
  .frac .d{ padding:1px .3em 0; }

  table.sym{ border-collapse:collapse; width:100%; font-size:13px; }
  table.sym th{
    text-align:left; font-family:var(--font-mono); font-size:10px; letter-spacing:.07em;
    text-transform:uppercase; color:var(--ink-dim); font-weight:400;
    padding:0 10px 6px 0; border-bottom:1px solid var(--line); white-space:nowrap;
  }
  table.sym td{ padding:7px 10px 7px 0; border-bottom:1px solid var(--line); vertical-align:top; line-height:1.45; }
  table.sym tr:last-child td{ border-bottom:none; }
  table.sym td.g{ font-family:var(--font-math); font-size:17px; white-space:nowrap; color:var(--amber-strong); width:1%; padding-right:16px; }
  table.sym td.n{ color:var(--ink); white-space:nowrap; width:1%; padding-right:16px; }
  table.sym td.m{ color:var(--ink-dim); }
  .symwrap{ overflow-x:auto; }

  .exbox{
    background:var(--bg-panel-2); border:1px solid var(--line); border-left:3px solid var(--cyan);
    border-radius:0 8px 8px 0; padding:12px 14px; font-size:13px; line-height:1.65; color:var(--ink);
  }
  .exbox code{ font-family:var(--font-mono); font-size:12px; color:var(--amber-strong); }
  .exbox .m{ font-family:var(--font-math); font-size:15px; }

  .illus-body{
    display:flex; justify-content:center; padding:12px 8px;
    background:var(--bg-panel-2); border:1px solid var(--line); border-radius:10px;
  }
  .illus-body svg{ width:100%; max-width:360px; height:auto; }
  .illus-body svg .ax{ stroke:var(--ink-dim); stroke-width:1.3; fill:none; }
  .illus-body svg .grid{ stroke:var(--line); stroke-width:1; fill:none; }
  .illus-body svg .ln{ stroke:var(--ink); stroke-width:2.2; fill:none; stroke-linecap:round; stroke-linejoin:round; }
  .illus-body svg .ac{ stroke:var(--amber); stroke-width:2.4; fill:none; stroke-linecap:round; stroke-linejoin:round; }
  .illus-body svg .ac2{ stroke:var(--cyan); stroke-width:1.9; fill:none; stroke-linecap:round; stroke-linejoin:round; }
  .illus-body svg .fac{ fill:var(--amber); }
  .illus-body svg .fc2{ fill:var(--cyan); }
  .illus-body svg .fdim{ fill:var(--ink-dim); }
  .illus-body svg .fink{ fill:var(--ink); }
  .illus-body svg .fnone{ fill:none; }
  .illus-body svg .box{ fill:var(--bg-panel); stroke:var(--line); stroke-width:1.4; }
  .illus-body svg .boxac{ fill:var(--bg-panel); stroke:var(--amber); stroke-width:1.6; }
  .illus-body svg .dash{ stroke-dasharray:4 3; }
  .illus-body svg .soft{ fill:var(--amber); opacity:.16; }
  .illus-body svg .soft2{ fill:var(--cyan); opacity:.14; }
  .illus-body svg text{ font-family:var(--font-mono); fill:var(--ink); }
  .illus-body svg .t{ font-size:11px; }
  .illus-body svg .ts{ font-size:9px; fill:var(--ink-dim); }
  .illus-body svg .tm{ font-family:var(--font-math); font-size:13px; font-style:italic; }

  /* ---------- ego graph ---------- */
  .ego-grid{
    display:grid; grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);
    gap:9px 26px; align-items:center; position:relative; z-index:1;
  }
  .ego-col{ display:flex; flex-direction:column; gap:7px; min-width:0; }
  .ego-col.left{ align-items:flex-end; }
  .ego-col.right{ align-items:flex-start; }
  .ego-node{
    appearance:none; -webkit-appearance:none; cursor:pointer; text-align:left;
    font-size:11.5px; line-height:1.28; font-family:var(--font-body);
    background:var(--bg-panel-2); border:1px solid var(--line); border-radius:6px;
    padding:5px 9px; max-width:236px; color:var(--ink);
    transition:border-color .15s ease, background .15s ease;
  }
  .ego-col.left .ego-node{ text-align:right; }
  .ego-node.p{ border-color:var(--amber); box-shadow:0 0 0 1px var(--amber) inset; }
  .ego-node:hover{ border-color:var(--cyan); background:var(--bg-panel); }
  .ego-node:focus-visible{ outline:2px solid var(--amber); outline-offset:2px; }
  .ego-node .tag{
    display:block; font-family:var(--font-mono); font-size:9px; letter-spacing:.04em;
    color:var(--cyan); margin-bottom:2px;
  }
  .ego-hub{
    justify-self:center; text-align:center; max-width:210px;
    font-family:var(--font-display); font-weight:700; font-size:13px; line-height:1.25;
    background:var(--amber); color:var(--bg-panel);
    border:1px solid var(--amber); border-radius:8px; padding:9px 13px;
  }
  .ego-links{ position:absolute; inset:0; width:100%; height:100%; pointer-events:none; overflow:visible; z-index:0; }
  .ego-links path{ fill:none; }
  .ego-links path.p{ stroke:var(--amber); stroke-width:1.6; opacity:.8; }
  .ego-links path.s{ stroke:var(--amber); stroke-width:1.1; opacity:.42; stroke-dasharray:3 4; }
  .ego-legend{
    display:flex; gap:16px; flex-wrap:wrap; margin-top:11px;
    font-family:var(--font-mono); font-size:10px; color:var(--ink-dim);
  }
  .ego-legend span{ display:inline-flex; align-items:center; gap:6px; }
  .ego-legend i{ width:15px; height:0; border-top:2px solid var(--amber); display:inline-block; }
  .ego-legend i.dash{ border-top:2px dashed var(--amber); opacity:.6; }

  /* ---------- rails (ML/AI side) ---------- */
  .rail{
    background:var(--bg-panel); border:1px solid var(--line); border-radius:10px;
    padding:15px 18px 16px; margin-bottom:12px;
  }
  .rail-head{ display:flex; align-items:baseline; gap:10px; margin-bottom:3px; flex-wrap:wrap; }
  .rail-idx{ font-family:var(--font-mono); font-size:11px; color:var(--cyan); border:1px solid var(--line); border-radius:4px; padding:1px 6px; }
  .rail-title{ font-family:var(--font-display); font-weight:700; font-size:15px; color:var(--ink); letter-spacing:.01em; }
  .rail-blurb{ font-size:12.5px; color:var(--ink-dim); margin:2px 0 11px; max-width:74ch; }
  .items{ display:flex; flex-wrap:wrap; gap:7px; }
  .chip{
    appearance:none; -webkit-appearance:none; margin:0; text-align:left; cursor:pointer;
    font-size:12.5px; font-family:var(--font-body);
    background:var(--bg-panel-2); color:var(--ink);
    border:1px solid var(--line); border-radius:6px;
    padding:6px 10px; line-height:1.3;
    transition:opacity .18s ease, border-color .18s ease, background .18s ease, color .18s ease;
  }
  .chip:hover{ border-color:var(--cyan); }
  .chip:focus-visible{ outline:2px solid var(--amber); outline-offset:2px; }
  .wrap.sel-active .chip{ opacity:.32; }
  .wrap.sel-active .chip.lit-p{ opacity:1; background:var(--amber-glow); border-color:var(--amber); color:var(--amber-strong); }
  .wrap.sel-active .chip.lit-s{ opacity:1; border-color:var(--amber); color:var(--ink); }

  { id:'orth', g:'la', w:7, en:'Orthogonality & projections', bg:'Ортогоналност и проекции',
    note:'Перпендикулярност, обобщена за много измерения. Ортогоналните посоки не си пречат — това е причината PCA да дава независими компоненти, а ортогоналната инициализация да пази сигнала жив през дълбоки мрежи. Проекцията е &bdquo;най-добрата сянка&ldquo; на вектор върху подпространство и е сърцето на метода на най-малките квадрати.',

  { id:'psd', g:'la', w:6, en:'Positive definite matrices & quadratic forms', bg:'Положително определени матрици и квадратични форми',
    note:'Квадратичната форма е матричният начин да напишеш &bdquo;купа&ldquo;. Ако матрицата е положително определена, повърхността е купа с едно дъно — точно случаят, в който оптимизацията е лесна. Ковариационните матрици и матриците на Хесе се разглеждат винаги през тази призма.',

  { id:'tensor', g:'la', w:9, en:'Tensors, shapes, broadcasting', bg:'Тензори, форми, broadcasting',

  { id:'cond', g:'la', w:5, en:'Condition number & numerical conditioning', bg:'Число на обусловеност',
    note:'Мярка колко силно малка грешка на входа се раздува на изхода. Лошо обусловена задача значи, че оптимизацията ще криволичи и че fp16 ще счупи резултата. Обяснява защо нормализацията на признаци не е козметика, а необходимост.',

  { id:'lstsq', g:'la', w:7, en:'Linear systems & least squares', bg:'Линейни системи и най-малки квадрати',

  { id:'deriv', g:'an', w:9, en:'Derivative (single variable)', bg:'Производна на функция на една променлива',

  { id:'grad', g:'an', w:10, en:'Gradient ∇', bg:'Градиент ∇',
    note:'Всички частни производни, събрани в един вектор. Той сочи в посоката на най-бързо нарастване, затова обучението върви точно в обратната посока. Когато някой каже &bdquo;градиентът&ldquo;, има предвид този вектор — по един за всеки параметър на модела.',
    f:'∇<i>f</i>(<i>x</i>) = ( ' + fr('∂<i>f</i>','∂<i>x</i><sub>1</sub>') + ', … , ' + fr('∂<i>f</i>','∂<i>x</i><sub>n</sub>') + ' )&nbsp;&nbsp; <span class="op">·</span>&nbsp;&nbsp; <i>w</i> ← <i>w</i> − <i>η</i>∇<i>L</i>',
    sym:[['∇','набла / град','Операторът, който събира всички частни производни във вектор.'],

         ['−∇<i>L</i>','минус градиент','Посоката на най-бързо намаляване — накъде вървиш при обучение.'],
         ['<i>η</i>','ета — learning rate','Колко голяма стъпка правиш в тази посока.'],
         ['←','присвояване','Новата стойност на w е старата минус стъпката.']],
    ex:'За <span class="m">f(x,y) = x² + y²</span> в точката (3,4): <span class="m">∇f = (2x, 2y) = (6,8)</span> — сочи навън от началото, най-стръмното изкачване. Стъпка на обучение с η = 0.1: <span class="m">(3,4) − 0.1·(6,8) = (2.4, 3.2)</span> — приближихме се до дъното. Loss-ът падна от 25 на 16.<br><br>За модел от 7 млрд параметъра градиентът заема също толкова памет, колкото и самият модел — затова обучението иска 3–4× повече VRAM от инференса.',

  { id:'chain', g:'an', w:10, en:'Chain rule', bg:'Верижно правило',
    note:'Правилото, което прави дълбокото обучение изобщо възможно. Ако изходът зависи от слой, който зависи от предишен слой, който зависи от теглата — производната е просто произведение на производните по веригата. Обратното разпространение е верижното правило, приложено систематично отзад напред.',
    f:'' + fr('<i>dz</i>','<i>dx</i>') + ' = ' + fr('<i>dz</i>','<i>dy</i>') + ' · ' + fr('<i>dy</i>','<i>dx</i>') + '&nbsp;&nbsp;&nbsp; <span class="op">·</span>&nbsp;&nbsp;&nbsp; ' + fr('∂<i>L</i>','∂<i>w</i><sub>1</sub>') + ' = ' + fr('∂<i>L</i>','∂<i>a</i><sub>n</sub>') + ' · … · ' + fr('∂<i>a</i><sub>2</sub>','∂<i>a</i><sub>1</sub>') + ' · ' + fr('∂<i>a</i><sub>1</sub>','∂<i>w</i><sub>1</sub>'),
    sym:[['∘','композиция','f∘g значи &bdquo;първо g, после f&ldquo;.'],
         ['<i>a</i><sub>k</sub>','активация на слой k','Изходът на k-тия слой.'],
         ['·','умножение по веригата','Производните се умножават, не се събират — това е ключът.'],
         ['<i>L</i>','загуба (loss)','Числото накрая, което минимизираме.']],
    ex:'<span class="m">z = (3x + 1)²</span>. Слагаме <span class="m">y = 3x+1</span>, тогава <span class="m">z = y²</span>, <span class="m">dz/dy = 2y</span>, <span class="m">dy/dx = 3</span>, значи <span class="m">dz/dx = 6y = 6(3x+1)</span>.<br><br>Тук е и цялата причина за изчезващия градиент: 50 слоя, всеки с локална производна около 0.9, дават <span class="m">0.9<sup>50</sup> ≈ 0.005</span> — сигналът, който стига до първия слой, е 200 пъти по-слаб. Остатъчните връзки добавят +1 във всяко звено на веригата и точно затова спасяват дълбоките мрежи.',
    e:['train|backprop|p','train|autodiff|p','nn|resid|p','seq|rnn|p','nn|norm|s','train|clip|s'], req:['deriv','partial'] },

  { id:'jac', g:'an', w:8, en:'Jacobian matrix', bg:'Якобиан (матрица на Якоби)',
    note:'Когато функцията приема вектор и връща вектор, производната ѝ е цяла матрица — по един ред за всеки изход, по една колона за всеки вход. Всеки слой в мрежата има якобиан, и backprop е поредица от умножения вектор по якобиан.',
    f:'<i>J</i><sub>ij</sub> = ' + fr('∂<i>f</i><sub>i</sub>','∂<i>x</i><sub>j</sub>') + '&nbsp;&nbsp; <span class="op">·</span>&nbsp;&nbsp; <i>J</i> ∈ ℝ<sup>m×n</sup> за <i>f</i>: ℝ<sup>n</sup> → ℝ<sup>m</sup>',

         ['<i>f</i>: ℝ<sup>n</sup> → ℝ<sup>m</sup>','функция от n към m измерения','Приема n числа, връща m числа.'],
         ['<i>v</i><sup>T</sup><i>J</i>','вектор по якобиан (VJP)','Това, което backprop реално смята — никога не строи цялата матрица.'],

  { id:'hess', g:'an', w:6, en:'Hessian & second derivatives', bg:'Хесиан и втори производни',
    note:'Матрицата от всички втори производни — казва ти дали си в дъно, връх или седло и колко е извита повърхността. Пълният хесиан е практически неизчислим за големи модели, но диагоналното му приближение е точно това, което Adam оценява.',
    f:'<i>H</i><sub>ij</sub> = ' + fr('∂<sup>2</sup><i>f</i>','∂<i>x</i><sub>i</sub>∂<i>x</i><sub>j</sub>') + '&nbsp;&nbsp; <span class="op">·</span>&nbsp;&nbsp; <i>H</i> ≻ 0 ⇒ локален минимум',
    sym:[['<i>H</i>','хесиан','Симетрична матрица n×n от вторите производни.'],
         ['∂<sup>2</sup><i>f</i>/∂<i>x</i>∂<i>y</i>','смесена втора производна','Първо по x, после по y. Редът няма значение при гладки функции.'],
         ['∇<sup>2</sup><i>f</i>','набла на квадрат','Друг запис за хесиана.'],
         ['<i>H</i><sup>−1</sup>∇<i>f</i>','стъпка на Нютон','Идеалната стъпка, ако можеше да си позволиш да обърнеш H.']],
    ex:'За модел със 7 милиарда параметъра хесианът има <span class="m">7·10<sup>9</sup> × 7·10<sup>9</sup> ≈ 5·10<sup>19</sup></span> елемента — повече от всички байтове на всички твърди дискове на света. Затова: Adam пази само по едно число на параметър (диагонално приближение), L-BFGS пази последните 10 градиента, а K-FAC приближава хесиана като Кронекерово произведение на две малки матрици.',
    e:['train|adam|p','eval|genbound|s','train|sgd|s','eval|bv|s'], req:['partial','psd','deriv'] },

  { id:'taylor', g:'an', w:6, en:'Taylor expansion', bg:'Развитие в ред на Тейлър',
    note:'Приближаваш всяка гладка функция локално с полином. Оттук идва обосновката на градиентното спускане: правиш линейно приближение около текущата точка и стъпваш надолу по него. Всички доказателства за скорост на сходимост минават през Тейлър.',
    f:'<i>f</i>(<i>x</i>+<i>h</i>) ≈ <i>f</i>(<i>x</i>) + ∇<i>f</i>(<i>x</i>)<sup>T</sup><i>h</i> + ' + fr('1','2') + '<i>h</i><sup>T</sup><i>Hh</i> + …',
    sym:[['≈','приблизително равно','Валидно за малки h; грешката расте с ‖h‖³.'],
         ['<i>h</i>','малко отместване','Стъпката, която правиш от текущата точка.'],
         ['1-ви ред','линейно приближение','Само градиентът — това е градиентното спускане.'],

    ex:'<span class="m">e<sup>x</sup> ≈ 1 + x + x²/2</span> около нулата: при x = 0.1 дава 1.105 срещу истинската 1.10517 — грешка под 0.02%. Тази логика обосновава и learning rate-а: линейното приближение е добро само в малка околност, затова стъпката трябва да е малка. Прекалено голям η значи, че си напуснал зоната, в която приближението важи — и loss-ът скача.',
    e:['train|sgd|p','train|lr|p','train|adam|s','eval|genbound|s'], req:['deriv','hess','series'] },

  { id:'convex', g:'an', w:7, en:'Convexity', bg:'Изпъкналост',
    note:'Изпъкнала функция има само едно дъно — намериш ли локален минимум, той е глобален. Класическите модели са изпъкнали и затова с гаранция се обучават; невронните мрежи не са, и целият фолклор около learning rate, инициализация и разписания идва точно оттам.',
    f:'<i>f</i>(<i>λx</i> + (1−<i>λ</i>)<i>y</i>) ≤ <i>λf</i>(<i>x</i>) + (1−<i>λ</i>)<i>f</i>(<i>y</i>),&nbsp;&nbsp; <i>λ</i> ∈ [0,1]',

         ['строго изпъкнала','strictly convex','Единствен минимум, без плоски участъци.']],
    ex:'Изпъкнали: <span class="m">x²</span>, <span class="m">|x|</span>, <span class="m">e<sup>x</sup></span>, <span class="m">−log x</span>, кръстосаната ентропия по логитите на логистична регресия. Неизпъкнали: всичко с повече от един скрит слой. Линейната и логистичната регресия и SVM имат гарантирано едно решение — стартовата точка няма значение. Невронна мрежа, обучена два пъти с различни seed-ове, стига до две различни решения, често с еднакво добра точност.',
    e:['cls|logreg|p','cls|svm|p','cls|linreg|p','train|sgd|s','eval|genbound|s'], req:['deriv','hess'] },

  { id:'integral', g:'an', w:7, en:'Integrals', bg:'Интеграли (определен и неопределен)',
    note:'Сумиране на непрекъснато количество. В ML интегралът почти винаги значи едно от две: обща вероятност под крива, или очаквана стойност. Рядко го смяташ на ръка — обикновено или има готова формула, или го приближаваш чрез сампълване.',
    f:'∫<sub><i>a</i></sub><sup><i>b</i></sup> <i>f</i>(<i>x</i>) <i>dx</i> = площ под кривата&nbsp;&nbsp; <span class="op">·</span>&nbsp;&nbsp; ∫<sub>−∞</sub><sup>∞</sup> <i>p</i>(<i>x</i>) <i>dx</i> = 1',
    sym:[['∫','интеграл','Издължено S от &bdquo;сума&ldquo;. Непрекъснатият аналог на Σ.'],
         ['<i>dx</i>','де х','Безкрайно малка ширина на стъпката. Показва по коя променлива интегрираш.'],
         ['<sub><i>a</i></sub><sup><i>b</i></sup>','граници на интегриране','От a до b. Без граници = неопределен интеграл (първообразна).'],
         ['∫∫, ∫∫∫','многократен интеграл','По две или повече променливи.']],
    ex:'<span class="m">∫₀¹ x² dx = [x³/3]₀¹ = 1/3</span>. В ML: площта под ROC кривата (AUC) е буквално определен интеграл. Плътността на нормалното разпределение интегрира до 1 по цялата ос — това е условието да е валидно разпределение. И всяко очакване <span class="m">E[X] = ∫ x·p(x) dx</span> е интеграл.',
    e:['eval|metrics|p','prob|bayesinf|p','prob|vae|s','eval|calib|s'], req:['deriv','lim'] },

  { id:'multint', g:'an', w:6, en:'Multiple integrals & marginalization', bg:'Многократни интеграли и маргинализация',
    note:'&bdquo;Изинтегрирай ненужната променлива&ldquo; — така от съвместно разпределение получаваш това, което те интересува. Точно тази операция е трудната в бейсовото извеждане и точно тя ражда цялата машинария на вариационните методи и MCMC.',
    f:'<i>p</i>(<i>x</i>) = ∫ <i>p</i>(<i>x</i>, <i>z</i>) <i>dz</i>&nbsp;&nbsp; <span class="op">·</span>&nbsp;&nbsp; <i>p</i>(<i>x</i>) = ∫ <i>p</i>(<i>x</i>|<i>z</i>)<i>p</i>(<i>z</i>) <i>dz</i>',
    sym:[['∫ … <i>dz</i>','интегриране по z','Сумиране по всички възможни стойности на скритата променлива.'],
         ['<i>p</i>(<i>x</i>,<i>z</i>)','съвместно разпределение','Вероятността двете да се случат заедно.'],
         ['маргинал','marginal','Разпределението на едната променлива сама по себе си.'],
         ['Σ<sub><i>z</i></sub>','сума по z','Същото, но за дискретни променливи.']],
    ex:'VAE иска да сметне <span class="m">p(x) = ∫ p(x|z)p(z) dz</span> — вероятността на изображението, сумирана по всички възможни латентни кодове z ∈ ℝ<sup>128</sup>. Този интеграл е неизчислим (128-мерен), затова VAE оптимизира долна граница (ELBO) вместо него. Цялото семейство вариационни методи съществува заради този един неизчислим интеграл.',
    e:['prob|vae|p','prob|bayesinf|p','prob|mcmc|p','prob|em|p','cls|gmm|s','prob|bnn|s'], req:['integral','joint'] },

  { id:'chvar', g:'an', w:5, en:'Change of variables & Jacobian determinant', bg:'Смяна на променливите и детерминанта на якобиана',
    note:'Ако преобразуваш случайна величина, плътността ѝ се променя с фактор — детерминантата на якобиана. Това е точно математиката, върху която стоят normalizing flows: обратимо преобразуване, при което знаеш как се променя плътността.',
    f:'<i>p</i><sub><i>y</i></sub>(<i>y</i>) = <i>p</i><sub><i>x</i></sub>(<i>x</i>) · |det ' + fr('∂<i>x</i>','∂<i>y</i>') + '|&nbsp;&nbsp; <span class="op">·</span>&nbsp;&nbsp; log <i>p</i>(<i>y</i>) = log <i>p</i>(<i>x</i>) − log|det <i>J</i>|',
    sym:[['|det <i>J</i>|','модул на детерминантата на якобиана','Колко пъти преобразуванието свива или разтяга обема локално.'],
         ['<i>p</i><sub><i>y</i></sub>','плътност на новата променлива','Разпределението след преобразуванието.'],
         ['обратимо','bijective','Преобразуванието трябва да може да се върне назад еднозначно.']],
    ex:'Ако <span class="m">y = 2x</span>, разтягаш оста два пъти, значи плътността трябва да се свие два пъти: <span class="m">p_y(y) = p_x(y/2)/2</span>. Normalizing flows строят вериги от такива преобразувания със специална структура (триъгълен якобиан), при която детерминантата е просто произведение на диагонала — вместо O(n³) операции става O(n).',
    e:['prob|flow|p','prob|diff|s','prob|vae|s'], req:['jac','rank','pdf'] },

  { id:'lagrange', g:'an', w:5, en:'Lagrange multipliers & KKT', bg:'Множители на Лагранж и условия на KKT',
    note:'Как да оптимизираш при ограничения — &bdquo;минимизирай това, но при условие че онова е изпълнено&ldquo;. Стои зад дуалната формулировка на SVM (оттам идва кернел трикът) и зад доказателството, че softmax е правилният избор при ограничение за максимална ентропия.',
    f:'ℒ(<i>x</i>,<i>λ</i>) = <i>f</i>(<i>x</i>) + <i>λg</i>(<i>x</i>),&nbsp;&nbsp; ∇<sub><i>x</i></sub>ℒ = 0,&nbsp; <i>g</i>(<i>x</i>) = 0',

         ['<i>g</i>(<i>x</i>) = 0','ограничение равенство','Условието, което трябва да е изпълнено.'],
         ['KKT','Karush-Kuhn-Tucker','Обобщението за ограничения тип неравенство (g(x) ≤ 0).']],
    ex:'SVM: минимизирай <span class="m">½‖w‖²</span> при условие всяка точка да е правилно класифицирана с отстъп поне 1. Дуалната задача, получена чрез множителите, зависи от данните само през скаларните произведения <span class="m">x<sub>i</sub>·x<sub>j</sub></span> — и точно тук можеш да ги замениш с кернел <span class="m">K(x<sub>i</sub>,x<sub>j</sub>)</span>, без изобщо да строиш новото пространство. Целият кернел трик излиза оттук.',

  { id:'series', g:'an', w:3, en:'Sequences, series & convergence', bg:'Редици, редове и сходимост',
