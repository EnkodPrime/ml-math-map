         ['сходи','converges','Сумата има крайна стойност.'],
         ['O(1/<i>t</i>)','скорост на сходимост','Как бързо грешката пада с броя стъпки.']],
    ex:'В обучението с подкрепление възвръщаемостта е <span class="m">G = r₀ + γr₁ + γ²r₂ + …</span>. При γ = 0.99 и постоянна награда 1 сумата е <span class="m">1/(1−0.99) = 100</span> — това е &bdquo;ефективният хоризонт&ldquo;, около 100 стъпки напред. При γ = 0.9 хоризонтът е само 10 стъпки. Един параметър, а решава дали агентът мисли краткосрочно или дългосрочно.',
    e:['seq|qlearn|p','seq|mdp|p','train|sgd|s'], req:['lim'] },

  { id:'ode', g:'an', w:4, en:'Differential equations (ODE / SDE)', bg:'Диференциални уравнения (ОДУ и СДУ)',
    note:'Уравнение, което задава не стойността, а скоростта на изменение. Неочаквано важно в модерното генеративно моделиране: дифузионните модели са дискретизация на стохастично диференциално уравнение, а Neural ODE гледат на дълбочината на мрежата като на непрекъснато време.',
    f:'' + fr('<i>dx</i>','<i>dt</i>') + ' = <i>f</i>(<i>x</i>,<i>t</i>)&nbsp;&nbsp; <span class="op">·</span>&nbsp;&nbsp; <i>dx</i> = <i>f</i>(<i>x</i>,<i>t</i>)<i>dt</i> + <i>g</i>(<i>t</i>)<i>dW</i>',
    sym:[['<i>dx</i>/<i>dt</i>','скорост на изменение във времето','Как състоянието се променя с течение на времето.'],
         ['<i>dW</i>','Винеров процес / бял шум','Случайната съставка — оттук идва &bdquo;стохастично&ldquo;.'],
         ['<i>f</i>(<i>x</i>,<i>t</i>)','drift — детерминистична част','Систематичното движение.'],
         ['<i>g</i>(<i>t</i>)','diffusion — сила на шума','Колко шум се добавя на всяка стъпка.']],
    ex:'Дифузионен модел: правият процес добавя малко Гаусов шум на всяка от 1000 стъпки, докато изображението стане чист шум. Обратният процес е също СДУ и мрежата се учи да предсказва шума на всяка стъпка. По-новите семплери (DDIM, DPM-Solver) са просто по-добри числени решаватели на същото уравнение — затова стигат от 1000 до 20 стъпки при същото качество.',
    e:['prob|diff|p','seq|ssm|p','prob|flow|s'], req:['deriv','stoch'] },

  { id:'autodiff_m', g:'an', w:8, en:'Automatic differentiation', bg:'Автоматично диференциране',
    note:'Как компютърът наистина смята производни — нито символно (израз-експлозия), нито числено (загуба на точност), а като прилага верижното правило върху графа на изчислението. Обратният режим смята градиента спрямо милиони параметри на цената на едно минаване напред.',
    f:'напред: <i>Jv</i>&nbsp;&nbsp; <span class="op">·</span>&nbsp;&nbsp; назад: <i>v</i><sup>T</sup><i>J</i>&nbsp;&nbsp; <span class="op">·</span>&nbsp;&nbsp; цена(∇<i>L</i>) ≈ 2–3 × цена(<i>L</i>)',
    sym:[['VJP','vector-Jacobian product','Обратен режим — това, което backprop смята. Евтин при много входове, един изход.'],
         ['JVP','Jacobian-vector product','Прав режим. Евтин при малко входове, много изходи.'],
         ['граф на изчислението','computational graph','Записът кои операции са били приложени и в какъв ред.'],
         ['<code>.backward()</code>','обратно минаване','Извикването, което пуска верижното правило през целия граф.']],
    ex:'Числено диференциране на модел със 7 млрд параметъра би искало 7 млрд минавания напред за един градиент — при 0.1 сек всяко, това е около 22 години на стъпка. Обратният режим го прави за около 2× цената на едно минаване, тоест 0.2 сек. Разликата не е оптимизация, а разликата между възможно и невъзможно.',
    e:['train|autodiff|p','train|backprop|p','sys|dist|s','train|clip|s'], req:['chain','jac'] },

  { id:'expfun', g:'an', w:9, en:'exp, log, sigmoid, softmax family', bg:'Експонента, логаритъм, сигмоида, softmax',
    note:'Шепа функции, които се появяват буквално навсякъде в ML. Логаритъмът превръща произведения в суми (затова loss-овете са log-likelihood). Експонентата прави всичко положително. Сигмоидата и softmax превръщат произволни числа във вероятности.',
    f:'<i>σ</i>(<i>x</i>) = ' + fr('1','1 + <i>e</i><sup>−<i>x</i></sup>') + '&nbsp;&nbsp; <span class="op">·</span>&nbsp;&nbsp; softmax(<i>z</i>)<sub>i</sub> = ' + fr('<i>e</i><sup><i>z</i><sub>i</sub></sup>','Σ<sub>j</sub> <i>e</i><sup><i>z</i><sub>j</sub></sup>') + '&nbsp;&nbsp; <span class="op">·</span>&nbsp;&nbsp; log(<i>ab</i>) = log <i>a</i> + log <i>b</i>',
    sym:[['<i>e</i>','числото на Ойлер ≈ 2.718','Основата, при която производната на e^x е самата e^x.'],
         ['<i>σ</i>','сигма (малка) — сигмоида','Смачква всяко реално число в интервала (0,1).'],
         ['log','натурален логаритъм (ln)','В ML &bdquo;log&ldquo; почти винаги значи натурален, с основа e.'],
         ['<i>z</i><sub>i</sub>','логити','Суровите изходи на модела, преди да станат вероятности.'],
         ['softmax','мека максимална функция','Гладък вариант на &bdquo;вземи най-голямото&ldquo;, връща вероятностно разпределение.']],
    ex:'Логити <span class="m">z = (2, 1, 0)</span> → <span class="m">e<sup>z</sup> = (7.39, 2.72, 1)</span>, сума 11.11 → softmax = <span class="m">(0.665, 0.245, 0.090)</span>. Забележи: разлика от 1 в логитите дава около 2.7× разлика във вероятността. Логаритъмът е причината загубата да е сума, а не произведение: правдоподобието на 1000 независими примера е произведение от 1000 числа под 1 — препълва се до 0 при float; логаритъмът го превръща в сума и проблемът изчезва.',
    e:['nn|softmax|p','nn|act|p','cls|logreg|p','train|loss|p','sys|stab|p','seq|decode|p'], req:['deriv'] },

  { id:'funcspace', g:'an', w:4, en:'Function spaces & functionals', bg:'Функционални пространства и функционали',
    note:'Абстракцията, при която самите функции са точки в пространство. Позволява да питаш &bdquo;коя е най-добрата функция&ldquo; вместо &bdquo;кои са най-добрите параметри&ldquo;. Стои зад Гаусовите процеси, кернел методите и вариационното смятане.',
    f:'⟨<i>f</i>,<i>g</i>⟩<sub>ℋ</sub> = ∫ <i>f</i>(<i>x</i>)<i>g</i>(<i>x</i>) <i>dx</i>&nbsp;&nbsp; <span class="op">·</span>&nbsp;&nbsp; <i>K</i>(<i>x</i>,<i>x</i>′) = ⟨<i>φ</i>(<i>x</i>), <i>φ</i>(<i>x</i>′)⟩',
    sym:[['ℋ','хилбертово пространство','Пространство от функции със скаларно произведение — има смисъл да питаш за ъгъл и дължина между функции.'],
         ['<i>K</i>(<i>x</i>,<i>x</i>′)','кернел функция','Сходство между две точки; равно на скаларно произведение в скрито пространство.'],
         ['<i>φ</i>','фи — преобразуване на признаците','Изображението към скритото пространство, което никога не смяташ явно.'],
         ['функционал','functional','Функция, чийто вход е функция, а изходът е число.']],
    ex:'RBF кернел <span class="m">K(x,x′) = exp(−‖x−x′‖²/2σ²)</span> отговаря на безкрайномерно пространство от признаци. Никога не строиш това пространство — смяташ само K, което е едно число. SVM с RBF кернел на практика намира линейна разделяща равнина в безкрайно измерение, за цена O(n²).',
    e:['cls|gp|p','cls|svm|p','prob|vae|s','eval|genbound|s'], req:['integral','dot'] },

  // ============ ОПТИМИЗАЦИЯ ============
  { id:'objective', g:'opt', w:10, en:'Objective functions & minimization', bg:'Целева функция и минимизация',
    note:'Всяко обучение е една и съща задача: намери параметрите, които правят едно число възможно най-малко. Това число е загубата. Изборът на загуба определя какво моделът реално се научава да прави — по-силно дори от избора на архитектура.',
    f:'<i>θ</i>* = arg min<sub><i>θ</i></sub> ' + fr('1','<i>N</i>') + ' Σ<sub><i>i</i>=1</sub><sup><i>N</i></sup> <i>ℓ</i>(<i>f</i><sub><i>θ</i></sub>(<i>x</i><sub>i</sub>), <i>y</i><sub>i</sub>) + <i>λR</i>(<i>θ</i>)',
    sym:[['arg min','аргументът, при който е минимумът','Не най-малката стойност, а точката, в която се достига.'],
         ['<i>θ</i>','тета — параметри','Всички обучаеми тегла на модела, събрани в един вектор.'],
         ['<i>ℓ</i>','малко ел — загуба за един пример','Наказанието за една грешка.'],
         ['<i>L</i> или <i>J</i>','целева функция','Средното по целия набор — числото, което гледаш в лога.'],
         ['<i>R</i>(<i>θ</i>)','регуляризатор','Наказание за сложност на модела, независещо от данните.'],
         ['<i>λ</i>','сила на регуляризацията','Балансът между напасване и простота.']],
    ex:'Един ред обобщава почти цялото обучение: <span class="m">θ* = arg min<sub>θ</sub> [ загуба(данни) + λ·сложност ]</span>. Регресия с MSE учи условното средно; същите данни със MAE учат медианата — различна загуба, различен модел, при абсолютно същата архитектура и данни.',
    e:['train|loss|p','train|sgd|p','prob|mle|p','train|wd|p','prob|gan|s','eval|bv|s'], req:['grad'] },

  { id:'gd', g:'opt', w:10, en:'Gradient descent & learning rate', bg:'Градиентно спускане и learning rate',
    note:'Алгоритъмът, който върти цялото дълбоко обучение. Смяташ градиента, правиш малка стъпка в обратна посока, повтаряш. Learning rate-ът е най-важният хиперпараметър — по-важен от архитектурата, оптимизатора и почти всичко останало.',
    f:'<i>θ</i><sub><i>t</i>+1</sub> = <i>θ</i><sub><i>t</i></sub> − <i>η</i> ∇<i>L</i>(<i>θ</i><sub><i>t</i></sub>)',
    sym:[['<i>η</i>','ета — learning rate','Дължина на стъпката. Типично 1e−3 за Adam, 1e−1 за SGD.'],
         ['<i>t</i>','номер на стъпката','Един update, не една епоха.'],
         ['−∇<i>L</i>','посока на спускане','Най-стръмното намаляване на загубата.'],
         ['<i>θ</i><sub><i>t</i>+1</sub>','следващи параметри','Резултатът от една стъпка.']],
    ex:'Минимизираме <span class="m">L(θ) = θ²</span> от θ = 10, η = 0.1: градиентът е <span class="m">2θ = 20</span>, значи <span class="m">θ ← 10 − 0.1·20 = 8</span>. После 6.4, 5.12, 4.096 — геометрично приближаване. Но при η = 0.6: <span class="m">10 → −2 → 0.4 → −0.08</span> — осцилира, макар да сходи. При η = 1.1: <span class="m">10 → −12 → 14.4</span> — разходимост. Прагът тук е η &lt; 1/L, където L е кривината. Точно това виждаш като NaN в лога при твърде голям learning rate.',
    e:['train|sgd|p','train|lr|p','train|adam|p','train|backprop|p','seq|pg|s'], req:['grad','taylor'] },

  { id:'statpts', g:'opt', w:7, en:'Stationary points, saddles, minima', bg:'Стационарни точки, седла, минимуми',
    note:'Къде спира градиентното спускане и защо това не е задължително добро. В много измерения истинските локални минимуми са рядкост — почти всички точки с нулев градиент са седла, където повърхността е нагоре по едни оси и надолу по други.',
    f:'∇<i>L</i>(<i>θ</i>) = 0&nbsp;&nbsp; <span class="op">·</span>&nbsp;&nbsp; <i>H</i> ≻ 0 → минимум,&nbsp; <i>H</i> ≺ 0 → максимум,&nbsp; смесени знаци → седло',
    sym:[['∇<i>L</i> = 0','нулев градиент','Необходимо, но не достатъчно условие за минимум.'],
         ['седло','saddle point','Минимум по едни посоки, максимум по други — като седло на кон.'],
         ['плато','plateau','Почти нулев градиент на голяма област — обучението спира да напредва.'],
         ['<i>λ</i><sub>min</sub>','най-малка собствена стойност на H','Отрицателна стойност значи, че има посока за бягство надолу.']],
    ex:'В пространство с милиард измерения точка с нулев градиент е локален минимум само ако и милиардът собствени стойности са положителни. Ако всяка е положителна с вероятност 1/2, шансът е <span class="m">2<sup>−10<sup>9</sup></sup></span> — практически нула. Затова дълбокото обучение работи: не засядаш в лоши минимуми, а минаваш през седла, а шумът в SGD помага точно за това.',
    e:['train|sgd|p','train|adam|p','prob|gan|p','train|lr|s','train|init|s'], req:['grad','hess','convex'] },

  { id:'sgdconv', g:'opt', w:7, en:'Stochastic approximation & SGD', bg:'Стохастична апроксимация и SGD',
    note:'Защо изобщо работи да смяташ градиента върху 32 примера вместо върху милион. Мини-батч градиентът е несместена оценка на истинския — верен средно, шумен поотделно. Шумът дори помага: избягва седла и се държи като слаба регуляризация.',
    f:'𝔼[∇<i>L</i><sub>batch</sub>] = ∇<i>L</i><sub>full</sub>&nbsp;&nbsp; <span class="op">·</span>&nbsp;&nbsp; Var ∝ ' + fr('1','<i>B</i>') + '&nbsp;&nbsp; <span class="op">·</span>&nbsp;&nbsp; Σ<i>η</i><sub><i>t</i></sub> = ∞, Σ<i>η</i><sub><i>t</i></sub><sup>2</sup> &lt; ∞',
    sym:[['𝔼[·]','очаквана стойност','Средното по всички възможни батчове.'],
         ['<i>B</i>','размер на батча','Броят примери в един update.'],
         ['Var','дисперсия','Разпръснатостта на оценката на градиента. Пада като 1/B.'],
         ['условия на Robbins-Monro','Σηₜ = ∞, Σηₜ² &lt; ∞','Стъпките трябва да намаляват, но не твърде бързо — оттук идват LR разписанията.']],
    ex:'Батч 32 срещу батч 512: 16× по-малко шум, но 16× по-скъпа стъпка. Понеже стандартното отклонение пада само като <span class="m">√B</span>, четирикратно по-голям батч намалява шума само двойно. Оттук идва и правилото &bdquo;умножиш ли батча по k, умножи и learning rate-а по k (или по √k)&ldquo;.',
    e:['train|sgd|p','train|lr|p','sys|dist|p','train|adam|s','eval|bv|s'], req:['grad','expect','clt'] },

  { id:'momentum', g:'opt', w:6, en:'Momentum & adaptive methods', bg:'Инерция и адаптивни методи',
    note:'Как Adam и SGD с momentum наистина работят. Инерцията натрупва пълзящо средно на градиентите, за да не зигзагира по тесни каньони. Адаптивните методи мащабират стъпката поотделно за всеки параметър според колко шумен е бил градиентът му.',
    f:'<i>v</i><sub><i>t</i></sub> = <i>β</i><sub>1</sub><i>v</i><sub><i>t</i>−1</sub> + (1−<i>β</i><sub>1</sub>)<i>g</i><sub><i>t</i></sub>&nbsp;&nbsp; <span class="op">·</span>&nbsp;&nbsp; <i>s</i><sub><i>t</i></sub> = <i>β</i><sub>2</sub><i>s</i><sub><i>t</i>−1</sub> + (1−<i>β</i><sub>2</sub>)<i>g</i><sub><i>t</i></sub><sup>2</sup>&nbsp;&nbsp; <span class="op">·</span>&nbsp;&nbsp; <i>θ</i> ← <i>θ</i> − <i>η</i> ' + fr('<i>v̂</i>','√<i>ŝ</i> + <i>ε</i>'),
    sym:[['<i>β</i><sub>1</sub>','бета едно ≈ 0.9','Колко от старата инерция се пази. Средно по последните ~10 градиента.'],
         ['<i>β</i><sub>2</sub>','бета две ≈ 0.999','Пълзящо средно на квадратите — средно по последните ~1000.'],
         ['<i>g</i><sub><i>t</i></sub>','градиент на стъпка t','Текущият мини-батч градиент.'],
         ['<i>ε</i>','епсилон ≈ 1e−8','Мъничко число, за да не делиш на нула.'],
         ['<i>v̂</i>, <i>ŝ</i>','с шапка — коригирани за отклонение','Поправка за това, че в началото средните тръгват от нула.']],
    ex:'В издължена долина чистият SGD зигзагира напречно и пълзи надлъж. Инерцията събира последователните напречни градиенти, които се компенсират, и натрупва надлъжните, които съвпадат — резултатът е ускорение по правилната ос. Adam добавя деление на <span class="m">√ŝ</span>: параметър с редки, но големи градиенти (например embedding на рядка дума) получава пропорционално по-голяма стъпка.',
    e:['train|adam|p','train|sgd|p','train|lr|s'], req:['gd','hess','expect'] },

  { id:'constr', g:'opt', w:4, en:'Constrained optimization & duality', bg:'Оптимизация с ограничения и двойственост',
    note:'Оптимизация, при която решението трябва да отговаря на условия. Двойствеността е дълбокият резултат, че всяка такава задача има огледален двойник, който понякога е много по-лесен — точно това дава кернел трика при SVM.',
    f:'min <i>f</i>(<i>x</i>) при <i>g</i>(<i>x</i>) ≤ 0&nbsp;&nbsp; ⇔&nbsp;&nbsp; max<sub><i>λ</i>≥0</sub> min<sub><i>x</i></sub> ℒ(<i>x</i>,<i>λ</i>)',
    sym:[['s.t.','subject to / при условие че','Въвежда ограниченията.'],
         ['примал / дуал','основна и двойствена задача','Двете еквивалентни формулировки на едно и също.'],
         ['силна двойственост','strong duality','Двете задачи имат една и съща оптимална стойност — важи при изпъкнали задачи.'],
         ['проекция','projection','Връщане на решението обратно в допустимата област след стъпка.']],
    ex:'SVM в примална форма търси w в пространство с толкова измерения, колкото признаци. В дуална форма търси по един коефициент α за всеки пример — и задачата зависи само от скаларните произведения. Ако имаш 100 примера с по 1 000 000 признака, дуалът е несравнимо по-малък. И точно там влиза кернелът.',
    e:['cls|svm|p','prob|gan|p','seq|rlhf|s','train|wd|s'], req:['lagrange','convex'] },

  { id:'fixed', g:'opt', w:3, en:'Fixed-point iteration & contraction', bg:'Итерация с неподвижна точка и свиващи изображения',
    note:'&bdquo;Прилагай едно и също правило, докато нищо не се променя&ldquo;. Теоремата за свиващото изображение гарантира, че ако всяка стъпка приближава нещата, ще стигнеш до единствен отговор. Оттам идва доказателството, че value iteration в RL винаги сходи.',
    f:'<i>x</i><sub><i>k</i>+1</sub> = <i>T</i>(<i>x</i><sub><i>k</i></sub>) → <i>x</i>*&nbsp;&nbsp; ако&nbsp; ‖<i>T</i>(<i>a</i>)−<i>T</i>(<i>b</i>)‖ ≤ <i>γ</i>‖<i>a</i>−<i>b</i>‖,&nbsp; <i>γ</i> &lt; 1',
    sym:[['<i>T</i>','оператор','Правилото, което прилагаш многократно.'],
         ['<i>x</i>*','неподвижна точка','Стойността, при която T(x*) = x* — нищо повече не се променя.'],
         ['<i>γ</i>','коефициент на свиване','Всяка стъпка намалява разстоянието поне γ пъти.'],
         ['оператор на Белман','Bellman operator','Конкретният T в обучението с подкрепление.']],
    ex:'Оператор на Белман: <span class="m">Q(s,a) ← r + γ·max<sub>a′</sub> Q(s′,a′)</span>. Той е свиващ с коефициент γ, значи има точно едно решение и итерацията винаги стига до него, независимо от началните стойности. Точно това е теоретичната гаранция зад Q-learning — гаранция, която обаче отпада щом заместиш таблицата с невронна мрежа.',
    e:['seq|qlearn|p','seq|mdp|p','prob|em|s'], req:['series','norms'] },

  // ============ ВЕРОЯТНОСТИ ============
  { id:'probax', g:'pr', w:7, en:'Probability space & axioms', bg:'Вероятностно пространство и аксиоми',
    note:'Правилата на играта: какво изобщо е вероятност. Три аксиоми, от които следва всичко останало. Важни са не за да ги рецитираш, а за да можеш да проверяваш дали разсъждение с вероятности е валидно.',
    f:'0 ≤ <i>P</i>(<i>A</i>) ≤ 1&nbsp;&nbsp; <span class="op">·</span>&nbsp;&nbsp; <i>P</i>(Ω) = 1&nbsp;&nbsp; <span class="op">·</span>&nbsp;&nbsp; <i>P</i>(<i>A</i> ∪ <i>B</i>) = <i>P</i>(<i>A</i>) + <i>P</i>(<i>B</i>) при несъвместими <i>A</i>, <i>B</i>',
    sym:[['<i>P</i>(<i>A</i>)','вероятност за A','Число между 0 и 1.'],
         ['Ω','омега — извадково пространство','Множеството на всички възможни изходи.'],
         ['∪, ∩','обединение, сечение','&bdquo;или&ldquo; и &bdquo;и&ldquo;.'],
         ['<i>A</i><sup>c</sup> или <i>Ā</i>','допълнение','&bdquo;не A&ldquo;. P(Ā) = 1 − P(A).'],
         ['∅','празно множество','Невъзможно събитие, P(∅) = 0.']],
    ex:'Зар: Ω = {1,…,6}, P(четно) = 3/6 = 0.5. Проверка за здрав разум на модел: ако softmax изходите ти не сумират до 1, някъде има бъг. Ако модел твърди P(котка) = 0.7 и P(куче) = 0.6 при взаимно изключващи се класове — това е невъзможно и значи, че си използвал сигмоида вместо softmax.',
    e:['nn|softmax|p','eval|calib|p','cls|nb|s'], req:[] },

  { id:'condprob', g:'pr', w:9, en:'Conditional probability & Bayes', bg:'Условна вероятност и теорема на Бейс',
    note:'Как да обновиш убеждението си, когато видиш нови данни. Теоремата на Бейс е може би най-важната формула в цялата статистика и стои зад класификацията, диагностиката, филтрирането на спам и цялата бейсова школа в ML.',
    f:'<i>P</i>(<i>A</i>|<i>B</i>) = ' + fr('<i>P</i>(<i>A</i> ∩ <i>B</i>)','<i>P</i>(<i>B</i>)') + '&nbsp;&nbsp;&nbsp; <span class="op">·</span>&nbsp;&nbsp;&nbsp; <i>P</i>(<i>θ</i>|<i>D</i>) = ' + fr('<i>P</i>(<i>D</i>|<i>θ</i>) <i>P</i>(<i>θ</i>)','<i>P</i>(<i>D</i>)'),
    sym:[['<i>P</i>(<i>A</i>|<i>B</i>)','вероятност за A при дадено B','Отвесната черта се чете &bdquo;при условие че&ldquo;.'],
         ['<i>P</i>(<i>θ</i>|<i>D</i>)','постериор','Убеждението за параметрите, след като си видял данните.'],
         ['<i>P</i>(<i>D</i>|<i>θ</i>)','правдоподобие (likelihood)','Колко вероятни са данните, ако параметрите са такива.'],
         ['<i>P</i>(<i>θ</i>)','приор','Убеждението преди да видиш данните.'],
         ['<i>P</i>(<i>D</i>)','evidence / нормировка','Знаменателят, който прави всичко да сумира до 1. Обикновено неизчислим.'],
         ['∝','пропорционално на','Постериор ∝ правдоподобие × приор — знаменателят често се пропуска.']],
    ex:'Тест за болест с 99% точност, болестта е при 1 на 10 000 души. Положителен тест — каква е вероятността наистина да си болен? <span class="m">P = (0.99·0.0001) / (0.99·0.0001 + 0.01·0.9999) = 0.0098</span> — под 1%. Приорът смазва правдоподобието. Точно тази грешка правят хората постоянно и точно затова моделите за редки събития изглеждат добри по accuracy и са безполезни на практика.',
    e:['cls|nb|p','prob|bayesinf|p','prob|bnn|p','eval|calib|p','eval|metrics|s','prob|hmm|p'], req:['probax'] },

  { id:'indep', g:'pr', w:7, en:'Independence & conditional independence', bg:'Независимост и условна независимост',
    note:'Кога знанието за едното нищо не ти казва за другото. Условната независимост е по-фината и по-полезната версия: A и B може да са свързани, но щом знаеш C, връзката изчезва. Точно това допускане прави големите вероятностни модели изчислими.',
    f:'<i>P</i>(<i>A</i> ∩ <i>B</i>) = <i>P</i>(<i>A</i>)<i>P</i>(<i>B</i>)&nbsp;&nbsp; <span class="op">·</span>&nbsp;&nbsp; <i>A</i> ⫫ <i>B</i> | <i>C</i> ⇔ <i>P</i>(<i>A</i>,<i>B</i>|<i>C</i>) = <i>P</i>(<i>A</i>|<i>C</i>)<i>P</i>(<i>B</i>|<i>C</i>)',
    sym:[['⫫','независимо от','Двойна отвесна черта. A ⫫ B значи &bdquo;A и B са независими&ldquo;.'],
         ['<i>A</i> ⫫ <i>B</i> | <i>C</i>','условно независими при дадено C','След като знаеш C, A не носи информация за B.'],
         ['i.i.d.','независими и еднакво разпределени','Стандартното допускане за примерите в обучаващия набор.']],
    ex:'Наивният Бейс приема, че думите в текста са независими при дадена класа — очевидно невярно (&bdquo;машинно&ldquo; и &bdquo;обучение&ldquo; вървят заедно), но моделът работи добре въпреки това. Марковското допускане в HMM е същият тип: бъдещето е независимо от миналото при дадено настоящо състояние. Без такива допускания съвместното разпределение на 1000 двоични променливи има 2^1000 стойности.',
    e:['cls|nb|p','prob|hmm|p','nn|drop|s','eval|ab|s','prob|bayesinf|s'], req:['condprob'] },

  { id:'rv', g:'pr', w:9, en:'Random variables', bg:'Случайни величини',
    note:'Числото, което зависи от изхода на случаен експеримент. Всичко в ML се моделира като случайна величина: етикетът, шумът, инициализацията, dropout маската, извадката от батча. Разликата между дискретни и непрекъснати определя с какви инструменти работиш.',
    f:'<i>X</i> : Ω → ℝ&nbsp;&nbsp; <span class="op">·</span>&nbsp;&nbsp; <i>X</i> ~ <i>p</i>(<i>x</i>)&nbsp;&nbsp; <span class="op">·</span>&nbsp;&nbsp; <i>P</i>(<i>X</i> = <i>x</i>) или <i>p</i>(<i>x</i>)<i>dx</i>',
    sym:[['<i>X</i>','случайна величина (главна буква)','Самата величина, преди да знаеш стойността ѝ.'],
         ['<i>x</i>','реализация (малка буква)','Конкретната наблюдавана стойност.'],
         ['~','разпределена е като','&bdquo;X ~ N(0,1)&ldquo; се чете &bdquo;X е стандартно нормално разпределена&ldquo;.'],
         ['дискретна','discrete','Краен или изброим набор стойности — етикет на клас, брой кликове.'],
         ['непрекъсната','continuous','Всяка стойност в интервал — тегло, температура, embedding компонента.']],
    ex:'Големият език модел третира следващия токен като дискретна случайна величина върху речник от 50 000 стойности; изходът му е разпределение върху тези 50 000. При <code>temperature=0</code> взимаш най-вероятната; при <code>temperature=1</code> теглиш от разпределението. Разликата между детерминиран и стохастичен модел е точно това.',
    e:['seq|decode|p','prob|vae|p','nn|drop|p','data|tokenize|s','prob|mcmc|p'], req:['probax'] },

  { id:'pdf', g:'pr', w:9, en:'PMF, PDF, CDF', bg:'Функции на разпределението: PMF, PDF, CDF',
    note:'Трите начина да опишеш случайна величина. PMF за дискретни (вероятност на всяка стойност), PDF за непрекъснати (плътност, не вероятност!), CDF за &bdquo;по-малко или равно на&ldquo;. Класическата грешка е да мислиш плътността за вероятност — тя може да е и над 1.',
    f:'PMF: <i>P</i>(<i>X</i>=<i>x</i>)&nbsp;&nbsp; <span class="op">·</span>&nbsp;&nbsp; PDF: <i>p</i>(<i>x</i>), ∫<i>p</i> = 1&nbsp;&nbsp; <span class="op">·</span>&nbsp;&nbsp; CDF: <i>F</i>(<i>x</i>) = <i>P</i>(<i>X</i> ≤ <i>x</i>) = ∫<sub>−∞</sub><sup><i>x</i></sup> <i>p</i>(<i>t</i>)<i>dt</i>',
    sym:[['<i>p</i>(<i>x</i>)','плътност (density)','Не е вероятност! Вероятността е p(x)·dx за малък интервал.'],
         ['<i>F</i>(<i>x</i>)','функция на разпределението (CDF)','Натрупаната вероятност до x. Винаги расте от 0 до 1.'],
         ['<i>F</i><sup>−1</sup>','квантилна функция','Обратната на CDF: &bdquo;коя стойност е на 95-ия персентил&ldquo;.'],
         ['<i>p</i>(<i>x</i>|<i>θ</i>)','условна плътност','Плътността при дадени параметри — това е правдоподобието.']],
    ex:'Нормално разпределение със σ = 0.1 има пикова плътност около 3.99 — стойност над 1, което е напълно нормално за плътност. Вероятността обаче стойността да е точно 0 е нула; смисъл има само P(−0.05 &lt; X &lt; 0.05) ≈ 0.38. При inverse transform sampling теглиш u ~ Uniform(0,1) и връщаш <span class="m">F<sup>−1</sup>(u)</span> — така се генерира извадка от всяко разпределение, чиято CDF можеш да обърнеш.',
    e:['prob|mle|p','prob|vae|p','eval|calib|p','prob|flow|p','cls|gmm|s'], req:['rv','integral'] },

  { id:'expect', g:'pr', w:10, en:'Expectation, variance, covariance', bg:'Очаквана стойност, дисперсия, ковариация',
    note:'Средното, разпръснатостта и съвместната изменчивост. Всяка функция на загуба е очаквана стойност. Всяко &bdquo;оценка на градиента&ldquo; е очаквана стойност. Компромисът отклонение–дисперсия, batch normalization, Adam — всичко стъпва на тези три момента.',
    f:'𝔼[<i>X</i>] = Σ <i>x</i> <i>p</i>(<i>x</i>) или ∫ <i>x p</i>(<i>x</i>)<i>dx</i>&nbsp;&nbsp; <span class="op">·</span>&nbsp;&nbsp; Var(<i>X</i>) = 𝔼[(<i>X</i>−<i>μ</i>)<sup>2</sup>] = 𝔼[<i>X</i><sup>2</sup>] − <i>μ</i><sup>2</sup>&nbsp;&nbsp; <span class="op">·</span>&nbsp;&nbsp; Cov(<i>X</i>,<i>Y</i>) = 𝔼[(<i>X</i>−<i>μ</i><sub><i>X</i></sub>)(<i>Y</i>−<i>μ</i><sub><i>Y</i></sub>)]',
    sym:[['𝔼[<i>X</i>]','очаквана стойност на X','Дългосрочното средно. Понякога се пише E[X] или ⟨X⟩.'],
         ['<i>μ</i>','мю — средно','Друг запис за 𝔼[X].'],
         ['Var, <i>σ</i><sup>2</sup>','дисперсия','Средният квадрат на отклонението от средното.'],
         ['<i>σ</i>','сигма — стандартно отклонение','Коренът от дисперсията. В същите единици като данните.'],
         ['Cov','ковариация','Положителна: растат заедно. Отрицателна: единият расте, другият пада.'],
         ['𝔼<sub><i>x</i>~<i>p</i></sub>[·]','очакване спрямо разпределение p','Индексът казва по кое разпределение осредняваш.']],
    ex:'Зар: <span class="m">𝔼[X] = (1+2+…+6)/6 = 3.5</span>, <span class="m">Var = 2.92</span>, <span class="m">σ = 1.71</span>. Линейност (работи винаги, дори при зависими величини): <span class="m">𝔼[aX + bY] = a𝔼[X] + b𝔼[Y]</span>. Но <span class="m">Var(X+Y) = Var(X) + Var(Y)</span> само ако са независими — точно затова осредняването на k независими модела намалява дисперсията k пъти и ансамблите работят.',
    e:['train|loss|p','eval|bv|p','nn|norm|p','train|adam|p','cls|tree|p','data|scale|p','seq|pg|p'], req:['rv','pdf'] },

  { id:'dists', g:'pr', w:9, en:'Common distributions', bg:'Основните разпределения',
    note:'Десетина разпределения покриват почти всичко в ML. Изборът им не е козметичен: избереш ли Бернули за изхода, автоматично получаваш бинарна кръстосана ентропия; избереш ли нормално — получаваш MSE. Загубата следва от разпределението, а не обратното.',
    f:'Bern(<i>p</i>)&nbsp;<span class="op">·</span>&nbsp;Cat(<i>π</i>)&nbsp;<span class="op">·</span>&nbsp;<i>N</i>(<i>μ</i>,<i>σ</i><sup>2</sup>)&nbsp;<span class="op">·</span>&nbsp;Poisson(<i>λ</i>)&nbsp;<span class="op">·</span>&nbsp;Beta(<i>α</i>,<i>β</i>)&nbsp;<span class="op">·</span>&nbsp;Dir(<i>α</i>)&nbsp;<span class="op">·</span>&nbsp;Exp(<i>λ</i>)&nbsp;<span class="op">·</span>&nbsp;Uniform(<i>a</i>,<i>b</i>)',
    sym:[['Bern(<i>p</i>)','Бернули','Едно хвърляне на монета. Изход 0 или 1. → бинарна кръстосана ентропия.'],
         ['Cat(<i>π</i>)','категорийно','Един зар с K страни. → многокласова кръстосана ентропия, softmax.'],
         ['<i>N</i>(<i>μ</i>,<i>σ</i><sup>2</sup>)','нормално (Гаусово)','Камбана. → MSE загуба, шум, инициализация.'],
         ['Poisson(<i>λ</i>)','Поасон','Брой събития за единица време. Кликове, посещения, дефекти.'],
         ['Beta(<i>α</i>,<i>β</i>)','бета','Разпределение върху вероятност — приор за вероятност.'],
         ['Dir(<i>α</i>)','Дирихле','Разпределение върху вероятностни вектори. Приор при LDA, при смеси.'],
         ['Exp(<i>λ</i>)','експоненциално','Време до следващото събитие. Анализ на оцеляване, отпадане на клиенти.']],
    ex:'Правилото, което свързва всичко: <b>изберете разпределение на изхода → логаритъмът на правдоподобието му е вашата загуба</b>. Бернули → <span class="m">−[y log p + (1−y)log(1−p)]</span>, тоест бинарна кръстосана ентропия. Нормално с фиксирана дисперсия → <span class="m">½(y − ŷ)²</span>, тоест MSE. Поасон → Poisson загуба за броене. Никога не избираш загуба произволно — избираш модел на изхода.',
    e:['train|loss|p','cls|nb|p','cls|gmm|p','prob|mle|p','train|init|p','prob|bayesinf|s'], req:['pdf','expect'] },

  { id:'gauss', g:'pr', w:8, en:'Multivariate Gaussian', bg:'Многомерно нормално разпределение',
    note:'Най-важното разпределение в ML и единственото, за което почти всичко се смята в затворен вид. Ковариационната матрица описва формата на облака от точки. Появява се като приор, като шум, като латентно пространство, като инициализация.',
    f:'<i>N</i>(<i>x</i>; <i>μ</i>, <i>Σ</i>) = ' + fr('1','(2<i>π</i>)<sup><i>d</i>/2</sup>|<i>Σ</i>|<sup>1/2</sup>') + ' exp( −' + fr('1','2') + '(<i>x</i>−<i>μ</i>)<sup>T</sup><i>Σ</i><sup>−1</sup>(<i>x</i>−<i>μ</i>) )',
    sym:[['<i>μ</i>','мю — вектор на средните','Центърът на облака, по едно число за всяко измерение.'],
         ['<i>Σ</i>','сигма — ковариационна матрица','Формата и наклонът на облака. Симетрична, положително полуопределена.'],
         ['|<i>Σ</i>|','детерминанта на Σ','Обемът на облака — влиза в нормировката.'],
         ['(<i>x</i>−<i>μ</i>)<sup>T</sup><i>Σ</i><sup>−1</sup>(<i>x</i>−<i>μ</i>)','разстояние на Махаланобис на квадрат','Разстояние, мащабирано според разпръснатостта по всяка посока.'],
         ['<i>d</i>','брой измерения','Размерността на вектора x.']],
    ex:'Диагонална Σ = независими оси, облакът е ос-подравнен елипсоид. Пълна Σ = наклонен елипсоид. VAE използва точно диагонална нормална за латентното: енкодерът връща μ и log σ², а сампълването е <span class="m">z = μ + σ ⊙ ε</span> с <span class="m">ε ~ N(0,I)</span>. Забележи log σ², а не σ — за да е винаги положително и числено стабилно.',
    e:['prob|vae|p','cls|gmm|p','cls|gp|p','prob|hmm|p','train|init|p','prob|diff|s'], req:['dists','psd','expect'] },

  { id:'joint', g:'pr', w:8, en:'Joint, marginal, conditional', bg:'Съвместни, маргинални и условни разпределения',
    note:'Как се съчетават много случайни величини едновременно. Правилото за верижно разлагане е буквално това, което прави един езиков модел: разлага вероятността на цял текст на произведение от вероятности на следващата дума.',
    f:'<i>p</i>(<i>x</i>,<i>y</i>) = <i>p</i>(<i>y</i>|<i>x</i>)<i>p</i>(<i>x</i>)&nbsp;&nbsp; <span class="op">·</span>&nbsp;&nbsp; <i>p</i>(<i>x</i>) = Σ<sub><i>y</i></sub> <i>p</i>(<i>x</i>,<i>y</i>)&nbsp;&nbsp; <span class="op">·</span>&nbsp;&nbsp; <i>p</i>(<i>x</i><sub>1..n</sub>) = ∏<sub><i>i</i></sub> <i>p</i>(<i>x</i><sub>i</sub> | <i>x</i><sub>&lt;i</sub>)',
    sym:[['<i>p</i>(<i>x</i>,<i>y</i>)','съвместно разпределение','Вероятността двете стойности да се случат заедно.'],
         ['∏','произведение (голямо пи)','Умножаване на всички членове, както Σ е за събиране.'],
         ['<i>x</i><sub>&lt;i</sub>','всичко преди позиция i','Контекстът — всички предишни токени.'],
         ['маргинализация','сумиране/интегриране на променлива','Изхвърляш променлива, като сумираш по всички нейни стойности.']],
    ex:'Езиков модел: <span class="m">p(&bdquo;котката спи&ldquo;) = p(котката) · p(спи | котката)</span>. За текст от 1000 токена това е произведение от 1000 условни вероятности — и точно затова се работи в логаритми, иначе числото пада под представимото. Perplexity е просто <span class="m">exp(−средния log)</span> на тези вероятности.',
    e:['seq|transformer|p','seq|decode|p','prob|bayesinf|p','prob|hmm|p','cls|nb|s','prob|em|s'], req:['condprob','rv'] },

  { id:'clt', g:'pr', w:6, en:'Law of large numbers & CLT', bg:'Закон за големите числа и централна гранична теорема',
    note:'Защо средните са надеждни и защо нормалното разпределение е навсякъде. ЗГЧ казва, че извадковото средно клони към истинското. ЦГТ казва, че сумата от много независими неща е приблизително нормална — независимо от какво са били поотделно.',
    f:'<i>X̄</i><sub><i>n</i></sub> → <i>μ</i>&nbsp;&nbsp; <span class="op">·</span>&nbsp;&nbsp; √<i>n</i>(<i>X̄</i><sub><i>n</i></sub> − <i>μ</i>) → <i>N</i>(0, <i>σ</i><sup>2</sup>)&nbsp;&nbsp; <span class="op">·</span>&nbsp;&nbsp; SE = ' + fr('<i>σ</i>','√<i>n</i>'),
    sym:[['<i>X̄</i><sub><i>n</i></sub>','x с черта — извадково средно','Средното от n наблюдения.'],
         ['SE','стандартна грешка','Колко се люлее самото средно. Пада като корен от n.'],
         ['√<i>n</i>','корен от n','Ключовият мащаб: 4× повече данни = 2× по-малка грешка.'],
         ['→','сходи по разпределение','Клони към, при нарастване на n.']],
    ex:'Оценяваш accuracy върху 100 теста и получаваш 90%. Стандартната грешка е <span class="m">√(0.9·0.1/100) = 3%</span> — истинската стойност е някъде в 84–96%. За да я стесниш до ±1%, ти трябват около 900 теста. Затова разлика от 0.5% на малък тестов набор не е новина. Същият корен от n обяснява и защо мини-батч градиентът от 512 примера е само 4× по-точен от този от 32.',
    e:['eval|ab|p','eval|cv|p','train|sgd|p','eval|metrics|p','prob|mcmc|s'], req:['expect','dists'] },

  { id:'markov', g:'pr', w:6, en:'Markov chains', bg:'Марковски вериги',
    note:'Процес, при който бъдещето зависи само от настоящето, не от цялата история. Едно допускане, което прави иначе неизчислими задачи решими. Стои зад HMM, зад MDP в обучението с подкрепление и зад MCMC сампълването.',
    f:'<i>P</i>(<i>s</i><sub><i>t</i>+1</sub> | <i>s</i><sub><i>t</i></sub>, <i>s</i><sub><i>t</i>−1</sub>, …) = <i>P</i>(<i>s</i><sub><i>t</i>+1</sub> | <i>s</i><sub><i>t</i></sub>)&nbsp;&nbsp; <span class="op">·</span>&nbsp;&nbsp; <i>π</i><sub><i>t</i>+1</sub> = <i>π</i><sub><i>t</i></sub><i>T</i>',
    sym:[['<i>s</i><sub><i>t</i></sub>','състояние в момент t','Цялата информация, нужна за бъдещето.'],
         ['<i>T</i>','преходна матрица','T_ij = вероятността от състояние i да минеш в j.'],
         ['<i>π</i>','пи — разпределение на състоянията','Вероятността да си в всяко състояние в даден момент.'],
         ['стационарно разпределение','stationary distribution','π, за което πT = π — дългосрочното равновесие.']],
    ex:'Прогноза за времето с матрица <span class="m">T = [[0.9, 0.1],[0.5, 0.5]]</span> (слънчево/дъждовно). Стационарното разпределение е решението на πT = π, тук <span class="m">π = (0.833, 0.167)</span> — дългосрочно 83% слънчеви дни, независимо от началото. MCMC работи точно наобратно: конструираш верига, чието стационарно разпределение е това, от което искаш да теглиш.',
    e:['prob|hmm|p','seq|mdp|p','prob|mcmc|p','seq|ssm|s'], req:['condprob','matmul','indep'] },

  { id:'mc', g:'pr', w:7, en:'Monte Carlo & sampling', bg:'Монте Карло и сампълване',
    note:'Когато интеграл не може да се сметне — теглиш извадки и осредняваш. Толкова просто и толкова мощно. Всеки път, когато оценяваш очакване с мини-батч, правиш Монте Карло. Скоростта е 1/√n, независимо от броя измерения — точно затова е незаменим в големи размерности.',
    f:'𝔼<sub><i>p</i></sub>[<i>f</i>(<i>X</i>)] = ∫ <i>f</i>(<i>x</i>)<i>p</i>(<i>x</i>)<i>dx</i> ≈ ' + fr('1','<i>n</i>') + ' Σ<sub><i>i</i>=1</sub><sup><i>n</i></sup> <i>f</i>(<i>x</i><sub>i</sub>),&nbsp;&nbsp; <i>x</i><sub>i</sub> ~ <i>p</i>',
    sym:[['<i>x</i><sub>i</sub> ~ <i>p</i>','извадки от p','n независими тегления от разпределението.'],
         ['≈','приближение с грешка O(1/√n)','Грешката не зависи от размерността — това е чудото тук.'],
         ['importance sampling','сампълване с тежести','Теглиш от друго разпределение q и коригираш с тегло p/q.'],
         ['MCMC','верига на Марков + Монте Карло','Сампълване, когато не можеш да теглиш директно от p.']],
    ex:'Оценка на π: хвърляш 10 000 случайни точки в квадрат и броиш колко падат в вписания кръг — <span class="m">4·дял ≈ 3.14</span>. Същото при policy gradient в RL: <span class="m">∇J = 𝔼[∇log π(a|s)·R]</span> се оценява от изиграни епизоди. И всеки мини-батч loss е Монте Карло оценка на загубата върху цялото разпределение на данните.',
    e:['prob|mcmc|p','seq|pg|p','prob|vae|p','prob|bnn|p','train|sgd|s','eval|cv|s'], req:['expect','integral','rv'] },

  { id:'reparam', g:'pr', w:6, en:'Reparameterization trick', bg:'Трик с репараметризацията',
    note:'Как да смяташ градиент през случайно сампълване. Не можеш да диференцираш през &bdquo;хвърли зар&ldquo;, но можеш да изнесеш случайността настрани: теглиш фиксиран шум и го преобразуваш детерминистично. Точно това прави VAE обучаем.',
    f:'<i>z</i> ~ <i>N</i>(<i>μ</i>, <i>σ</i><sup>2</sup>)&nbsp;&nbsp; ⇔&nbsp;&nbsp; <i>z</i> = <i>μ</i> + <i>σ</i> ⊙ <i>ε</i>,&nbsp;&nbsp; <i>ε</i> ~ <i>N</i>(0, <i>I</i>)',
    sym:[['<i>ε</i>','епсилон — базов шум','Случайността, изнесена извън изчислителния граф. Не зависи от параметрите.'],
         ['⊙','елемент по елемент','Всяко измерение се мащабира със своята сигма.'],
         ['∇<sub><i>μ</i></sub><i>z</i> = 1','градиент минава свободно','Понеже z зависи от μ детерминистично, backprop работи.'],
         ['Gumbel-softmax','дискретен аналог','Същият трик за категорийни променливи.']],
    ex:'Без трика: <span class="m">z ~ N(μ,σ²)</span> е черна кутия, градиент към μ няма. С трика: <span class="m">z = μ + σ·ε</span>, значи <span class="m">∂z/∂μ = 1</span> и <span class="m">∂z/∂σ = ε</span> — градиентът минава. Един ред разлика, но без него VAE не съществува. Алтернативата (REINFORCE) е приложима, но с многократно по-голяма дисперсия.',
    e:['prob|vae|p','prob|flow|s','seq|pg|s','prob|bnn|s'], req:['gauss','grad','mc'] },

  { id:'conc', g:'pr', w:4, en:'Concentration inequalities', bg:'Концентрационни неравенства',
    note:'Гаранции колко далеч може да се отклони извадковото средно от истинското. Основата на теорията за обобщаване: защо това, че моделът работи на 10 000 теста, значи нещо и за неизвестните данни.',
    f:'<i>P</i>(|<i>X̄</i> − <i>μ</i>| ≥ <i>t</i>) ≤ 2exp(−2<i>nt</i><sup>2</sup>)&nbsp;&nbsp; <span class="op">·</span>&nbsp;&nbsp; <i>P</i>(|<i>X</i>−<i>μ</i>| ≥ <i>kσ</i>) ≤ 1/<i>k</i><sup>2</sup>',
    sym:[['Hoeffding','Хьофдинг','За ограничени величини — експоненциално малка вероятност за голямо отклонение.'],
         ['Chebyshev','Чебишев','По-слаба, но работи за всяко разпределение с крайна дисперсия.'],
         ['≤','ограничено отгоре от','Неравенствата дават горна граница, не точна стойност.'],
         ['<i>t</i>','допустимо отклонение','Колко грешка си готов да толерираш.']],
    ex:'При 10 000 тестови примера Хьофдинг дава: истинската accuracy е в рамките на ±1.4% от измерената, с 95% увереност. При 100 примера границата става ±13.6% — практически безполезна. Точно това е математиката, която оправдава размера на тестовите набори.',
    e:['eval|genbound|p','eval|ab|s','eval|cv|s'], req:['expect','clt'] },

  { id:'stoch', g:'pr', w:4, en:'Stochastic processes', bg:'Стохастични процеси',
    note:'Случайност, разгърната във времето. Броуновото движение е непрекъснатият предел на случайно лутане и е точно шумът в дифузионните модели. Гаусовият процес е разпределение върху цели функции.',
    f:'{<i>X</i><sub><i>t</i></sub>}<sub><i>t</i>≥0</sub>&nbsp;&nbsp; <span class="op">·</span>&nbsp;&nbsp; <i>W</i><sub><i>t</i></sub> − <i>W</i><sub><i>s</i></sub> ~ <i>N</i>(0, <i>t</i>−<i>s</i>)&nbsp;&nbsp; <span class="op">·</span>&nbsp;&nbsp; <i>f</i> ~ 𝒢𝒫(<i>m</i>, <i>K</i>)',
    sym:[['<i>X</i><sub><i>t</i></sub>','процес, индексиран по време','Цяло семейство случайни величини, по една за всеки момент.'],
         ['<i>W</i><sub><i>t</i></sub>','Винеров процес / Броуново движение','Непрекъсната случайна траектория. Дисперсията расте линейно с времето.'],
         ['𝒢𝒫','Гаусов процес','Всяко крайно подмножество точки има съвместно нормално разпределение.'],
         ['<i>K</i>','ковариационна функция (кернел)','Определя гладкостта на случайните функции.']],
    ex:'В дифузионен модел правият процес е <span class="m">x<sub>t</sub> = √(ᾱ<sub>t</sub>)·x<sub>0</sub> + √(1−ᾱ<sub>t</sub>)·ε</span> — точно дискретизирано Броуново движение. Мрежата се учи да предсказва ε, тоест да обръща процеса. Гаусов процес пък дава не само предсказание, но и лента на несигурност, която расте там, където няма данни — свойство, което невронните мрежи нямат по подразбиране.',
    e:['prob|diff|p','cls|gp|p','seq|ssm|s','prob|bnn|s'], req:['gauss','markov','ode'] },

  // ============ СТАТИСТИКА ============
  { id:'desc', g:'st', w:8, en:'Descriptive statistics', bg:'Описателна статистика',
    note:'Средно, медиана, квантили, стандартно отклонение. Първото нещо, което правиш с нов набор от данни, и последното, което гледаш, когато нещо в обучението не се държи както трябва. Медианата и квантилите са устойчиви на извънредни стойности; средното — не.',
    f:'<i>x̄</i> = ' + fr('1','<i>n</i>') + 'Σ<i>x</i><sub>i</sub>&nbsp;&nbsp; <span class="op">·</span>&nbsp;&nbsp; <i>s</i><sup>2</sup> = ' + fr('1','<i>n</i>−1') + 'Σ(<i>x</i><sub>i</sub>−<i>x̄</i>)<sup>2</sup>&nbsp;&nbsp; <span class="op">·</span>&nbsp;&nbsp; IQR = <i>Q</i><sub>3</sub> − <i>Q</i><sub>1</sub>',
    sym:[['<i>x̄</i>','x с черта — извадково средно','Средното на наблюденията, за разлика от μ на популацията.'],
         ['<i>s</i>','извадково стандартно отклонение','Делението е на n−1, не на n — корекция на Бесел за несместеност.'],
         ['<i>Q</i><sub>1</sub>, <i>Q</i><sub>3</sub>','първи и трети квартил','25-и и 75-и персентил.'],
         ['IQR','интерквартилен размах','Разстоянието между тях. Използва се за откриване на извънредни стойности.'],
         ['медиана','middle value','Стойността в средата. Устойчива на екстремни стойности.']],
    ex:'Заплати: 30, 32, 35, 38, 500 (хил.). Средно = 127, медиана = 35. Средното е безполезно тук. Затова: log-трансформация на дясноасиметрични признаци, клипване по 1-ви и 99-и персентил, и robust scaler (медиана + IQR) вместо стандартен, когато има извънредни стойности.',
    e:['data|scale|p','eval|metrics|p','data|pca|s','eval|cv|s'], req:['expect'] },

  { id:'est', g:'st', w:8, en:'Estimators: bias, variance, consistency', bg:'Оценители: отклонение, дисперсия, състоятелност',
    note:'Формалният език за &bdquo;колко добра е тази оценка&ldquo;. Оценителят е функция от данните. Може да е систематично изместен (bias) или просто нестабилен (variance). Тази двойка се пренася директно в компромиса отклонение–дисперсия при моделите.',
    f:'Bias(<i>θ̂</i>) = 𝔼[<i>θ̂</i>] − <i>θ</i>&nbsp;&nbsp; <span class="op">·</span>&nbsp;&nbsp; MSE(<i>θ̂</i>) = Bias<sup>2</sup> + Var(<i>θ̂</i>)',
    sym:[['<i>θ̂</i>','тета с шапка — оценка','Стойността, изчислена от данните. Шапката винаги значи &bdquo;оценено, не истинско&ldquo;.'],
         ['<i>θ</i>','истинска стойност','Неизвестната величина, която оценяваме.'],
         ['несместен','unbiased','Средно по много извадки дава правилния отговор.'],
         ['състоятелен','consistent','Сходи към истината при n → ∞. По-важно свойство от несместеността.'],
         ['ефективен','efficient','С най-малка дисперсия сред несместените.']],
    ex:'Оценка на дисперсия с делене на n е сместена надолу — систематично подценява. С n−1 е несместена. При n = 1000 разликата е 0.1% и никой не я забелязва; при n = 5 е 25%. Същата логика важи и за оценяване на модел върху малък валидационен набор: оценката е несместена, но с толкова голяма дисперсия, че е практически безполезна.',
    e:['eval|bv|p','eval|cv|p','prob|mle|p','eval|metrics|s'], req:['expect','clt'] },

  { id:'mle_m', g:'st', w:10, en:'Maximum likelihood estimation', bg:'Максимално правдоподобие (MLE)',
    note:'Принципът, който поражда почти всяка функция на загуба в ML. &bdquo;Избери параметрите, при които наблюдаваните данни са най-вероятни&ldquo;. Минимизирането на кръстосана ентропия е MLE. Минимизирането на MSE е MLE при нормален шум. Не са аналогии — това са едни и същи формули.',
    f:'<i>θ̂</i> = arg max<sub><i>θ</i></sub> ∏<sub><i>i</i></sub> <i>p</i>(<i>x</i><sub>i</sub>|<i>θ</i>) = arg max<sub><i>θ</i></sub> Σ<sub><i>i</i></sub> log <i>p</i>(<i>x</i><sub>i</sub>|<i>θ</i>) = arg min<sub><i>θ</i></sub> ( −Σ<sub><i>i</i></sub> log <i>p</i>(<i>x</i><sub>i</sub>|<i>θ</i>) )',
    sym:[['<i>L</i>(<i>θ</i>)','функция на правдоподобието','Вероятността на данните, гледана като функция на параметрите.'],
         ['ℓ(<i>θ</i>)','лог-правдоподобие','Логаритъмът ѝ. Работи се винаги с него — сумата е стабилна, произведението не.'],
         ['NLL','отрицателно лог-правдоподобие','−ℓ(θ). Това е буквално вашата loss функция.'],
         ['arg max / arg min','точката на максимум / минимум','Максимизиране на ℓ е същото като минимизиране на −ℓ.']],
    ex:'Хвърляш монета 10 пъти, падат 7 ези. Правдоподобието е <span class="m">p<sup>7</sup>(1−p)<sup>3</sup></span>; вземаш логаритъм, диференцираш, приравняваш на нула → <span class="m">p̂ = 0.7</span>. Точно същата сметка, приложена към класификация, дава кръстосаната ентропия. Приложена към регресия с нормален шум, дава MSE. Едно правило — всички загуби.',
    e:['prob|mle|p','train|loss|p','cls|logreg|p','cls|linreg|p','cls|gmm|p','seq|transformer|p','cls|nb|p'], req:['pdf','joint','grad'] },

  { id:'mapb', g:'st', w:8, en:'MAP & Bayesian inference', bg:'MAP и бейсово извеждане',
    note:'MLE плюс приор. Резултатът е, че регуляризацията вече не е трик, а следствие: L2 наказанието е точно Гаусов приор върху теглата, L1 е Лапласов. Пълното бейсово извеждане отива по-нататък — не една стойност, а цяло разпределение върху параметрите.',
    f:'<i>θ̂</i><sub>MAP</sub> = arg max<sub><i>θ</i></sub> [ log <i>p</i>(<i>D</i>|<i>θ</i>) + log <i>p</i>(<i>θ</i>) ]&nbsp;&nbsp; <span class="op">·</span>&nbsp;&nbsp; <i>p</i>(<i>y</i>*|<i>x</i>*,<i>D</i>) = ∫ <i>p</i>(<i>y</i>*|<i>x</i>*,<i>θ</i>)<i>p</i>(<i>θ</i>|<i>D</i>)<i>dθ</i>',
    sym:[['MAP','maximum a posteriori','Най-вероятната стойност на параметрите след като си видял данните.'],
         ['<i>p</i>(<i>θ</i>)','приор','Какво вярваш преди данните. Голям приор около нула = силна регуляризация.'],
         ['предиктивно разпределение','posterior predictive','Осредняване по всички възможни модели, тежести по постериора.'],
         ['<i>D</i>','данни','Целият обучаващ набор.']],
    ex:'Гаусов приор <span class="m">p(w) = N(0, τ²)</span> дава log p(w) = <span class="m">−‖w‖²/2τ²</span> — това е точно L2 регуляризация с <span class="m">λ = 1/2τ²</span>. Лапласов приор дава L1. Weight decay не е евристика: тя е твърдение, че вярваш теглата да са малки. Оттам следва и защо λ трябва да намалява, когато данните растат.',
    e:['prob|bayesinf|p','train|wd|p','prob|bnn|p','cls|gp|s','eval|calib|s'], req:['condprob','mle_m','dists'] },

  { id:'hyp', g:'st', w:5, en:'Hypothesis testing & p-values', bg:'Проверка на хипотези и p-стойности',
    note:'Инструментът, с който решаваш дали разликата, която виждаш, е реална или шум. Появява се основно при A/B тестове и при сравняване на модели. Класическият капан е многократното тестване: пробваш 20 неща и едно &bdquo;излиза значимо&ldquo; чисто случайно.',
    f:'<i>p</i> = <i>P</i>(данни поне толкова екстремни | <i>H</i><sub>0</sub>)&nbsp;&nbsp; <span class="op">·</span>&nbsp;&nbsp; отхвърли <i>H</i><sub>0</sub> ако <i>p</i> &lt; <i>α</i>',
    sym:[['<i>H</i><sub>0</sub>','нулева хипотеза','&bdquo;Няма ефект&ldquo; — това, което се опитваш да отхвърлиш.'],
         ['<i>p</i>-стойност','p-value','Вероятността да видиш такъв резултат, ако нулевата хипотеза е вярна. НЕ е вероятността хипотезата да е вярна.'],
         ['<i>α</i>','алфа — ниво на значимост','Обикновено 0.05. Приемливият процент фалшиви открития.'],
         ['мощност','power','Вероятността да откриеш ефект, ако той наистина съществува.']],
    ex:'Тестваш 20 варианта на модела при α = 0.05: очакваш 1 фалшиво &bdquo;значимо&ldquo; подобрение чисто по случайност. Корекция на Бонферони: използвай <span class="m">α/20 = 0.0025</span>. Същият проблем и при търсене на хиперпараметри — най-добрият от 100 опита изглежда по-добър, отколкото е, и точно затова има отделен тестов набор.',
    e:['eval|ab|p','eval|metrics|s','eval|cv|s'], req:['clt','dists'] },

  { id:'ci', g:'st', w:5, en:'Confidence intervals & bootstrap', bg:'Доверителни интервали и bootstrap',
    note:'Вместо едно число — диапазон плюс степен на увереност. Bootstrap е удивително практичен: пресампълваш собствените си данни хиляда пъти и получаваш разпределение на всяка статистика, без никаква формула.',
    f:'CI<sub>95%</sub> = <i>x̄</i> ± 1.96 · ' + fr('<i>s</i>','√<i>n</i>') + '&nbsp;&nbsp; <span class="op">·</span>&nbsp;&nbsp; bootstrap: пресампълвай с връщане <i>B</i> пъти',
    sym:[['CI','доверителен интервал','Диапазон, който при 95% от повторенията на експеримента съдържа истината.'],
         ['1.96','критична стойност','Броят стандартни грешки за 95% при нормално разпределение.'],
         ['±','плюс-минус','Границите на интервала.'],
         ['bootstrap','пресампълване с връщане','Тегли n примера от своите n примера, с повторения. Повтори 1000 пъти.']],
    ex:'Accuracy 87% върху 500 теста: <span class="m">CI = 87% ± 1.96·√(0.87·0.13/500) = 87% ± 2.9%</span>. Модел с 88.5% не е доказано по-добър. Bootstrap работи и за метрики без формула (AUC, F1): пресампълваш тестовия набор 1000 пъти, смяташ метриката всеки път, и взимаш 2.5-ия и 97.5-ия персентил.',
    e:['eval|ab|p','eval|metrics|p','eval|cv|p','cls|tree|s'], req:['clt','est','mc'] },

  { id:'ols', g:'st', w:8, en:'Linear regression / OLS', bg:'Линейна регресия и метод на най-малките квадрати',
    note:'Най-простият пълноценен модел и еталонът, спрямо който се мери всичко останало. Има затворено решение, интерпретируеми коефициенти и точно определени допускания. Всеки плътен слой в невронна мрежа е линейна регресия без активацията.',
    f:'<i>y</i> = <i>X</i><i>β</i> + <i>ε</i>,&nbsp; <i>ε</i> ~ <i>N</i>(0,<i>σ</i><sup>2</sup>)&nbsp;&nbsp; <span class="op">·</span>&nbsp;&nbsp; <i>β̂</i> = (<i>X</i><sup>T</sup><i>X</i>)<sup>−1</sup><i>X</i><sup>T</sup><i>y</i>&nbsp;&nbsp; <span class="op">·</span>&nbsp;&nbsp; <i>R</i><sup>2</sup> = 1 − ' + fr('SS<sub>res</sub>','SS<sub>tot</sub>'),
    sym:[['<i>β</i>','бета — коефициенти','По един за всеки признак. Показва промяната в y при единица промяна в признака.'],
         ['<i>ε</i>','епсилон — остатък / шум','Това, което моделът не улавя.'],
         ['<i>X</i>','матрица на плана (design matrix)','Редове = примери, колони = признаци.'],
         ['<i>R</i><sup>2</sup>','коефициент на детерминация','Каква част от дисперсията моделът обяснява. 1 = перфектно, 0 = колкото средното.'],
         ['SS<sub>res</sub>','сума на квадратите на остатъците','Σ(y − ŷ)².']],
    ex:'Цена на жилище = 50 000 + 1200·кв.м − 3000·възраст. Коефициентите се четат директно: всеки квадратен метър добавя 1200 лв, всяка година възраст маха 3000. Точно тази интерпретируемост губиш при невронна мрежа. MSE загубата тук е MLE при допускане за нормален шум — това не е избор, а следствие.',
    e:['cls|linreg|p','train|loss|p','eval|bv|p','data|scale|s','eval|causaleval|s'], req:['lstsq','mle_m','gauss'] },

  { id:'bvd', g:'st', w:8, en:'Bias-variance decomposition', bg:'Разлагане отклонение–дисперсия',
    note:'Точното математическо обяснение защо и недообучението, и преобучението са лоши, и защо между тях има оптимум. Грешката се разпада на три части: систематично отклонение, чувствителност към конкретните данни, и неотстраним шум.',
    f:'𝔼[(<i>y</i> − <i>f̂</i>(<i>x</i>))<sup>2</sup>] = Bias[<i>f̂</i>]<sup>2</sup> + Var[<i>f̂</i>] + <i>σ</i><sup>2</sup>',
    sym:[['Bias<sup>2</sup>','квадрат на отклонението','Колко систематично греши моделът. Висок при твърде прост модел.'],
         ['Var','дисперсия','Колко се променя моделът при друга извадка. Висока при твърде сложен модел.'],
         ['<i>σ</i><sup>2</sup>','неотстраним шум','Долната граница на грешката. Никой модел не слиза под нея.'],
         ['<i>f̂</i>','модел, обучен от данни','Шапката подчертава, че зависи от конкретния обучаващ набор.']],
    ex:'Полином от 1-ва степен върху крива зависимост: високо отклонение, ниска дисперсия — грешен, но стабилно грешен. Полином от 20-та степен: почти нулево отклонение, огромна дисперсия — при друга извадка получаваш съвсем друга крива. Оптимумът обикновено е около степен 3–4. Ансамблите (bagging) атакуват дисперсията, boosting атакува отклонението.',
    e:['eval|bv|p','train|wd|p','cls|tree|p','eval|cv|p','nn|drop|s','eval|scaling|s'], req:['expect','est'] },

  { id:'cvres', g:'st', w:7, en:'Cross-validation & resampling', bg:'Крос-валидация и пресампълване',
    note:'Как да оцениш модел, без да си излъжеш сам. Разделяш данните на k части, обучаваш на k−1 и тестваш на останалата, k пъти. Ключовото е, че всяко решение, взето въз основа на данни, ги &bdquo;изразходва&ldquo; — оттам идва нуждата от отделен тестов набор.',
    f:'CV<sub><i>k</i></sub> = ' + fr('1','<i>k</i>') + ' Σ<sub><i>j</i>=1</sub><sup><i>k</i></sup> <i>L</i>(модел<sub>−<i>j</i></sub>, гънка<sub><i>j</i></sub>)',
    sym:[['<i>k</i>','брой гънки (folds)','Обикновено 5 или 10. k = n е leave-one-out.'],
         ['модел<sub>−<i>j</i></sub>','модел без j-тата гънка','Обучен на всичко останало.'],
         ['стратифицирана','stratified','Всяка гънка запазва същия дял на класовете. Задължително при небалансирани данни.'],
         ['изтичане (leakage)','data leakage','Информация от теста е попаднала в обучението. Най-честата причина за &bdquo;твърде добри&ldquo; резултати.']],
    ex:'Класически капан: правиш стандартизация върху целия набор, после разделяш — средното и σ вече съдържат информация от теста. Правилно: скалерът се напасва само върху обучителната гънка. При времеви редове k-fold изобщо не е валиден — трябва разделяне по време напред, иначе тренираш върху бъдещето.',
    e:['eval|cv|p','eval|bv|p','train|wd|s','eval|metrics|s','cls|tree|s'], req:['est','clt','mc'] },

  { id:'expfam', g:'st', w:4, en:'Exponential family & sufficient statistics', bg:'Експоненциално семейство и достатъчни статистики',
    note:'Обединяващата рамка, под която попадат нормалното, Бернули, Поасон, гама и още десетина разпределения. Обяснява защо softmax е естественият избор при категорийни данни и защо в обобщените линейни модели има точно тези свързващи функции.',
    f:'<i>p</i>(<i>x</i>|<i>η</i>) = <i>h</i>(<i>x</i>) exp( <i>η</i><sup>T</sup><i>T</i>(<i>x</i>) − <i>A</i>(<i>η</i>) )',
    sym:[['<i>η</i>','ета — естествен параметър','Каноничната параметризация. За Бернули това е логитът.'],
         ['<i>T</i>(<i>x</i>)','достатъчна статистика','Единственото, което данните ти казват за параметъра. Всичко останало е излишно.'],
         ['<i>A</i>(<i>η</i>)','лог-нормировка','Гарантира, че сумата е 1. Производните ѝ дават моментите.'],
         ['<i>h</i>(<i>x</i>)','базова мярка','Множител, независещ от параметрите.']],
    ex:'За Бернули достатъчната статистика е просто броят успехи — не ти трябва цялата редица от 0 и 1, а само сборът. Практическото следствие: обобщените линейни модели (GLM) — логистична регресия за Бернули, Поасонова регресия за броене — не са отделни модели, а един и същ модел с различна свързваща функция.',
    e:['cls|logreg|p','nn|softmax|s','cls|nb|s','prob|em|s'], req:['dists','mle_m','expfun'] },

  { id:'causal', g:'st', w:5, en:'Causal inference & confounding', bg:'Причинно-следствено извеждане и объркващи фактори',
    note:'Разликата между &bdquo;тези двете вървят заедно&ldquo; и &bdquo;това причинява онова&ldquo;. Моделите учат корелации; решенията изискват причинност. Объркващият фактор е третото нещо, което влияе и на двете и създава фалшива връзка.',
    f:'<i>P</i>(<i>Y</i>|do(<i>X</i>=<i>x</i>)) ≠ <i>P</i>(<i>Y</i>|<i>X</i>=<i>x</i>)&nbsp;&nbsp; <span class="op">·</span>&nbsp;&nbsp; ATE = 𝔼[<i>Y</i><sup>1</sup>] − 𝔼[<i>Y</i><sup>0</sup>]',
    sym:[['do(<i>X</i>=<i>x</i>)','оператор do — намеса','Насилствено задаване на стойност, вместо просто наблюдение.'],
         ['ATE','среден каузален ефект','Средната разлика между &bdquo;с лечение&ldquo; и &bdquo;без лечение&ldquo;.'],
         ['<i>Y</i><sup>1</sup>, <i>Y</i><sup>0</sup>','потенциални изходи','Какво би станало при и без намеса. Никога не се наблюдават и двете.'],
         ['confounder','объркващ фактор','Променлива, влияеща и на причината, и на следствието.']],
    ex:'Моделът вижда, че клиентите, получили реклама, купуват повече — и заключава, че рекламата работи. Но рекламата е показвана на хора, които вече търсят продукта. Объркващият фактор е намерението. Единственият чист начин е A/B тест с рандомизация; в наблюдателни данни трябват propensity scores, инструментални променливи или difference-in-differences.',
    e:['eval|causaleval|p','eval|ab|p','eval|metrics|s'], req:['condprob','indep','graph'] },

  { id:'prior', g:'st', w:6, en:'Regularization as prior belief', bg:'Регуляризацията като приорно убеждение',
    note:'Обединява цялата регуляризация под един принцип. L2, L1, dropout, ранно спиране, добавяне на шум — всичко това ограничава ефективната сложност на модела и всяко има вероятностна интерпретация.',
    f:'min <i>L</i>(<i>θ</i>) + <i>λ</i>‖<i>θ</i>‖<sup>2</sup>&nbsp;⇔&nbsp; Гаусов приор&nbsp;&nbsp; <span class="op">·</span>&nbsp;&nbsp; min <i>L</i>(<i>θ</i>) + <i>λ</i>‖<i>θ</i>‖<sub>1</sub>&nbsp;⇔&nbsp; Лапласов приор',
    sym:[['<i>λ</i>','сила на регуляризацията','Обратно пропорционална на дисперсията на приора.'],
         ['L2 / Ridge','Гаусов приор','Свива всички тегла плавно към нула, без да ги занулява.'],
         ['L1 / Lasso','Лапласов приор','Занулява част от теглата точно — прави избор на признаци.'],
         ['ефективни степени на свобода','effective DoF','Колко параметъра моделът реално използва след регуляризацията.']],
    ex:'При 1000 признака и 100 примера обикновената регресия има безброй решения. Ridge избира това с най-малка норма, Lasso — най-разреденото (типично 10–20 ненулеви коефициента). Практическото правило: Lasso, когато вярваш, че малко признаци значат нещо; Ridge, когато вярваш, че всички имат по малко значение.',

  // ============ ИНФОРМАЦИОННА ТЕОРИЯ ============
  { id:'entropy', g:'it', w:8, en:'Entropy', bg:'Ентропия',
    note:'Колко изненада съдържа едно разпределение — или колко бита ти трябват средно, за да го кодираш. Максимална е при равномерно разпределение, нулева при пълна сигурност. Оттук тръгва цялата информационна теория в ML.',
    f:'<i>H</i>(<i>p</i>) = −Σ<sub><i>i</i></sub> <i>p</i><sub>i</sub> log <i>p</i><sub>i</sub> = 𝔼<sub><i>p</i></sub>[−log <i>p</i>(<i>X</i>)]',
    sym:[['<i>H</i>','ентропия','Средното количество информация. В битове при log₂, в натове при ln.'],
         ['−log <i>p</i>','информационно съдържание','Колко изненадващо е събитието. Рядко събитие = много информация.'],
         ['log<sub>2</sub>','логаритъм при основа 2','Резултатът е в битове.'],
         ['<i>H</i><sub>max</sub> = log <i>K</i>','максимална ентропия','Достига се при равномерно разпределение върху K изхода.']],
    ex:'Честна монета: <span class="m">H = −(0.5·log₂0.5 + 0.5·log₂0.5) = 1</span> бит. Нагласена с p = 0.9: <span class="m">H = 0.47</span> бита — по-предвидима. Дърво на решенията избира разделянето, което най-много намалява ентропията (information gain). Ентропията на изходното разпределение на LLM е и мярка колко е &bdquo;несигурен&ldquo; в следващия токен.',
    e:['cls|tree|p','seq|decode|p','eval|calib|s','nn|softmax|s','seq|rlhf|s'], req:['expect','expfun','dists'] },

  { id:'xent', g:'it', w:10, en:'Cross-entropy', bg:'Кръстосана ентропия',
    note:'Стандартната функция на загуба за всяка класификация и за всеки езиков модел. Мери колко бита губиш, като кодираш истинското разпределение с предсказаното. Идентична е с отрицателното лог-правдоподобие — това не е съвпадение, а една и съща формула, изведена по два пътя.',
    f:'<i>H</i>(<i>p</i>,<i>q</i>) = −Σ<sub><i>i</i></sub> <i>p</i><sub>i</sub> log <i>q</i><sub>i</sub>&nbsp;&nbsp; <span class="op">·</span>&nbsp;&nbsp; при one-hot: <i>L</i> = −log <i>q</i><sub>истински клас</sub>',
    sym:[['<i>p</i>','истинско разпределение','При етикети — one-hot вектор с 1 на верния клас.'],
         ['<i>q</i>','предсказано разпределение','Изходът на softmax.'],
         ['<i>H</i>(<i>p</i>,<i>q</i>)','кръстосана ентропия','Винаги ≥ H(p). Равенство само ако q = p.'],
         ['perplexity','експонента от кръстосаната ентропия','exp(H). &bdquo;Ефективен брой равновероятни избора.&ldquo;']],
    ex:'Три класа, истинският е първи, моделът предсказва <span class="m">(0.7, 0.2, 0.1)</span>: загубата е <span class="m">−log(0.7) = 0.357</span>. При <span class="m">(0.99, …)</span> загубата е 0.01; при <span class="m">(0.01, …)</span> е 4.6. Забележи асиметрията: наказанието за уверена грешка е драстично. Perplexity 20 при LLM значи, че моделът е толкова несигурен, колкото при избор между 20 равновероятни думи.',
    e:['train|loss|p','nn|softmax|p','cls|logreg|p','seq|transformer|p','prob|mle|p','eval|calib|p','seq|decode|s'], req:['entropy','mle_m','expfun'] },

  { id:'kl', g:'it', w:9, en:'KL divergence', bg:'Разстояние на Кулбак-Лайблер (KL)',
    note:'Колко се различават две разпределения. Не е истинско разстояние — не е симетрично, и тази асиметрия има реални последствия за поведението на моделите. Появява се във VAE, в RLHF, в дистилацията на модели и в дефиницията на взаимната информация.',
    f:'<i>D</i><sub>KL</sub>(<i>p</i> ‖ <i>q</i>) = Σ<sub><i>i</i></sub> <i>p</i><sub>i</sub> log ' + fr('<i>p</i><sub>i</sub>','<i>q</i><sub>i</sub>') + ' = <i>H</i>(<i>p</i>,<i>q</i>) − <i>H</i>(<i>p</i>) ≥ 0',
    sym:[['<i>D</i><sub>KL</sub>(<i>p</i>‖<i>q</i>)','KL от p към q','Двойната черта подчертава, че редът има значение.'],
         ['≥ 0','неотрицателност','Нула само когато p и q съвпадат. Следва от неравенството на Йенсен.'],
         ['forward KL','<i>D</i>(<i>p</i>‖<i>q</i>)','Покрива всички моди — q се размазва, за да покрие всичко, където p е ненулево.'],
         ['reverse KL','<i>D</i>(<i>q</i>‖<i>p</i>)','Търси мода — q се залепва за един пик и игнорира останалите.']],
    ex:'Асиметрията е практическа, не техническа подробност. VAE използва reverse KL и точно затова генерираните изображения често са размазани, но не и невъзможни. RLHF добавя <span class="m">KL(π<sub>нов</sub> ‖ π<sub>реф</sub>)</span> като наказание, за да не се отдалечи прекалено фино настроеният модел от базовия — без него моделът бързо намира начин да мами reward модела.',
    e:['prob|vae|p','seq|rlhf|p','prob|flow|p','prob|bayesinf|p','prob|gan|s','sys|quant|s','prob|diff|s'], req:['entropy','xent','joint'] },

  { id:'mi', g:'it', w:5, en:'Mutual information', bg:'Взаимна информация',
    note:'Колко научаваш за едното, като видиш другото. За разлика от корелацията, улавя всякакви зависимости, не само линейни. Основа на контрастивното обучение (InfoNCE) и на избора на признаци.',
    f:'<i>I</i>(<i>X</i>;<i>Y</i>) = <i>H</i>(<i>X</i>) − <i>H</i>(<i>X</i>|<i>Y</i>) = <i>D</i><sub>KL</sub>( <i>p</i>(<i>x</i>,<i>y</i>) ‖ <i>p</i>(<i>x</i>)<i>p</i>(<i>y</i>) )',
    sym:[['<i>I</i>(<i>X</i>;<i>Y</i>)','взаимна информация','Симетрична: I(X;Y) = I(Y;X). Нула точно когато са независими.'],
         ['<i>H</i>(<i>X</i>|<i>Y</i>)','условна ентропия','Останалата несигурност за X, след като знаеш Y.'],
         ['InfoNCE','контрастивна долна граница','Практична оценка отдолу на взаимната информация.'],
         ['information bottleneck','информационно тясно гърло','Компресирай X, запазвайки информацията за Y.']],
    ex:'Корелацията между X и <span class="m">Y = X²</span> при симетрично разпределено X е точно 0 — но взаимната информация е голяма, защото зависимостта е пълна. Затова при избор на признаци взаимната информация улавя неща, които корелационната матрица пропуска. SimCLR и CLIP оптимизират точно долна граница на взаимната информация между два изгледа на един обект.',
    e:['data|embed|p','eval|metrics|s','data|pca|s','prob|vae|s'], req:['entropy','kl','indep'] },

  { id:'jensen', g:'it', w:6, en:'Jensen inequality & ELBO', bg:'Неравенство на Йенсен и ELBO',
    note:'Неравенството, което позволява да оптимизираш нещо, което не можеш да сметнеш. Вместо неизчислимия логаритъм на правдоподобието оптимизираш долна граница — и това е точно ELBO, целевата функция на VAE и на цялото вариационно извеждане.',
    f:'<i>f</i>(𝔼[<i>X</i>]) ≥ 𝔼[<i>f</i>(<i>X</i>)] за вдлъбната <i>f</i>&nbsp;&nbsp; <span class="op">·</span>&nbsp;&nbsp; log <i>p</i>(<i>x</i>) ≥ 𝔼<sub><i>q</i></sub>[log <i>p</i>(<i>x</i>|<i>z</i>)] − <i>D</i><sub>KL</sub>(<i>q</i>‖<i>p</i>)',
    sym:[['ELBO','evidence lower bound','Долна граница на log p(x). Максимизираш нея вместо истинската цел.'],
         ['<i>q</i>(<i>z</i>|<i>x</i>)','вариационен постериор','Приближението, което енкодерът произвежда.'],
         ['разлика','gap','Разстоянието между ELBO и истината е точно KL между приближението и истинския постериор.'],
         ['вдлъбната / изпъкнала','concave / convex','Йенсен обръща посоката според вида на функцията.']],
    ex:'ELBO на VAE има два члена с ясен смисъл: реконструкция (декодерът трябва да върне входа) минус KL (латентният код да прилича на N(0,I)). β-VAE просто слага тегло пред втория член. Целият EM алгоритъм също е повдигане на същата долна граница, редувайки E-стъпка и M-стъпка.',
    e:['prob|vae|p','prob|em|p','prob|bayesinf|p','prob|bnn|s'], req:['convex','kl','multint'] },

  // ============ КОМБИНАТОРИКА И ДИСКРЕТНА МАТЕМАТИКА ============
  { id:'count', g:'disc', w:5, en:'Permutations, combinations, binomial coefficient', bg:'Пермутации, комбинации, биномен коефициент',
    note:'Изкуството да броиш, без да изброяваш. Нужно ти е, за да оценяваш размери на пространства за търсене, да смяташ вероятности и да разбираш защо изчерпателното търсене на хиперпараметри е обречено.',
    f:'<i>P</i>(<i>n</i>,<i>k</i>) = ' + fr('<i>n</i>!','(<i>n</i>−<i>k</i>)!') + '&nbsp;&nbsp; <span class="op">·</span>&nbsp;&nbsp; <i>C</i>(<i>n</i>,<i>k</i>) = ' + fr('<i>n</i>!','<i>k</i>!(<i>n</i>−<i>k</i>)!') + ' = (<sup><i>n</i></sup><sub><i>k</i></sub>)',
    sym:[['<i>n</i>!','n факториел','n·(n−1)·…·1. Расте по-бързо от всяка експонента.'],

         ['<i>P</i>(<i>n</i>,<i>k</i>)','пермутации','Броят подредени избори — редът има значение.'],
         ['<i>n</i><sup><i>k</i></sup>','избор с връщане','Всеки път всички n възможности са налични.']],

    e:['sys|bigo_c|p','cls|tree|s','eval|cv|s','seq|decode|s'], req:['setlogic'] },

  { id:'binomthm', g:'disc', w:4, en:'Binomial & multinomial theorem', bg:'Бином на Нютон и мултиномна теорема',
    note:'Как се разгръща степен на сума. Свързва комбинаториката с алгебрата и е директно основата на биномното разпределение — а оттам и на всичко, свързано с броене на успехи.',
    f:'(<i>a</i>+<i>b</i>)<sup><i>n</i></sup> = Σ<sub><i>k</i>=0</sub><sup><i>n</i></sup> (<sup><i>n</i></sup><sub><i>k</i></sub>) <i>a</i><sup><i>k</i></sup><i>b</i><sup><i>n</i>−<i>k</i></sup>&nbsp;&nbsp; <span class="op">·</span>&nbsp;&nbsp; <i>P</i>(<i>X</i>=<i>k</i>) = (<sup><i>n</i></sup><sub><i>k</i></sub>)<i>p</i><sup><i>k</i></sup>(1−<i>p</i>)<sup><i>n</i>−<i>k</i></sup>',
    sym:[['(<i>a</i>+<i>b</i>)<sup><i>n</i></sup>','степен на бином','Разгръща се в n+1 члена.'],
         ['триъгълник на Паскал','Pascal triangle','Всеки коефициент е сумата на двата над него.'],
         ['мултиномен','multinomial','Обобщение за повече от два члена — свързано с категорийното разпределение.']],
    ex:'Модел с accuracy 0.8 върху 10 независими теста: вероятността да сгреши точно 3 пъти е <span class="m">C(10,3)·0.2³·0.8⁷ = 0.201</span>. Оттук се строи и точният биномен доверителен интервал, който при малки извадки е по-надежден от нормалното приближение.',
    e:['eval|metrics|p','eval|ab|s','cls|nb|s'], req:['count','dists'] },

  { id:'graph', g:'disc', w:6, en:'Graph theory & Laplacian', bg:'Теория на графите и лапласиан',
    note:'Възли и връзки. Социални мрежи, молекули, графи на знания, изчислителният граф на самия модел — всичко това са графи. Матрицата на съседство и лапласианът превръщат графа в линейна алгебра, откъдето тръгват GNN и спектралната клъстеризация.',
    f:'<i>G</i> = (<i>V</i>, <i>E</i>)&nbsp;&nbsp; <span class="op">·</span>&nbsp;&nbsp; <i>L</i> = <i>D</i> − <i>A</i>&nbsp;&nbsp; <span class="op">·</span>&nbsp;&nbsp; <i>h</i><sub><i>v</i></sub><sup>(<i>k</i>+1)</sup> = <i>f</i>( <i>h</i><sub><i>v</i></sub><sup>(<i>k</i>)</sup>, Σ<sub><i>u</i>∈<i>N</i>(<i>v</i>)</sub> <i>h</i><sub><i>u</i></sub><sup>(<i>k</i>)</sup> )',
    sym:[['<i>V</i>, <i>E</i>','върхове и ребра','Възлите и връзките между тях.'],
         ['<i>A</i>','матрица на съседство','A_ij = 1, ако има ребро между i и j.'],
         ['<i>D</i>','диагонална матрица на степените','Колко съседа има всеки връх.'],
         ['<i>L</i> = <i>D</i> − <i>A</i>','лапласиан на графа','Собствените му стойности разкриват структурата на клъстерите.'],
         ['<i>N</i>(<i>v</i>)','съседи на v','Множеството върхове, свързани с v.']],
    ex:'GNN слой = &bdquo;всеки възел осреднява съобщенията от съседите си и обновява вектора си&ldquo;. След k слоя всеки възел вижда k стъпки навън. Втората най-малка собствена стойност на лапласиана (алгебричната свързаност) казва колко лесно графът се разцепва на две — това е основата на спектралната клъстеризация.',
    e:['nn|gnn|p','data|vecdb|s','train|autodiff|s','eval|causaleval|s'], req:['matmul','eig','setlogic'] },

  { id:'setlogic', g:'disc', w:4, en:'Set theory & logic', bg:'Теория на множествата и логика',
    note:'Езикът, на който е написана останалата математика. Не го смяташ, но го четеш във всяка дефиниция. Кванторите &bdquo;за всяко&ldquo; и &bdquo;съществува&ldquo; са разликата между твърдение, което важи винаги, и такова, което важи понякога.',
    f:'<i>A</i> ∪ <i>B</i>,&nbsp; <i>A</i> ∩ <i>B</i>,&nbsp; <i>A</i> ∖ <i>B</i>,&nbsp; <i>A</i> ⊆ <i>B</i>&nbsp;&nbsp; <span class="op">·</span>&nbsp;&nbsp; ∀<i>x</i> ∃<i>y</i> : <i>P</i>(<i>x</i>,<i>y</i>)',
    sym:[['∈','принадлежи','&bdquo;x ∈ A&ldquo; — x е елемент на A.'],
         ['⊆','подмножество','Всеки елемент на едното е и в другото.'],
         ['∀','за всяко','Универсален квантор.'],
         ['∃','съществува','Екзистенциален квантор. Редът на кванторите променя смисъла напълно.'],
         ['∖','разлика на множества','A ∖ B — в A, но не в B.'],
         ['|<i>A</i>|','мощност','Броят елементи в множеството.']],
    ex:'&bdquo;За всяко ε &gt; 0 съществува N…&ldquo; — стандартното начало на дефиниция за сходимост. Обръщането на кванторите променя всичко: &bdquo;∀x ∃y&ldquo; (за всеки има подходящ y, може различен) е много по-слабо от &bdquo;∃y ∀x&ldquo; (има един y, който върши работа за всички). Точно тази разлика различава слаба от силна гаранция в теоретичните статии.',
    e:['sys|bigo_c|s','eval|genbound|s','data|tokenize|s'], req:[] },

  { id:'dp', g:'disc', w:5, en:'Recurrences & dynamic programming', bg:'Рекурентни съотношения и динамично оптимиране',

    ex:'Наивното пресмятане на Фибоначи прави <span class="m">O(2<sup>n</sup>)</span> извиквания; с мемоизация става <span class="m">O(n)</span> — при n = 50 това е разликата между 10<sup>15</sup> и 50 операции. Същият принцип: forward алгоритъмът при HMM смята вероятността на наблюдавана последователност за <span class="m">O(T·K²)</span> вместо <span class="m">O(K<sup>T</sup>)</span> при изброяване на всички пътища.',
    e:['prob|hmm|p','seq|qlearn|p','seq|decode|p','sys|bigo_c|s','seq|mdp|p'], req:['series','setlogic'] },

  { id:'bigo', g:'disc', w:7, en:'Big-O & complexity', bg:'Big-O нотация и сложност',
    note:'Как расте разходът с размера на входа. Разликата между O(n) и O(n²) при attention е разликата между контекст 4000 и контекст 1 000 000 токена. Всяка архитектурна иновация от последните години е по същество атака срещу някаква сложност.',

    sym:[['<i>O</i>(·)','голямо О — горна граница','Ред на растеж, без константите.'],
         ['<i>Ω</i>(·)','омега — долна граница','Не може да е по-бързо от това.'],
         ['<i>Θ</i>(·)','тета — точен ред','И отгоре, и отдолу.'],
         ['амортизирана сложност','amortized','Средното на операция при дълга серия операции.']],
    ex:'Self-attention е <span class="m">O(n²d)</span> по дължина на последователността: 1000 токена → 10<sup>6</sup> двойки; 100 000 токена → 10<sup>10</sup> двойки, 10 000× повече. Затова FlashAttention (същата сложност, по-добра работа с паметта), разреден attention (O(n√n)) и Mamba (O(n)) съществуват. Матричното умножение е <span class="m">O(n³)</span> — удвоиш ли модела, смятането става 8×.',
    e:['sys|bigo_c|p','sys|matmul_c|p','nn|attn|p','seq|ssm|p','sys|kv|p','data|vecdb|s'], req:['setlogic','series'] },

  { id:'permsym', g:'disc', w:4, en:'Permutation invariance & symmetry', bg:'Инвариантност спрямо пермутации и симетрии',

         ['еквивариантност','equivariance','Изходът се променя по същия начин като входа.'],
         ['индуктивно отклонение','inductive bias','Вграденото в архитектурата допускане за структурата на задачата.']],
    ex:'Конволюцията е транслационно еквивариантна: преместиш ли обекта, картата на признаците се премества съответно — затова CNN трябват много по-малко данни от MLP върху изображения. Attention сам по себе си е пермутационно инвариантен и точно затова трансформърите изискват позиционно кодиране: без него &bdquo;куче хапе човек&ldquo; и &bdquo;човек хапе куче&ldquo; са едно и също.',

  { id:'metric', g:'geo', w:8, en:'Distance metrics', bg:'Метрики за разстояние',
    note:'Как измерваш &bdquo;колко си приличат две неща&ldquo;. Изборът на метрика определя резултата на k-NN, k-means, векторното търсене и контрастивното обучение. Косинусовото сходство игнорира дължината, евклидовото — не, и това е практическа разлика, не философска.',
    f:'<i>d</i><sub>2</sub> = ‖<i>a</i>−<i>b</i>‖<sub>2</sub>&nbsp;&nbsp; <span class="op">·</span>&nbsp;&nbsp; cos(<i>a</i>,<i>b</i>) = ' + fr('<i>a</i>·<i>b</i>','‖<i>a</i>‖‖<i>b</i>‖') + '&nbsp;&nbsp; <span class="op">·</span>&nbsp;&nbsp; <i>d</i><sub>M</sub> = √((<i>a</i>−<i>b</i>)<sup>T</sup><i>Σ</i><sup>−1</sup>(<i>a</i>−<i>b</i>))',
    sym:[['<i>d</i>(<i>a</i>,<i>b</i>)','разстояние','Трябва да е ≥ 0, симетрично и да спазва триъгълното неравенство.'],
         ['cos','косинусово сходство','Само ъгълът, без дължината. Диапазон [−1, 1].'],
         ['<i>d</i><sub>M</sub>','разстояние на Махаланобис','Отчита корелациите и мащаба на всяка ос.'],
         ['<i>d</i><sub>1</sub>','манхатънско разстояние','Сума от абсолютните разлики. По-устойчиво на извънредни стойности.']],
    ex:'Два embedding-а с еднаква посока, но различна дължина: косинусово сходство 1.0, евклидово разстояние голямо. При текстови embeddings почти винаги искаш косинус, защото дължината кодира по-скоро честота, отколкото смисъл. Ако нормализираш всички вектори до дължина 1, двете метрики стават еквивалентни — и точно затова векторните бази нормализират.',
    e:['data|vecdb|p','cls|knn|p','cls|kmeans|p','data|embed|p','cls|svm|s'], req:['norms','dot','gauss'] },

    note:'Геометричният образ на всеки линеен класификатор. Един неврон дели пространството на две с равнина. Дълбоката мрежа е много такива равнини, огънати една през друга — точно оттам идва способността да описва сложни граници.',
    f:'<i>w</i><sup>T</sup><i>x</i> + <i>b</i> = 0&nbsp;&nbsp; <span class="op">·</span>&nbsp;&nbsp; разстояние = ' + fr('|<i>w</i><sup>T</sup><i>x</i>+<i>b</i>|','‖<i>w</i>‖') + '&nbsp;&nbsp; <span class="op">·</span>&nbsp;&nbsp; отстъп = ' + fr('2','‖<i>w</i>‖'),

    ex:'Логистичната регресия намира <em>някаква</em> разделяща равнина; SVM намира тази с най-голям отстъп — по-устойчива на нови данни. ReLU мрежа със 100 неврона в първия слой строи 100 хиперравнини и разделя пространството на многостени; изходът е парчесто-линеен върху тях. Затова дълбоките ReLU мрежи могат да описват всяка непрекъсната функция.',
    e:['cls|svm|p','cls|logreg|p','nn|dense|p','nn|act|s'], req:['dot','norms','vec'] },

  { id:'simplex', g:'geo', w:6, en:'Simplex & softmax geometry', bg:'Симплекс и геометрия на softmax',
    note:'Пространството на всички вероятностни разпределения над K класа е триъгълник (при K = 3) или неговото обобщение. Softmax изпраща произволни числа точно вътре в него — никога на ръба, което е причина да не можеш да получиш идеална сигурност.',
    f:'Δ<sup><i>K</i>−1</sup> = { <i>p</i> ∈ ℝ<sup><i>K</i></sup> : <i>p</i><sub>i</sub> ≥ 0, Σ<i>p</i><sub>i</sub> = 1 }',
    sym:[['Δ','делта — симплекс','Множеството на всички валидни вероятностни вектори.'],
         ['<i>K</i>−1','размерност','K вероятности, но само K−1 свободни — последната следва от сумата.'],
         ['върхове','vertices','Точките на пълна сигурност — one-hot векторите.'],
         ['температура <i>T</i>','temperature','softmax(z/T). Голямо T бута към центъра, малко T — към върховете.']],
    ex:'При три класа всички възможни изходи на модела лежат в равностранен триъгълник. Център = (1/3,1/3,1/3) е пълна несигурност; върховете са абсолютна увереност, но softmax никога не ги достига (нужни са безкрайни логити). При <code>temperature=0.1</code> изходите се притискат към върховете (уверени и повтарящи се), при <code>temperature=2</code> — към центъра (разнообразни и хаотични).',
    e:['nn|softmax|p','seq|decode|p','eval|calib|p','cls|nb|s'], req:['expfun','probax','convex'] },

  { id:'manifold', g:'geo', w:5, en:'Manifolds & curse of dimensionality', bg:'Многообразия и проклятие на размерността',
    note:'Реалните данни живеят на тънка извита повърхност вътре в огромно пространство. Изображенията 224×224 са в ℝ<sup>150528</sup>, но истинските изображения заемат нищожна част от него. Затова изобщо е възможно да се учи от краен брой примери.',
    f:'обем на топка / обем на куб → 0 при <i>d</i> → ∞&nbsp;&nbsp; <span class="op">·</span>&nbsp;&nbsp; данни ⊂ ℳ<sup><i>k</i></sup> ⊂ ℝ<sup><i>d</i></sup>, <i>k</i> ≪ <i>d</i>',
    sym:[['ℳ','многообразие (manifold)','Извита повърхност с малка вътрешна размерност, вложена в голямо пространство.'],
         ['<i>k</i> ≪ <i>d</i>','вътрешна размерност много по-малка','Данните имат далеч по-малко степени на свобода, отколкото координати.'],
         ['проклятие на размерността','curse of dimensionality','В много измерения всичко е далеч от всичко и разстоянията губят смисъл.'],
