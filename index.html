    ex:'В 100 измерения отношението между най-близкия и най-далечния съсед клони към 1 — k-NN спира да работи, защото &bdquo;близо&ldquo; губи смисъл. Затова първо се прави PCA или се учи embedding. Латентното пространство на VAE (128 измерения) е опит директно да параметризира многообразието на реалните изображения.',
    e:['data|pca|p','data|embed|p','cls|knn|p','prob|vae|p','data|vecdb|s'], req:['metric','basis','norms'] },

  { id:'fp', g:'geo', w:6, en:'Floating point & precision', bg:'Числа с плаваща запетая и точност',
    note:'Компютърът не смята с реални числа, а с приближения. При обучението на големи модели това не е дребна подробност: изборът fp32 / fp16 / bf16 решава дали обучението изобщо сходи и колко памет ти трябва.',
    f:'<i>x</i> = (−1)<sup><i>s</i></sup> · <i>m</i> · 2<sup><i>e</i></sup>&nbsp;&nbsp; <span class="op">·</span>&nbsp;&nbsp; fp32: 8 бита експонента, 23 мантиса&nbsp;&nbsp; <span class="op">·</span>&nbsp;&nbsp; bf16: 8 бита експонента, 7 мантиса',
    sym:[['мантиса','mantissa','Значещите цифри — определя точността.'],
         ['експонента','exponent','Определя обхвата — колко големи и малки числа са представими.'],
         ['<i>ε</i><sub>машинно</sub>','machine epsilon','Най-малкото число, което добавено към 1 дава разлика. fp32: 1.2e−7.'],
         ['NaN / Inf','not a number / безкрайност','Резултат от 0/0 или препълване. Веднъж появил се, се разпространява навсякъде.']],
    ex:'bf16 има същия обхват като fp32, но по-малко точност — затова е предпочитан пред fp16 при обучение: fp16 препълва при стойности над 65 504, което се случва при загубата, и точно затова се използва loss scaling. При fp16 <span class="m">1 + 0.0001 = 1</span> — добавката просто изчезва. Затова оптимизаторът пази копие на теглата в fp32, дори когато смятането е в fp16.',
    e:['sys|mixed|p','sys|quant|p','sys|stab|p','train|clip|s'], req:['cond'] },

  { id:'lse', g:'geo', w:7, en:'Numerical stability & log-sum-exp', bg:'Числена стабилност и log-sum-exp',
    note:'Как да не получиш NaN. Няколко трика, които всяка библиотека прилага мълчаливо и които трябва да разпознаваш, когато пишеш собствена загуба. Log-sum-exp е най-важният от тях и е точно вътре в softmax.',
    f:'log Σ<i>e</i><sup><i>x</i><sub>i</sub></sup> = <i>c</i> + log Σ<i>e</i><sup><i>x</i><sub>i</sub>−<i>c</i></sup>,&nbsp;&nbsp; <i>c</i> = max<sub><i>i</i></sub> <i>x</i><sub>i</sub>',
    sym:[['LSE','log-sum-exp','Изчисляване на логаритъм от сума от експоненти, без препълване.'],
         ['<i>c</i> = max','изваждане на максимума','Най-голямата експонента става e⁰ = 1 — гарантирано без препълване.'],
         ['<i>ε</i>','епсилон (1e−8)','Добавя се вътре в логаритъм или в знаменател, за да няма log(0) или деление на 0.'],
         ['clamp','отрязване на диапазон','Насилствено ограничаване в безопасен интервал.']],
    ex:'<span class="m">exp(1000)</span> е Inf във всеки формат. Но <span class="m">log(e<sup>1000</sup> + e<sup>999</sup>) = 1000 + log(1 + e<sup>−1</sup>) = 1000.31</span> — напълно смятаемо след изваждане на максимума. Затова никога не пишеш <code>log(softmax(x))</code>, а <code>log_softmax(x)</code>, и никога <code>softmax</code> + <code>NLLLoss</code> поотделно, а <code>CrossEntropyLoss</code>, което ги слива в един стабилен израз.',
    e:['sys|stab|p','nn|softmax|p','train|loss|p','sys|mixed|s','seq|decode|s'], req:['expfun','fp'] },

  { id:'fourier', g:'geo', w:5, en:'Fourier transform & convolution', bg:'Преобразувание на Фурие и конволюция',
    note:'Всеки сигнал може да се разложи на честоти. Конволюцията във времето е умножение в честотната област — това е основата на бързите конволюции, на позиционните кодирания и на анализа на това какви честоти всъщност учи една мрежа.',
    f:'<i>F</i>(<i>ω</i>) = ∫ <i>f</i>(<i>t</i>)<i>e</i><sup>−<i>iωt</i></sup><i>dt</i>&nbsp;&nbsp; <span class="op">·</span>&nbsp;&nbsp; (<i>f</i> * <i>g</i>)(<i>t</i>) = ∫ <i>f</i>(<i>τ</i>)<i>g</i>(<i>t</i>−<i>τ</i>)<i>dτ</i>&nbsp;&nbsp; <span class="op">·</span>&nbsp;&nbsp; ℱ(<i>f</i> * <i>g</i>) = ℱ(<i>f</i>) · ℱ(<i>g</i>)',
    sym:[['ℱ','преобразувание на Фурие','Преминаване от времева в честотна област.'],
         ['<i>ω</i>','омега — честота','Колко бързо се променя компонентата.'],
         ['*','конволюция','Плъзгане на едната функция върху другата и интегриране.'],
         ['FFT','бързо преобразувание на Фурие','Алгоритъм за O(n log n) вместо O(n²).']],
    ex:'Позиционното кодиране в трансформъра е буквално набор от синуси и косинуси с различни честоти — това позволява на модела да сравнява относителни позиции чрез линейни операции. Дълга конволюция чрез FFT става <span class="m">O(n log n)</span> вместо <span class="m">O(n²)</span> — точно този трик правят S4 и подобните state-space модели.',
    e:['nn|posenc|p','nn|conv|p','seq|ssm|p','data|tokenize|s'], req:['integral','expfun','dot'] },

  { id:'interp', g:'geo', w:3, en:'Interpolation & splines', bg:'Интерполация и сплайни',
    note:'Как да построиш гладка функция през дадени точки. В ML се появява при преоразмеряване на изображения, при позиционни кодирания за нови дължини на контекста и в адитивните модели (GAM).',
    f:'<i>S</i>(<i>x</i>) = Σ<sub><i>i</i></sub> <i>c</i><sub>i</sub><i>B</i><sub>i</sub>(<i>x</i>)&nbsp;&nbsp; <span class="op">·</span>&nbsp;&nbsp; линейна: <i>y</i> = <i>y</i><sub>0</sub> + (<i>y</i><sub>1</sub>−<i>y</i><sub>0</sub>)' + fr('<i>x</i>−<i>x</i><sub>0</sub>','<i>x</i><sub>1</sub>−<i>x</i><sub>0</sub>'),
    sym:[['<i>B</i><sub>i</sub>','базисни функции','Малки локални &bdquo;гърбици&ldquo;, от които се сглобява гладката крива.'],
         ['сплайн','spline','Парчесто полиномиална функция, гладка в точките на съединяване.'],
         ['екстраполация','extrapolation','Излизане извън обхвата на данните — там всички методи са ненадеждни.'],
         ['bilinear / bicubic','двумерна интерполация','Начините за преоразмеряване на изображение.']],
    ex:'При преоразмеряване на изображение от 224 на 384 пиксела, всеки нов пиксел се интерполира от съседите. Същият механизъм при разширяване на контекста на LLM: RoPE интерполацията &bdquo;разтяга&ldquo; позиционните честоти, за да работят при по-дълъг контекст от този, на който моделът е обучен.',
    e:['data|scale|s','nn|posenc|p','nn|pool|s'], req:['lstsq','deriv'] }

  // ============ ENGLISH CONTENT (parallel to NODES, keyed by id) ============
  // sym rows are [reading, meaning] — the glyph itself comes from the Bulgarian row.
  var EN = {

  vec:{ note:'Everything in ML is a vector. An image, a word, a user, a game state — all of it becomes an ordered list of numbers, a point in a space with many dimensions. A vector space is just the rule that you can add two such points and scale them by a number and still land on a point of the same kind.',
    sym:[['&bdquo;R n&ldquo; / n-dimensional real space','The set of all lists of n real numbers. n = 768 means a vector of 768 numbers.'],
         ['vector x (usually set in bold)','One concrete object, represented as a list of numbers.'],
         ['x sub i','The i-th component of the vector. Maths indexes from 1, code from 0.'],
         ['is an element of','&bdquo;x belongs to&ldquo;. x ∈ ℝ³ means: x is a vector of 3 numbers.'],
         ['alpha — a scalar','An ordinary number (not a vector) that you scale by.']],
    ex:'The vector for the word <code>cat</code> in a GPT-style model is a point in ℝ<sup>768</sup> — 768 numbers. A 28×28 greyscale image, flattened into one row, is a vector in ℝ<sup>784</sup>. A customer with 3 features (age, income, purchases) is simply <span class="m">x = (34, 52000, 7) ∈ ℝ³</span>. Addition: <span class="m">(1,2) + (3,4) = (4,6)</span>. Scaling: <span class="m">2·(1,2) = (2,4)</span>.' },

  basis:{ note:'How many genuinely different directions your data has. If the third feature is the sum of the first two, it carries no new information — the vectors are linearly dependent. The number of truly independent directions is the dimension, and that is exactly what PCA measures.',
    f:'span{<i>v</i><sub>1</sub>,…,<i>v</i><sub>k</sub>} = { <i>c</i><sub>1</sub><i>v</i><sub>1</sub> + … + <i>c</i><sub>k</sub><i>v</i><sub>k</sub> }&nbsp;&nbsp; <span class="op">·</span>&nbsp;&nbsp; independence: Σ <i>c</i><sub>i</sub><i>v</i><sub>i</sub> = 0 ⇒ every <i>c</i><sub>i</sub> = 0',
    sym:[['span','All the points you can reach through combinations of the given vectors.'],
         ['coefficients','The numbers you scale each basis vector by.'],
         ['dimension','The number of vectors in the basis — how many independent directions exist.'],
         ['zero vector','The vector of all zeros.']],
    ex:'The vectors (1,0) and (0,1) span the whole plane ℝ² — that is the standard basis. But (1,2) and (2,4) span only a line, because the second is just 2× the first: they are linearly dependent. In a feature table, &bdquo;price in dollars&ldquo; and &bdquo;price in euros&ldquo; are dependent columns and the model gains nothing from the second.' },

  matmul:{ note:'The central operation of all deep learning. Over 90% of the compute in training and serving a large model is literally matrix multiplication. Every dense layer, every attention head, every convolution reduces to this in the end.',
    sym:[['matrices (capital letters)','Rectangular tables of numbers.'],
         ['A i j','The element in row i, column j.'],
         ['sum over k','Add all terms as k runs from 1 to n.'],
         ['m by n','m rows, n columns. The inner dimensions must match.']],
    ex:'Row times column, each one a dot product. <span class="m">[[1,2],[3,4]] · [[5,6],[7,8]]</span>: top-left is <span class="m">1·5 + 2·7 = 19</span>, top-right <span class="m">1·6 + 2·8 = 22</span>, result <span class="m">[[19,22],[43,50]]</span>. In a transformer with batch 32, length 512 and hidden size 4096, one layer is a (32·512 × 4096) · (4096 × 4096) product — roughly 275 billion operations for a single layer.' },

  transpose:{ note:'Three housekeeping operations you see constantly in formulas. The transpose flips a matrix across its diagonal and appears in every gradient formula. The inverse is division for matrices — it rarely exists and is expensive, so real code almost always avoids it.',
    sym:[['A transpose','Rows become columns. In code: <code>A.T</code>.'],
         ['A inverse','The matrix that undoes what A does. Exists only if A is square with a non-zero determinant.'],
         ['identity matrix','Ones on the diagonal, zeros elsewhere. The matrix analogue of the number 1.'],
         ['A dagger — pseudoinverse','The generalization of the inverse to non-square matrices (Moore-Penrose).']],
    ex:'<span class="m">A = [[1,2],[3,4]]</span> → <span class="m">A<sup>T</sup> = [[1,3],[2,4]]</span>. The inverse: <span class="m">A<sup>−1</sup> = [[−2,1],[1.5,−0.5]]</span>, and indeed <span class="m">A·A<sup>−1</sup> = I</span>. In backprop, if the forward pass is <span class="m">y = Wx</span>, the gradient flowing to the input is <span class="m">W<sup>T</sup>·(∂L/∂y)</span> — the same matrix, transposed. That is why the T is everywhere in backward code.' },

  dot:{ note:'The measure of &bdquo;how much do these two things point the same way&ldquo;. A single neuron computes exactly a dot product between its input and its weights. Attention computes a dot product between a query and a key. Similarity search in a vector database is a dot product. If you understand only one operation, make it this one.',
    sym:[['a dot b','Dot product — the result is a single number, not a vector.'],
         ['angle brackets','The same thing in more abstract notation (inner product).'],
         ['theta','The angle between the two vectors.'],
         ['a transpose b','The matrix notation for the same thing — row times column.']],
    ex:'<span class="m">(1,2,3) · (4,5,6) = 1·4 + 2·5 + 3·6 = 32</span>. If it is 0, the vectors are perpendicular, meaning completely unrelated. Cosine similarity between the embeddings of &bdquo;king&ldquo; and &bdquo;queen&ldquo; is around 0.75, between &bdquo;king&ldquo; and &bdquo;banana&ldquo; around 0.05. In attention: <span class="m">score = q·k / √d</span> — how relevant key k is to query q.' },

  norms:{ note:'A norm is the length of a vector, that is, &bdquo;how big is this thing&ldquo;. It shows up in three places: as a distance between points, as the size of a gradient (for clipping), and as a penalty on large weights in regularization. L1 and L2 penalize differently and therefore produce qualitatively different models.',
    sym:[['norm of x','Double vertical bars — the length or size of the vector.'],
         ['absolute value','The value with the sign stripped off.'],
         ['Euclidean (L2) norm','The ordinary straight-line length. With no subscript, this is usually what is meant.'],
         ['Frobenius norm','The L2 norm of a matrix, as if it were flattened into one long vector.']],
    ex:'For <span class="m">x = (3, −4)</span>: L2 = <span class="m">√(9+16) = 5</span>, L1 = <span class="m">3+4 = 7</span>, L∞ = <span class="m">4</span>. In gradient clipping: if ‖g‖₂ = 12 and the threshold is 1.0, the gradient is scaled by 1/12. L1 regularization pushes weights to exactly zero (making the model sparse), L2 just shrinks them smoothly — which is why Lasso selects features and Ridge does not.' },

  rank:{ note:'Three numbers that summarize a whole matrix. The rank says how many independent directions live inside it — that is the idea behind LoRA. The determinant says how much volume gets stretched and shows up in every distribution with a matrix in it. The trace is the sum along the diagonal and is convenient in expectation formulas.',
    f:'rank(<i>A</i>) = number of independent columns&nbsp;&nbsp; <span class="op">·</span>&nbsp;&nbsp; tr(<i>A</i>) = Σ<sub>i</sub> <i>A</i><sub>ii</sub>&nbsp;&nbsp; <span class="op">·</span>&nbsp;&nbsp; det(<i>A</i>) = volume factor',
    sym:[['rank','The number of linearly independent rows (or columns — they are equal).'],
         ['determinant','How much the transformation shrinks or stretches volume. det = 0 means the matrix collapses space and has no inverse.'],
         ['trace','The sum of the diagonal entries. Also equal to the sum of the eigenvalues.']],
    ex:'<span class="m">det([[1,2],[3,4]]) = 1·4 − 2·3 = −2</span>, tr = <span class="m">1+4 = 5</span>. LoRA lands exactly here: instead of training a full 4096×4096 matrix (16.7M parameters), you train two thin matrices 4096×8 and 8×4096 — 65k parameters in total — assuming the required change has rank only 8.' },

  eig:{ note:'The special directions a matrix only stretches, without rotating them. They give you the natural axes of your data or of a transformation. They sit behind PCA, behind training-stability analysis (exploding gradients), and behind spectral methods on graphs.',
    sym:[['lambda — eigenvalue','How much stretching happens along this direction. λ &gt; 1 = stretch, |λ| &lt; 1 = shrink, λ &lt; 0 = flip.'],
         ['eigenvector','The direction that does not change — only its scale does.'],
         ['spectrum','The whole set of eigenvalues of the matrix.'],
         ['spectral radius','The largest |λ|. If it exceeds 1 under repeated multiplication, things explode.']],
    ex:'<span class="m">A = [[2,0],[0,3]]</span> has eigenvectors (1,0) with λ=2 and (0,1) with λ=3 — it stretches 2× horizontally and 3× vertically. In an RNN the same matrix is applied at every step: over 100 steps with λ = 1.1 the signal is multiplied by <span class="m">1.1<sup>100</sup> ≈ 13,780</span> (exploding gradient), with λ = 0.9 by <span class="m">0.9<sup>100</sup> ≈ 0.000027</span> (vanishing gradient). That is exactly why LSTMs have gates.' },

  svd:{ note:'The most universal matrix decomposition: any matrix at all splits into rotate → scale → rotate. It gives you the best possible low-rank approximation, which is the basis of model compression, LoRA, PCA and the latent factors in recommender systems.',
    sym:[['orthogonal matrices','Pure rotations or reflections — they do not change lengths.'],
         ['Sigma — singular values','Diagonal matrix of scale factors, sorted in decreasing order.'],
         ['sigma sub i','The i-th singular value — how much &bdquo;energy&ldquo; the i-th direction carries.'],
         ['rank-k approximation','Only the first k terms — provably the best approximation at that rank (Eckart-Young).']],
    ex:'A 1000×1000 matrix whose singular values fall off quickly can be approximated with the first 50: <span class="m">1000·50 + 50 + 50·1000 = 100,050</span> numbers instead of 1,000,000 — 10× compression with little loss. This is exactly what LoRA does to transformer weights and exactly the mathematics behind matrix factorization in recommenders (the Netflix Prize).' },

  orth:{ note:'Perpendicularity, generalized to many dimensions. Orthogonal directions do not interfere with each other — that is why PCA yields independent components and why orthogonal initialization keeps the signal alive through deep networks. A projection is the &bdquo;best shadow&ldquo; of a vector onto a subspace and is the heart of least squares.',
    f:'<i>a</i> ⊥ <i>b</i> ⇔ <i>a</i>·<i>b</i> = 0&nbsp;&nbsp; <span class="op">·</span>&nbsp;&nbsp; proj<sub><i>b</i></sub>(<i>a</i>) = <span class="frac"><span class="n"><i>a</i>·<i>b</i></span><span class="d">‖<i>b</i>‖<sup>2</sup></span></span> <i>b</i>&nbsp;&nbsp; <span class="op">·</span>&nbsp;&nbsp; <i>Q</i><sup>T</sup><i>Q</i> = <i>I</i>',
    sym:[['perpendicular to','The dot product is zero — no shared component.'],
         ['projection','The part of one vector that lies along the other.'],
         ['orthogonal matrix','Its columns are mutually perpendicular and of length 1. Preserves lengths and angles.'],
         ['orthonormal','Orthogonal plus normalized — perpendicular and each of length exactly 1.']],
    ex:'Projecting <span class="m">(3,4)</span> onto the x axis gives <span class="m">(3,0)</span> — you lose the vertical part. Least squares does exactly this: it projects the observation vector y onto the subspace spanned by the features, and the residual is perpendicular to every feature. Orthogonal initialization in an RNN keeps λ ≈ 1 and so postpones gradient vanishing.' },

  psd:{ note:'A quadratic form is the matrix way of writing &bdquo;a bowl&ldquo;. If the matrix is positive definite, the surface is a bowl with a single bottom — exactly the case where optimization is easy. Covariance matrices and Hessians are always read through this lens.',
    f:'<i>Q</i>(<i>x</i>) = <i>x</i><sup>T</sup><i>Ax</i>&nbsp;&nbsp; <span class="op">·</span>&nbsp;&nbsp; <i>A</i> ≻ 0 ⇔ <i>x</i><sup>T</sup><i>Ax</i> &gt; 0 for every <i>x</i> ≠ 0 ⇔ all <i>λ</i><sub>i</sub> &gt; 0',
    sym:[['quadratic form','A single number — the many-dimensional generalization of a·x².'],
         ['A is positive definite','All eigenvalues are positive — the surface is a bowl opening upward.'],
         ['positive semi-definite','Flat directions allowed (λ = 0). Every covariance matrix is one.'],
         ['Sigma — covariance matrix','Always symmetric and positive semi-definite.']],
    ex:'<span class="m">A = [[2,0],[0,2]]</span> gives <span class="m">Q(x) = 2x₁² + 2x₂²</span> — a perfectly round bowl, gradient descent reaches the bottom in a few steps. <span class="m">A = [[100,0],[0,1]]</span> gives a strongly elongated valley: the same learning rate either blows up along one axis or crawls along the other. That is a condition number of 100, and it is the reason Adam and normalization exist.' },

  decomp:{ note:'How a computer actually solves linear systems — not by inverting, but by factoring into simpler pieces. You meet them in every Gaussian-process library, in least-squares solvers, and when sampling from a multivariate normal.',
    f:'<i>A</i> = <i>LU</i>&nbsp;&nbsp; <span class="op">·</span>&nbsp;&nbsp; <i>A</i> = <i>QR</i>&nbsp;&nbsp; <span class="op">·</span>&nbsp;&nbsp; <i>A</i> = <i>LL</i><sup>T</sup> (when <i>A</i> ≻ 0)',
    sym:[['lower triangular','Zeros above the diagonal — the system solves directly, top down.'],
         ['upper triangular','Zeros below the diagonal.'],
         ['orthogonal times triangular','The numerically most stable route to least squares.'],
         ['Cholesky','The &bdquo;square root&ldquo; of a positive definite matrix. Twice as fast as LU.']],
    ex:'To sample from a multivariate normal <span class="m">N(μ, Σ)</span>: take the Cholesky factor <span class="m">Σ = LL<sup>T</sup></span>, draw a standard normal vector z, and return <span class="m">x = μ + Lz</span>. That is exactly what <code>numpy.random.multivariate_normal</code> does internally, and exactly the reparameterization trick used by a VAE.' },

  tensor:{ note:'A tensor is just an array with more than two dimensions — what you work with every day in PyTorch. Most real bugs in ML code are shape errors, not maths errors. Broadcasting is the rule by which the library silently stretches the smaller array.',
    f:'shape (<i>B</i>, <i>T</i>, <i>D</i>) — batch × length × dimension&nbsp;&nbsp; <span class="op">·</span>&nbsp;&nbsp; <i>y</i><sub>bij</sub> = Σ<sub>k</sub> <i>x</i><sub>bik</sub><i>W</i><sub>kj</sub>',
    sym:[['shape','The size along each axis. B = batch, T = sequence length, D = hidden size.'],
         ['tensor product','Combining axes into one larger space.'],
         ['Einstein notation','Compact form: <code>bik,kj-&gt;bij</code> means &bdquo;sum over k&ldquo;.'],
         ['repeated index','In Einstein notation a repeated index automatically means summation over it.']],
    ex:'A batch of 32 RGB images at 224×224 is a tensor of shape <span class="m">(32, 3, 224, 224)</span> — 4.8 million numbers. Broadcasting: a tensor of shape <span class="m">(32, 512, 768)</span> plus a vector of shape <span class="m">(768,)</span> works — the vector is logically copied along the first two axes. But <span class="m">(32, 512)</span> plus <span class="m">(512, 32)</span> raises an error. The rule: axes are compared right to left and must be equal, or one of them must be 1.' },

  hadamard:{ note:'The Hadamard product is element by element — what <code>*</code> does in numpy, and exactly the operation in LSTM gates and dropout masks. The Kronecker product is a structured way to build a huge matrix out of small ones and shows up in K-FAC optimization.',
    f:'(<i>A</i> ⊙ <i>B</i>)<sub>ij</sub> = <i>A</i><sub>ij</sub><i>B</i><sub>ij</sub>&nbsp;&nbsp; <span class="op">·</span>&nbsp;&nbsp; <i>A</i> ⊗ <i>B</i> — block matrix of <i>A</i><sub>ij</sub><i>B</i>',
    sym:[['circle-dot — Hadamard','Element-wise multiplication. The shapes must match.'],
         ['Kronecker','Each entry of A is replaced by the whole block A_ij·B.'],
         ['element-wise division','The inverse operation.']],
    ex:'The LSTM forget gate: <span class="m">c<sub>t</sub> = f<sub>t</sub> ⊙ c<sub>t−1</sub> + i<sub>t</sub> ⊙ ĉ<sub>t</sub></span> — the gate f is a vector of numbers between 0 and 1 that multiplies the cell state component by component, deciding separately for each dimension how much to remember. Dropout is the same thing: a mask of zeros and ones applied with ⊙.' },

  cond:{ note:'A measure of how strongly a small input error gets amplified at the output. An ill-conditioned problem means optimization will zig-zag and fp16 will destroy the result. It explains why feature normalization is not cosmetic but necessary.',
    f:'<i>κ</i>(<i>A</i>) = <span class="frac"><span class="n"><i>σ</i><sub>max</sub></span><span class="d"><i>σ</i><sub>min</sub></span></span>&nbsp;&nbsp; <span class="op">·</span>&nbsp;&nbsp; relative error ≲ <i>κ</i> · input error',
    sym:[['kappa — condition number','The ratio of largest to smallest singular value. κ = 1 is perfect.'],
         ['largest and smallest singular value','The strongest and weakest stretching direction.'],
         ['approximately less than or equal','An upper bound, up to a constant.']],
    ex:'Features &bdquo;age&ldquo; (18–80) and &bdquo;income&ldquo; (20,000–200,000) in the same model give κ around 3000: the loss surface is a narrow canyon and SGD zig-zags. After standardization (subtract the mean, divide by the standard deviation) κ drops to 1–10 and the same learning rate works. In fp16 (about 3 significant decimal digits), κ &gt; 1000 means you have lost all your precision.' },

  lstsq:{ note:'&bdquo;Find x so that Ax comes as close as possible to b&ldquo; — the oldest problem in statistics and the precise definition of linear regression. It has a closed-form solution, which is rare in ML: almost everywhere else you need iterative optimization.',
    sym:[['minimize over x','We look for the value of x that makes the expression smallest.'],
         ['x star','The optimal solution.'],
         ['normal equations','The classical closed form. In practice it is computed via QR, not literally like this.'],
         ['pseudoinverse','The compact notation for the same thing.']],
    ex:'Three points (1,2), (2,3), (3,5) and a line <span class="m">y = ax + b</span>: A has columns [1,2,3] and [1,1,1], b = [2,3,5]. The solution gives <span class="m">a = 1.5, b = 0.33</span>. Ridge regression is the same with an added <span class="m">λI</span>: <span class="m">(A<sup>T</sup>A + λI)<sup>−1</sup>A<sup>T</sup>b</span> — that λ makes the matrix invertible even when the features are dependent.' },

  lim:{ note:'The foundation the derivative stands on, though you rarely compute one directly in ML. It matters practically in one place: ReLU is not differentiable at zero, and softmax has limiting behaviour you need to understand in order not to get NaN.',
    f:'lim<sub><i>x</i>→<i>a</i></sub> <i>f</i>(<i>x</i>) = <i>L</i>&nbsp;&nbsp; <span class="op">·</span>&nbsp;&nbsp; continuity: lim<sub><i>x</i>→<i>a</i></sub> <i>f</i>(<i>x</i>) = <i>f</i>(<i>a</i>)',
    sym:[['limit','What value the function approaches as the input closes in.'],
         ['tends to','&bdquo;x approaches a&ldquo;.'],
         ['epsilon, delta','The small numbers of the formal definition: for every ε there is a δ.'],
         ['infinity','Not a number — notation for unbounded growth.']],
    ex:'ReLU(x) = max(0,x) is continuous, but its derivative jumps from 0 to 1 at x = 0. Libraries simply pin a value there (PyTorch returns 0) and in practice nothing breaks, because exactly 0.0 almost never occurs. By contrast <span class="m">log(0) = −∞</span> happens regularly, which is why you see <code>log(p + 1e−8)</code> everywhere.' },

  deriv:{ note:'The rate of change: if you nudge the input a little, how much does the output move. All neural network training is this, repeated billions of times. You need a handful of derivatives by heart — the rest assembles from the rules.',
    sym:[['f prime of x','The derivative — the slope of the tangent line at x.'],
         ['df by dx (Leibniz)','The same thing. This notation is handier for the chain rule.'],
         ['a small increment','An infinitesimal step in the input.'],
         ['second derivative','The derivative of the derivative — curvature.']],
    ex:'The table you should know: <span class="m">(x<sup>n</sup>)′ = nx<sup>n−1</sup></span>, <span class="m">(e<sup>x</sup>)′ = e<sup>x</sup></span>, <span class="m">(ln x)′ = 1/x</span>, <span class="m">(σ(x))′ = σ(x)(1−σ(x))</span>, <span class="m">(tanh x)′ = 1 − tanh²x</span>, <span class="m">ReLU′(x) = 1 if x&gt;0 else 0</span>. Notice how elegant the sigmoid derivative is — it is expressed through the function itself, which is why the backward pass is cheap.' },

  partial:{ note:'A derivative with respect to one parameter, holding all the others fixed. A model has billions of parameters, that is, billions of partial derivatives computed at every step. The symbol ∂ is possibly the single most frequent mathematical sign in all of ML.',
    f:'<span class="frac"><span class="n">∂<i>f</i></span><span class="d">∂<i>x</i><sub>i</sub></span></span> = rate of change along <i>x</i><sub>i</sub>, with the rest held fixed',
    sym:[['curly d — partial derivative','Distinguished from d to signal that the function has more than one variable.'],
         ['partial f by partial x i','How f changes if you move only x_i.'],
         ['partial L by partial w','How the loss changes with respect to one weight. This is the number the optimizer uses.'],
         ['evaluated at a point','The value of the derivative at a specific point.']],
    ex:'For <span class="m">f(x,y) = x²y + 3y</span>: <span class="m">∂f/∂x = 2xy</span> (y behaves as a constant), <span class="m">∂f/∂y = x² + 3</span>. In GPT-3 with 175 billion parameters, every training step computes 175 billion partials ∂L/∂w — one per weight. Hence backprop rather than numerical differentiation: numerically this would cost 175 billion full forward passes.' },

  grad:{ note:'All the partial derivatives collected into a single vector. It points in the direction of steepest increase, which is why training walks in exactly the opposite direction. When someone says &bdquo;the gradient&ldquo;, this vector is what they mean — one entry per model parameter.',
    sym:[['nabla / grad','The operator that gathers every partial derivative into a vector.'],
         ['gradient of f','A vector with the same shape as the input. For a 7B-parameter model the gradient also has 7 billion numbers.'],
         ['minus gradient','The direction of steepest decrease — where training walks.'],
         ['eta — learning rate','How big a step you take in that direction.'],
         ['assignment','The new value of w is the old one minus the step.']],
    ex:'For <span class="m">f(x,y) = x² + y²</span> at the point (3,4): <span class="m">∇f = (2x, 2y) = (6,8)</span> — pointing away from the origin, the steepest ascent. One training step with η = 0.1: <span class="m">(3,4) − 0.1·(6,8) = (2.4, 3.2)</span> — closer to the bottom. The loss fell from 25 to 16.<br><br>For a 7B-parameter model the gradient occupies as much memory as the model itself — which is why training needs 3–4× more VRAM than inference.' },

  chain:{ note:'The rule that makes deep learning possible at all. If the output depends on a layer that depends on a previous layer that depends on the weights, the derivative is simply the product of the derivatives along the chain. Backpropagation is the chain rule applied systematically, back to front.',
    sym:[['composition','f∘g means &bdquo;first g, then f&ldquo;.'],
         ['activation of layer k','The output of the k-th layer.'],
         ['multiplication along the chain','The derivatives multiply, they do not add — that is the key.'],
         ['loss','The number at the end that we minimize.']],
    ex:'<span class="m">z = (3x + 1)²</span>. Set <span class="m">y = 3x+1</span>, then <span class="m">z = y²</span>, <span class="m">dz/dy = 2y</span>, <span class="m">dy/dx = 3</span>, so <span class="m">dz/dx = 6y = 6(3x+1)</span>.<br><br>This is also the whole reason for the vanishing gradient: 50 layers each with a local derivative around 0.9 give <span class="m">0.9<sup>50</sup> ≈ 0.005</span> — the signal reaching the first layer is 200× weaker. Residual connections add a +1 into each link of the chain, and that is exactly how they rescue deep networks.' },

  jac:{ note:'When a function takes a vector and returns a vector, its derivative is a whole matrix — one row per output, one column per input. Every layer in a network has a Jacobian, and backprop is a sequence of vector-times-Jacobian products.',
    f:'<i>J</i><sub>ij</sub> = <span class="frac"><span class="n">∂<i>f</i><sub>i</sub></span><span class="d">∂<i>x</i><sub>j</sub></span></span>&nbsp;&nbsp; <span class="op">·</span>&nbsp;&nbsp; <i>J</i> ∈ ℝ<sup>m×n</sup> for <i>f</i>: ℝ<sup>n</sup> → ℝ<sup>m</sup>',
    sym:[['Jacobian','The matrix of all partials of all outputs with respect to all inputs.'],
         ['function from n to m dimensions','Takes n numbers, returns m numbers.'],
         ['vector-Jacobian product (VJP)','What backprop actually computes — it never builds the full matrix.'],
         ['absolute determinant of the Jacobian','How much volume is stretched — central to normalizing flows.']],
    ex:'A dense layer <span class="m">y = Wx</span> has Jacobian exactly <span class="m">W</span>. A softmax layer with 50,000 outputs would have a 50,000×50,000 Jacobian = 2.5 billion numbers — which is why autodiff never builds it and instead computes only the product <span class="m">v<sup>T</sup>J</span>, at the cost of one ordinary forward pass.' },

  hess:{ note:'The matrix of all second derivatives — it tells you whether you are at a bottom, a top or a saddle, and how curved the surface is. The full Hessian is practically uncomputable for large models, but its diagonal approximation is exactly what Adam estimates.',
    f:'<i>H</i><sub>ij</sub> = <span class="frac"><span class="n">∂<sup>2</sup><i>f</i></span><span class="d">∂<i>x</i><sub>i</sub>∂<i>x</i><sub>j</sub></span></span>&nbsp;&nbsp; <span class="op">·</span>&nbsp;&nbsp; <i>H</i> ≻ 0 ⇒ local minimum',
    sym:[['Hessian','A symmetric n×n matrix of second derivatives.'],
         ['mixed second derivative','First by x, then by y. The order does not matter for smooth functions.'],
         ['nabla squared','Another notation for the Hessian.'],
         ['Newton step','The ideal step, if you could afford to invert H.']],
    ex:'For a 7-billion-parameter model the Hessian has <span class="m">7·10<sup>9</sup> × 7·10<sup>9</sup> ≈ 5·10<sup>19</sup></span> entries — more than all the bytes on all the hard drives in the world. Hence: Adam keeps one number per parameter (a diagonal approximation), L-BFGS keeps the last 10 gradients, and K-FAC approximates the Hessian as a Kronecker product of two small matrices.' },

  taylor:{ note:'You approximate any smooth function locally by a polynomial. This is where the justification for gradient descent comes from: you make a linear approximation around the current point and step downhill along it. Every convergence-rate proof runs through Taylor.',
    sym:[['approximately equal','Valid for small h; the error grows as ‖h‖³.'],
         ['a small displacement','The step you take from the current point.'],
         ['first order','Linear approximation — this is gradient descent.'],
         ['second order','Adds the Hessian — this is Newton method.']],
    ex:'<span class="m">e<sup>x</sup> ≈ 1 + x + x²/2</span> around zero: at x = 0.1 it gives 1.105 against the true 1.10517 — an error below 0.02%. The same logic justifies the learning rate: the linear approximation is only good in a small neighbourhood, so the step must be small. Too large an η means you have left the region where the approximation holds — and the loss spikes.' },

  convex:{ note:'A convex function has a single bottom — find a local minimum and it is the global one. Classical models are convex and therefore train with guarantees; neural networks are not, and all the folklore around learning rates, initialization and schedules comes from exactly that.',
    f:'<i>f</i>(<i>λx</i> + (1−<i>λ</i>)<i>y</i>) ≤ <i>λf</i>(<i>x</i>) + (1−<i>λ</i>)<i>f</i>(<i>y</i>),&nbsp;&nbsp; <i>λ</i> ∈ [0,1]',
    sym:[['less than or equal','The function lies below the chord between any two points.'],
         ['lambda between 0 and 1','The parameter that walks along the segment between x and y.'],
         ['non-negative second derivative','The equivalent condition in one dimension.'],
         ['strictly convex','A unique minimum, with no flat stretches.']],
    ex:'Convex: <span class="m">x²</span>, <span class="m">|x|</span>, <span class="m">e<sup>x</sup></span>, <span class="m">−log x</span>, the cross-entropy in the logits of logistic regression. Not convex: anything with more than one hidden layer. Linear regression, logistic regression and SVM have one guaranteed solution — the starting point does not matter. A neural net trained twice with different seeds reaches two different solutions, often equally accurate.' },

  integral:{ note:'Summation of a continuous quantity. In ML an integral almost always means one of two things: total probability under a curve, or an expected value. You rarely compute one by hand — usually there is a closed form, or you approximate it by sampling.',
    f:'∫<sub><i>a</i></sub><sup><i>b</i></sup> <i>f</i>(<i>x</i>) <i>dx</i> = area under the curve&nbsp;&nbsp; <span class="op">·</span>&nbsp;&nbsp; ∫<sub>−∞</sub><sup>∞</sup> <i>p</i>(<i>x</i>) <i>dx</i> = 1',
    sym:[['integral','An elongated S for &bdquo;sum&ldquo;. The continuous analogue of Σ.'],
         ['dx','An infinitesimal step width. It also names the variable you integrate over.'],
         ['limits of integration','From a to b. Without limits it is an indefinite integral (antiderivative).'],
         ['multiple integral','Over two or more variables.']],
    ex:'<span class="m">∫₀¹ x² dx = [x³/3]₀¹ = 1/3</span>. In ML: the area under the ROC curve (AUC) is literally a definite integral. The normal density integrates to 1 over the whole line — that is the condition for being a valid distribution. And every expectation <span class="m">E[X] = ∫ x·p(x) dx</span> is an integral.' },

  multint:{ note:'&bdquo;Integrate out the variable you do not care about&ldquo; — that is how you get from a joint distribution to the one you want. This exact operation is the hard part of Bayesian inference and the reason the whole machinery of variational methods and MCMC exists.',
    sym:[['integrating over z','Summing over all possible values of the hidden variable.'],
         ['joint distribution','The probability of both happening together.'],
         ['marginal','The distribution of one variable on its own.'],
         ['sum over z','The same thing for discrete variables.']],
    ex:'A VAE wants to compute <span class="m">p(x) = ∫ p(x|z)p(z) dz</span> — the probability of the image, summed over every possible latent code z ∈ ℝ<sup>128</sup>. That integral is intractable (128-dimensional), so the VAE optimizes a lower bound (the ELBO) instead. The entire family of variational methods exists because of this one intractable integral.' },

  chvar:{ note:'If you transform a random variable, its density changes by a factor — the determinant of the Jacobian. This is exactly the mathematics normalizing flows are built on: an invertible transformation where you know how the density changes.',
    f:'<i>p</i><sub><i>y</i></sub>(<i>y</i>) = <i>p</i><sub><i>x</i></sub>(<i>x</i>) · |det <span class="frac"><span class="n">∂<i>x</i></span><span class="d">∂<i>y</i></span></span>|&nbsp;&nbsp; <span class="op">·</span>&nbsp;&nbsp; log <i>p</i>(<i>y</i>) = log <i>p</i>(<i>x</i>) − log|det <i>J</i>|',
    sym:[['absolute Jacobian determinant','How many times the transformation locally shrinks or stretches volume.'],
         ['density of the new variable','The distribution after the transformation.'],
         ['invertible / bijective','The transformation must be uniquely reversible.']],
    ex:'If <span class="m">y = 2x</span>, you stretch the axis twofold, so the density must shrink twofold: <span class="m">p_y(y) = p_x(y/2)/2</span>. Normalizing flows build chains of such transformations with a special structure (a triangular Jacobian) where the determinant is simply the product of the diagonal — turning O(n³) work into O(n).' },

  lagrange:{ note:'How to optimize under constraints — &bdquo;minimize this, subject to that being satisfied&ldquo;. It sits behind the dual formulation of SVM (from which the kernel trick comes) and behind the proof that softmax is the right choice under a maximum-entropy constraint.',
    sym:[['Lagrangian','The combined function — objective plus a penalty for violating the constraint.'],
         ['Lagrange multiplier','The price of the constraint: how much the objective would gain if you relaxed it by one unit.'],
         ['equality constraint','The condition that must hold.'],
         ['KKT','Karush-Kuhn-Tucker — the generalization to inequality constraints (g(x) ≤ 0).']],
    ex:'SVM: minimize <span class="m">½‖w‖²</span> subject to every point being correctly classified with a margin of at least 1. The dual problem obtained through the multipliers depends on the data only through the dot products <span class="m">x<sub>i</sub>·x<sub>j</sub></span> — and that is exactly where you can swap in a kernel <span class="m">K(x<sub>i</sub>,x<sub>j</sub>)</span> without ever building the new space. The whole kernel trick falls out of here.' },

  series:{ note:'When an infinite sum has a finite value. In ML it appears mainly as a theoretical tool — convergence proofs for optimizers, geometric series in discounted RL returns, and function expansions.',
    sym:[['infinite sum','Summing over all n from 0 to infinity.'],
         ['gamma — discount factor','In RL: how much less a reward one step later is worth.'],
         ['converges','The sum has a finite value.'],
         ['convergence rate','How fast the error falls with the number of steps.']],
    ex:'In reinforcement learning the return is <span class="m">G = r₀ + γr₁ + γ²r₂ + …</span>. With γ = 0.99 and a constant reward of 1 the sum is <span class="m">1/(1−0.99) = 100</span> — the &bdquo;effective horizon&ldquo;, about 100 steps ahead. With γ = 0.9 the horizon is only 10 steps. One parameter, and it decides whether the agent thinks short-term or long-term.' },

  ode:{ note:'An equation that specifies not the value but the rate of change. Unexpectedly important in modern generative modelling: diffusion models are a discretization of a stochastic differential equation, and Neural ODEs treat network depth as continuous time.',
    sym:[['rate of change in time','How the state evolves as time passes.'],
         ['Wiener process / white noise','The random component — this is where &bdquo;stochastic&ldquo; comes from.'],
         ['drift — deterministic part','The systematic motion.'],
         ['diffusion — noise strength','How much noise is added at each step.']],
    ex:'A diffusion model: the forward process adds a little Gaussian noise at each of 1000 steps until the image is pure noise. The reverse process is also an SDE, and the network learns to predict the noise at each step. Newer samplers (DDIM, DPM-Solver) are simply better numerical solvers for the same equation — which is how they get from 1000 steps down to 20 at the same quality.' },

  autodiff_m:{ note:'How a computer really computes derivatives — neither symbolically (expression blow-up) nor numerically (loss of precision), but by applying the chain rule over the computation graph. Reverse mode computes the gradient with respect to millions of parameters at the cost of one forward pass.',
    f:'forward: <i>Jv</i>&nbsp;&nbsp; <span class="op">·</span>&nbsp;&nbsp; reverse: <i>v</i><sup>T</sup><i>J</i>&nbsp;&nbsp; <span class="op">·</span>&nbsp;&nbsp; cost(∇<i>L</i>) ≈ 2–3 × cost(<i>L</i>)',
    sym:[['VJP — vector-Jacobian product','Reverse mode — what backprop computes. Cheap with many inputs, one output.'],
         ['JVP — Jacobian-vector product','Forward mode. Cheap with few inputs, many outputs.'],
         ['computation graph','The record of which operations were applied and in what order.'],
         ['<code>.backward()</code>','The call that runs the chain rule through the whole graph.']],
    ex:'Numerically differentiating a 7-billion-parameter model would need 7 billion forward passes for one gradient — at 0.1 s each, about 22 years per step. Reverse mode does it at roughly 2× the cost of one pass, so 0.2 s. That difference is not an optimization; it is the difference between possible and impossible.' },

  expfun:{ note:'A handful of functions that appear literally everywhere in ML. The logarithm turns products into sums (which is why losses are log-likelihoods). The exponential makes everything positive. The sigmoid and softmax turn arbitrary numbers into probabilities.',
    sym:[['Euler number ≈ 2.718','The base at which the derivative of e^x is e^x itself.'],
         ['sigma — sigmoid','Squashes any real number into the interval (0,1).'],
         ['natural logarithm (ln)','In ML, &bdquo;log&ldquo; almost always means natural log, base e.'],
         ['logits','The raw model outputs, before they become probabilities.'],
         ['softmax','A smooth version of &bdquo;take the largest&ldquo;, returning a probability distribution.']],
    ex:'Logits <span class="m">z = (2, 1, 0)</span> → <span class="m">e<sup>z</sup> = (7.39, 2.72, 1)</span>, sum 11.11 → softmax = <span class="m">(0.665, 0.245, 0.090)</span>. Note: a difference of 1 in the logits gives roughly a 2.7× ratio in probability. The logarithm is why the loss is a sum rather than a product: the likelihood of 1000 independent examples is a product of 1000 numbers below 1, which underflows to 0 in floating point; the log turns it into a sum and the problem disappears.' },

  funcspace:{ note:'The abstraction in which functions themselves are points in a space. It lets you ask &bdquo;which is the best function&ldquo; rather than &bdquo;which are the best parameters&ldquo;. It underpins Gaussian processes, kernel methods and the calculus of variations.',
    sym:[['Hilbert space','A space of functions with an inner product — angles and lengths between functions make sense.'],
         ['kernel function','Similarity between two points; equal to an inner product in a hidden feature space.'],
         ['phi — feature map','The mapping into the hidden space, which you never compute explicitly.'],
         ['functional','A function whose input is a function and whose output is a number.']],
    ex:'The RBF kernel <span class="m">K(x,x′) = exp(−‖x−x′‖²/2σ²)</span> corresponds to an infinite-dimensional feature space. You never build that space — you compute only K, which is a single number. An SVM with an RBF kernel effectively finds a separating hyperplane in infinitely many dimensions, at O(n²) cost.' },

  objective:{ note:'All training is one and the same problem: find the parameters that make a single number as small as possible. That number is the loss. The choice of loss determines what the model actually learns to do — more strongly, in fact, than the choice of architecture.',
    sym:[['the argument at which the minimum occurs','Not the smallest value, but the point where it is attained.'],
         ['theta — parameters','All the trainable weights of the model, collected into one vector.'],
         ['small ell — per-example loss','The penalty for one mistake.'],
         ['objective function','The average over the whole dataset — the number you watch in the log.'],
         ['regularizer','A penalty for model complexity, independent of the data.'],
         ['regularization strength','The balance between fitting and simplicity.']],
    ex:'One line summarizes almost all of training: <span class="m">θ* = arg min<sub>θ</sub> [ loss(data) + λ·complexity ]</span>. Regression with MSE learns the conditional mean; the same data with MAE learns the median — a different loss, a different model, at exactly the same architecture and data.' },

  gd:{ note:'The algorithm that runs all of deep learning. Compute the gradient, take a small step in the opposite direction, repeat. The learning rate is the single most important hyperparameter — more important than the architecture, the optimizer and nearly everything else.',
    sym:[['eta — learning rate','The step length. Typically 1e−3 for Adam, 1e−1 for SGD.'],
         ['step index','One update, not one epoch.'],
         ['descent direction','The steepest decrease of the loss.'],
         ['next parameters','The result of one step.']],
    ex:'Minimize <span class="m">L(θ) = θ²</span> from θ = 10 with η = 0.1: the gradient is <span class="m">2θ = 20</span>, so <span class="m">θ ← 10 − 0.1·20 = 8</span>. Then 6.4, 5.12, 4.096 — geometric approach. But at η = 0.6: <span class="m">10 → −2 → 0.4 → −0.08</span> — it oscillates, though it still converges. At η = 1.1: <span class="m">10 → −12 → 14.4</span> — divergence. The threshold here is η &lt; 1/L, where L is the curvature. This is exactly what you see as NaN in the log when the learning rate is too high.' },

  statpts:{ note:'Where gradient descent stops, and why that is not necessarily good. In many dimensions genuine local minima are rare — nearly every zero-gradient point is a saddle, where the surface goes up along some axes and down along others.',
    f:'∇<i>L</i>(<i>θ</i>) = 0&nbsp;&nbsp; <span class="op">·</span>&nbsp;&nbsp; <i>H</i> ≻ 0 → minimum,&nbsp; <i>H</i> ≺ 0 → maximum,&nbsp; mixed signs → saddle',
    sym:[['zero gradient','Necessary but not sufficient for a minimum.'],
         ['saddle point','A minimum along some directions, a maximum along others — like a horse saddle.'],
         ['plateau','A near-zero gradient over a large region — training stops making progress.'],
         ['smallest eigenvalue of H','A negative value means there is still an escape direction downhill.']],
    ex:'In a billion-dimensional space, a zero-gradient point is a local minimum only if all billion eigenvalues are positive. If each is positive with probability 1/2, the chance is <span class="m">2<sup>−10<sup>9</sup></sup></span> — effectively zero. That is why deep learning works: you do not get stuck in bad minima, you pass through saddles, and the noise in SGD helps with exactly that.' },

  sgdconv:{ note:'Why computing the gradient on 32 examples instead of a million works at all. The mini-batch gradient is an unbiased estimate of the true one — right on average, noisy individually. The noise even helps: it escapes saddles and acts as mild regularization.',
    sym:[['expected value','The average over all possible batches.'],
         ['batch size','The number of examples in one update.'],
         ['variance','The spread of the gradient estimate. Falls as 1/B.'],
         ['Robbins-Monro conditions','Steps must shrink, but not too fast — this is where LR schedules come from.']],
    ex:'Batch 32 versus batch 512: 16× less noise, but a 16× more expensive step. Since the standard deviation falls only as <span class="m">√B</span>, a fourfold larger batch halves the noise only. That is where the rule &bdquo;multiply the batch by k, multiply the learning rate by k (or by √k)&ldquo; comes from.' },

  momentum:{ note:'How Adam and SGD with momentum really work. Momentum accumulates a running average of gradients so you do not zig-zag along narrow canyons. Adaptive methods scale the step separately for each parameter according to how noisy its gradient has been.',
    sym:[['beta one ≈ 0.9','How much old momentum is retained. Roughly an average over the last ~10 gradients.'],
         ['beta two ≈ 0.999','A running average of squares — roughly the last ~1000.'],
         ['gradient at step t','The current mini-batch gradient.'],
         ['epsilon ≈ 1e−8','A tiny number so you never divide by zero.'],
         ['hatted — bias corrected','A correction for the fact that the running averages start at zero.']],
    ex:'In an elongated valley, plain SGD zig-zags across it and crawls along it. Momentum sums the successive cross-valley gradients, which cancel, and accumulates the along-valley ones, which agree — the result is acceleration along the right axis. Adam adds division by <span class="m">√ŝ</span>: a parameter with rare but large gradients (say the embedding of a rare word) gets a proportionally larger step.' },

  constr:{ note:'Optimization where the solution has to satisfy conditions. Duality is the deep result that every such problem has a mirror twin which is sometimes far easier — and that is exactly what gives SVM its kernel trick.',
    f:'min <i>f</i>(<i>x</i>) s.t. <i>g</i>(<i>x</i>) ≤ 0&nbsp;&nbsp; ⇔&nbsp;&nbsp; max<sub><i>λ</i>≥0</sub> min<sub><i>x</i></sub> ℒ(<i>x</i>,<i>λ</i>)',
    sym:[['s.t. — subject to','Introduces the constraints.'],
         ['primal / dual','The two equivalent formulations of one and the same problem.'],
         ['strong duality','Both problems have the same optimal value — holds for convex problems.'],
         ['projection','Pulling the solution back into the feasible set after a step.']],
    ex:'In primal form, SVM searches for w in a space with as many dimensions as features. In dual form it searches for one coefficient α per example — and the problem depends only on the dot products. If you have 100 examples with 1,000,000 features each, the dual is incomparably smaller. And that is exactly where the kernel enters.' },

  fixed:{ note:'&bdquo;Apply the same rule until nothing changes&ldquo;. The contraction mapping theorem guarantees that if every step brings things closer together, you will reach a unique answer. That is where the proof that value iteration in RL always converges comes from.',
    f:'<i>x</i><sub><i>k</i>+1</sub> = <i>T</i>(<i>x</i><sub><i>k</i></sub>) → <i>x</i>*&nbsp;&nbsp; if&nbsp; ‖<i>T</i>(<i>a</i>)−<i>T</i>(<i>b</i>)‖ ≤ <i>γ</i>‖<i>a</i>−<i>b</i>‖,&nbsp; <i>γ</i> &lt; 1',
    sym:[['operator','The rule you apply repeatedly.'],
         ['fixed point','The value at which T(x*) = x* — nothing changes any further.'],
         ['contraction factor','Each step shrinks the distance by at least a factor γ.'],
         ['Bellman operator','The concrete T in reinforcement learning.']],
    ex:'The Bellman operator: <span class="m">Q(s,a) ← r + γ·max<sub>a′</sub> Q(s′,a′)</span>. It is a contraction with factor γ, so there is exactly one solution and the iteration always reaches it regardless of the starting values. That is the theoretical guarantee behind Q-learning — a guarantee that disappears the moment you replace the table with a neural network.' },

  probax:{ note:'The rules of the game: what a probability even is. Three axioms, from which everything else follows. They matter not so you can recite them, but so you can check whether a piece of probabilistic reasoning is valid.',
    f:'0 ≤ <i>P</i>(<i>A</i>) ≤ 1&nbsp;&nbsp; <span class="op">·</span>&nbsp;&nbsp; <i>P</i>(Ω) = 1&nbsp;&nbsp; <span class="op">·</span>&nbsp;&nbsp; <i>P</i>(<i>A</i> ∪ <i>B</i>) = <i>P</i>(<i>A</i>) + <i>P</i>(<i>B</i>) for disjoint <i>A</i>, <i>B</i>',
    sym:[['probability of A','A number between 0 and 1.'],
         ['omega — sample space','The set of all possible outcomes.'],
         ['union, intersection','&bdquo;or&ldquo; and &bdquo;and&ldquo;.'],
         ['complement','&bdquo;not A&ldquo;. P(not A) = 1 − P(A).'],
         ['empty set','The impossible event, P(∅) = 0.']],
    ex:'A die: Ω = {1,…,6}, P(even) = 3/6 = 0.5. A sanity check on a model: if your softmax outputs do not sum to 1, there is a bug somewhere. If a model claims P(cat) = 0.7 and P(dog) = 0.6 for mutually exclusive classes, that is impossible and means you used a sigmoid where you needed a softmax.' },

  condprob:{ note:'How to update a belief when you see new data. Bayes theorem is arguably the single most important formula in all of statistics, and it sits behind classification, diagnostics, spam filtering and the entire Bayesian school of ML.',
    sym:[['probability of A given B','The vertical bar reads &bdquo;given that&ldquo;.'],
         ['posterior','The belief about the parameters after you have seen the data.'],
         ['likelihood','How probable the data is, if the parameters were these.'],
         ['prior','The belief before you saw any data.'],
         ['evidence / normalizer','The denominator that makes everything sum to 1. Usually intractable.'],
         ['proportional to','Posterior ∝ likelihood × prior — the denominator is often dropped.']],
    ex:'A test for a disease with 99% accuracy; the disease affects 1 person in 10,000. The test comes back positive — what is the chance you actually have it? <span class="m">P = (0.99·0.0001) / (0.99·0.0001 + 0.01·0.9999) = 0.0098</span> — under 1%. The prior crushes the likelihood. People make exactly this mistake constantly, and it is exactly why models for rare events look great on accuracy and are useless in practice.' },

  indep:{ note:'When knowing one thing tells you nothing about the other. Conditional independence is the subtler and more useful version: A and B may be related, but once you know C the relationship disappears. That assumption is what makes large probabilistic models computable.',
    sym:[['independent of','A double bar. A ⫫ B means &bdquo;A and B are independent&ldquo;.'],
         ['conditionally independent given C','Once you know C, A carries no information about B.'],
         ['i.i.d. — independent and identically distributed','The standard assumption about training examples.']],
    ex:'Naive Bayes assumes words in a text are independent given the class — obviously false (&bdquo;machine&ldquo; and &bdquo;learning&ldquo; travel together), yet the model works well anyway. The Markov assumption in an HMM is the same species: the future is independent of the past given the present state. Without such assumptions the joint distribution of 1000 binary variables has 2^1000 values.' },

  rv:{ note:'The number that depends on the outcome of a random experiment. Everything in ML is modelled as a random variable: the label, the noise, the initialization, the dropout mask, the batch sample. The split between discrete and continuous decides which tools you work with.',
    sym:[['random variable (capital letter)','The quantity itself, before you know its value.'],
         ['realization (lower case)','The specific observed value.'],
         ['is distributed as','&bdquo;X ~ N(0,1)&ldquo; reads &bdquo;X is standard normally distributed&ldquo;.'],
         ['discrete','A finite or countable set of values — a class label, a click count.'],
         ['continuous','Any value in an interval — a weight, a temperature, an embedding component.']],
    ex:'A large language model treats the next token as a discrete random variable over a 50,000-word vocabulary; its output is a distribution over those 50,000. At <code>temperature=0</code> you take the most probable one; at <code>temperature=1</code> you draw from the distribution. The difference between a deterministic and a stochastic model is exactly this.' },

  pdf:{ note:'The three ways to describe a random variable. PMF for discrete (probability of each value), PDF for continuous (density, not probability!), CDF for &bdquo;less than or equal to&ldquo;. The classic mistake is treating a density as a probability — it can exceed 1.',
    f:'PMF: <i>P</i>(<i>X</i>=<i>x</i>)&nbsp;&nbsp; <span class="op">·</span>&nbsp;&nbsp; PDF: <i>p</i>(<i>x</i>), ∫<i>p</i> = 1&nbsp;&nbsp; <span class="op">·</span>&nbsp;&nbsp; CDF: <i>F</i>(<i>x</i>) = <i>P</i>(<i>X</i> ≤ <i>x</i>) = ∫<sub>−∞</sub><sup><i>x</i></sup> <i>p</i>(<i>t</i>)<i>dt</i>',
    sym:[['density','Not a probability! The probability is p(x)·dx over a small interval.'],
         ['cumulative distribution function (CDF)','Accumulated probability up to x. Always rises from 0 to 1.'],
         ['quantile function','The inverse CDF: &bdquo;which value sits at the 95th percentile&ldquo;.'],
         ['conditional density','The density given parameters — this is the likelihood.']],
    ex:'A normal distribution with σ = 0.1 has a peak density around 3.99 — a value above 1, which is perfectly fine for a density. The probability that the value is exactly 0, however, is zero; only P(−0.05 &lt; X &lt; 0.05) ≈ 0.38 is meaningful. In inverse transform sampling you draw u ~ Uniform(0,1) and return <span class="m">F<sup>−1</sup>(u)</span> — that is how you sample from any distribution whose CDF you can invert.' },

  expect:{ note:'The mean, the spread and the joint variability. Every loss function is an expectation. Every &bdquo;gradient estimate&ldquo; is an expectation. The bias-variance trade-off, batch normalization, Adam — all of it stands on these three moments.',
    sym:[['expected value of X','The long-run average. Sometimes written E[X] or ⟨X⟩.'],
         ['mu — mean','Another notation for E[X].'],
         ['variance','The mean squared deviation from the mean.'],
         ['sigma — standard deviation','The square root of the variance. In the same units as the data.'],
         ['covariance','Positive: they rise together. Negative: one rises as the other falls.'],
         ['expectation with respect to p','The subscript names the distribution you average over.']],
    ex:'A die: <span class="m">E[X] = (1+2+…+6)/6 = 3.5</span>, <span class="m">Var = 2.92</span>, <span class="m">σ = 1.71</span>. Linearity (always holds, even for dependent variables): <span class="m">E[aX + bY] = aE[X] + bE[Y]</span>. But <span class="m">Var(X+Y) = Var(X) + Var(Y)</span> only if they are independent — which is exactly why averaging k independent models cuts the variance k-fold and why ensembles work.' },

  dists:{ note:'A dozen distributions cover almost everything in ML. Choosing one is not cosmetic: pick Bernoulli for the output and you automatically get binary cross-entropy; pick normal and you get MSE. The loss follows from the distribution, not the other way round.',
    sym:[['Bernoulli','One coin flip. Output 0 or 1. → binary cross-entropy.'],
         ['categorical','One K-sided die. → multiclass cross-entropy, softmax.'],
         ['normal (Gaussian)','A bell curve. → MSE loss, noise, initialization.'],
         ['Poisson','A count of events per unit time. Clicks, visits, defects.'],
         ['beta','A distribution over a probability — a prior for a probability.'],
         ['Dirichlet','A distribution over probability vectors. A prior in LDA and in mixtures.'],
         ['exponential','Time until the next event. Survival analysis, customer churn.']],
    ex:'The rule that ties it all together: <b>choose an output distribution → the log of its likelihood is your loss</b>. Bernoulli → <span class="m">−[y log p + (1−y)log(1−p)]</span>, that is binary cross-entropy. Normal with fixed variance → <span class="m">½(y − ŷ)²</span>, that is MSE. Poisson → the Poisson count loss. You never pick a loss arbitrarily — you pick a model of the output.' },

  gauss:{ note:'The most important distribution in ML and the only one where almost everything has a closed form. The covariance matrix describes the shape of the cloud of points. It shows up as a prior, as noise, as a latent space, as an initialization.',
    sym:[['mu — mean vector','The centre of the cloud, one number per dimension.'],
         ['Sigma — covariance matrix','The shape and tilt of the cloud. Symmetric, positive semi-definite.'],
         ['determinant of Sigma','The volume of the cloud — it enters the normalizer.'],
         ['squared Mahalanobis distance','A distance rescaled by the spread along each direction.'],
         ['number of dimensions','The dimensionality of the vector x.']],
    ex:'A diagonal Σ means independent axes and an axis-aligned ellipsoid. A full Σ means a tilted one. A VAE uses exactly a diagonal normal for its latent: the encoder returns μ and log σ², and sampling is <span class="m">z = μ + σ ⊙ ε</span> with <span class="m">ε ~ N(0,I)</span>. Note log σ² rather than σ — so it is always positive and numerically stable.' },

  joint:{ note:'How many random variables combine at once. The chain-rule factorization is literally what a language model does: it decomposes the probability of a whole text into a product of next-word probabilities.',
    sym:[['joint distribution','The probability that both values occur together.'],
         ['product (capital pi)','Multiply all terms, as Σ adds them.'],
         ['everything before position i','The context — all previous tokens.'],
         ['marginalization','You drop a variable by summing over all its values.']],
    ex:'A language model: <span class="m">p(&bdquo;the cat sleeps&ldquo;) = p(the) · p(cat | the) · p(sleeps | the cat)</span>. For a 1000-token text this is a product of 1000 conditionals — which is exactly why you work in logs, otherwise the number falls below what is representable. Perplexity is simply <span class="m">exp(−mean log)</span> of those probabilities.' },

  clt:{ note:'Why averages are trustworthy and why the normal distribution is everywhere. The law of large numbers says the sample mean converges to the true one. The central limit theorem says a sum of many independent things is approximately normal — no matter what they were individually.',
    sym:[['x bar — sample mean','The average of n observations.'],
         ['standard error','How much the mean itself wobbles. Falls as the square root of n.'],
         ['square root of n','The key scale: 4× more data = 2× smaller error.'],
         ['converges in distribution','Tends toward, as n grows.']],
    ex:'You evaluate accuracy on 100 test cases and get 90%. The standard error is <span class="m">√(0.9·0.1/100) = 3%</span> — the true value sits somewhere in 84–96%. To narrow it to ±1% you need about 900 cases. So a 0.5% difference on a small test set is not news. The same square root of n explains why a mini-batch gradient from 512 examples is only 4× more accurate than one from 32.' },

  markov:{ note:'A process where the future depends only on the present, not on the whole history. One assumption that turns otherwise intractable problems into solvable ones. It sits behind HMMs, behind MDPs in reinforcement learning, and behind MCMC sampling.',
    sym:[['state at time t','All the information the future needs.'],
         ['transition matrix','T_ij = the probability of moving from state i to j.'],
         ['pi — state distribution','The probability of being in each state at a given moment.'],
         ['stationary distribution','The π for which πT = π — the long-run equilibrium.']],
    ex:'A weather model with <span class="m">T = [[0.9, 0.1],[0.5, 0.5]]</span> (sunny/rainy). The stationary distribution solves πT = π, here <span class="m">π = (0.833, 0.167)</span> — 83% sunny days in the long run, whatever the start. MCMC works exactly backwards: you construct a chain whose stationary distribution is the one you want to sample from.' },

  mc:{ note:'When an integral cannot be computed — draw samples and average. That simple and that powerful. Every time you estimate an expectation with a mini-batch you are doing Monte Carlo. The rate is 1/√n regardless of dimension, which is exactly why it is indispensable in high dimensions.',
    sym:[['samples from p','n independent draws from the distribution.'],
         ['approximation with O(1/√n) error','The error does not depend on dimensionality — that is the miracle here.'],
         ['importance sampling','Draw from another distribution q and correct with the weight p/q.'],
         ['MCMC','Markov chain plus Monte Carlo — sampling when you cannot draw from p directly.']],
    ex:'Estimating π: throw 10,000 random points into a square and count how many land inside the inscribed circle — <span class="m">4·fraction ≈ 3.14</span>. The same in RL policy gradients: <span class="m">∇J = E[∇log π(a|s)·R]</span> is estimated from played-out episodes. And every mini-batch loss is a Monte Carlo estimate of the loss over the whole data distribution.' },

  reparam:{ note:'How to take a gradient through random sampling. You cannot differentiate through &bdquo;roll a die&ldquo;, but you can move the randomness aside: draw fixed noise and transform it deterministically. That is exactly what makes a VAE trainable.',
    sym:[['epsilon — base noise','The randomness, moved outside the computation graph. It does not depend on the parameters.'],
         ['element-wise','Each dimension is scaled by its own sigma.'],
         ['the gradient flows freely','Because z depends on μ deterministically, backprop works.'],
         ['Gumbel-softmax','The same trick for categorical variables.']],
    ex:'Without the trick: <span class="m">z ~ N(μ,σ²)</span> is a black box and there is no gradient to μ. With it: <span class="m">z = μ + σ·ε</span>, so <span class="m">∂z/∂μ = 1</span> and <span class="m">∂z/∂σ = ε</span> — the gradient passes through. One line of difference, but without it the VAE does not exist. The alternative (REINFORCE) is applicable but has many times the variance.' },

  conc:{ note:'Guarantees on how far a sample mean can drift from the true one. The foundation of generalization theory: why a model working on 10,000 test cases tells you something about data you have never seen.',
    sym:[['Hoeffding','For bounded variables — an exponentially small probability of a large deviation.'],
         ['Chebyshev','Weaker, but works for any distribution with finite variance.'],
         ['bounded above by','The inequalities give an upper bound, not an exact value.'],
         ['tolerance','How much error you are willing to accept.']],
    ex:'With 10,000 test examples, Hoeffding gives: the true accuracy is within ±1.4% of the measured one, with 95% confidence. With 100 examples the bound becomes ±13.6% — practically useless. That is precisely the mathematics that justifies test-set sizes.' },

  stoch:{ note:'Randomness unfolding over time. Brownian motion is the continuous limit of a random walk and is exactly the noise in diffusion models. A Gaussian process is a distribution over whole functions.',
    sym:[['a process indexed by time','A whole family of random variables, one per instant.'],
         ['Wiener process / Brownian motion','A continuous random trajectory. Its variance grows linearly in time.'],
         ['Gaussian process','Every finite subset of points has a joint normal distribution.'],
         ['covariance function (kernel)','It determines the smoothness of the random functions.']],
    ex:'In a diffusion model the forward process is <span class="m">x<sub>t</sub> = √(ᾱ<sub>t</sub>)·x<sub>0</sub> + √(1−ᾱ<sub>t</sub>)·ε</span> — precisely discretized Brownian motion. The network learns to predict ε, that is, to reverse the process. A Gaussian process, in turn, gives not just a prediction but an uncertainty band that widens where there is no data — a property neural networks lack by default.' },

  desc:{ note:'Mean, median, quantiles, standard deviation. The first thing you do with a new dataset and the last thing you look at when training misbehaves. The median and the quantiles are robust to outliers; the mean is not.',
    sym:[['x bar — sample mean','The average of the observations, as distinct from the population μ.'],
         ['sample standard deviation','The divisor is n−1, not n — the Bessel correction for unbiasedness.'],
         ['first and third quartile','The 25th and 75th percentile.'],
         ['interquartile range','The distance between them. Used for outlier detection.'],
         ['median','The middle value. Robust to extremes.']],
    ex:'Salaries: 30, 32, 35, 38, 500 (thousands). Mean = 127, median = 35. The mean is useless here. Hence: log-transform right-skewed features, clip at the 1st and 99th percentile, and use a robust scaler (median + IQR) instead of the standard one when outliers are present.' },

  est:{ note:'The formal language for &bdquo;how good is this estimate&ldquo;. An estimator is a function of the data. It can be systematically off (bias) or simply unstable (variance). That pair carries straight over into the bias-variance trade-off for models.',
    sym:[['theta hat — the estimate','The value computed from the data. The hat always means &bdquo;estimated, not true&ldquo;.'],
         ['true value','The unknown quantity being estimated.'],
         ['unbiased','Averaged over many samples, it gives the right answer.'],
         ['consistent','Converges to the truth as n → ∞. A more important property than unbiasedness.'],
         ['efficient','Smallest variance among the unbiased estimators.']],
    ex:'Estimating variance by dividing by n is biased downward — it systematically underestimates. Dividing by n−1 is unbiased. At n = 1000 the difference is 0.1% and nobody notices; at n = 5 it is 25%. The same logic applies to evaluating a model on a small validation set: the estimate is unbiased but has so much variance it is practically useless.' },

  mle_m:{ note:'The principle that generates almost every loss function in ML. &bdquo;Pick the parameters that make the observed data most probable&ldquo;. Minimizing cross-entropy is MLE. Minimizing MSE is MLE under Gaussian noise. These are not analogies — they are the same formulas.',
    sym:[['likelihood function','The probability of the data, viewed as a function of the parameters.'],
         ['log-likelihood','Its logarithm. Always work with this — the sum is stable, the product is not.'],
         ['negative log-likelihood','−ℓ(θ). This is literally your loss function.'],
         ['arg max / arg min','Maximizing ℓ is the same as minimizing −ℓ.']],
    ex:'You flip a coin 10 times and get 7 heads. The likelihood is <span class="m">p<sup>7</sup>(1−p)<sup>3</sup></span>; take the log, differentiate, set to zero → <span class="m">p̂ = 0.7</span>. That very same computation applied to classification gives cross-entropy. Applied to regression with Gaussian noise it gives MSE. One rule, all the losses.' },

  mapb:{ note:'MLE plus a prior. The consequence is that regularization stops being a trick and becomes a consequence: the L2 penalty is exactly a Gaussian prior over the weights, L1 a Laplace one. Full Bayesian inference goes further — not one value, but a whole distribution over the parameters.',
    sym:[['MAP — maximum a posteriori','The most probable parameter value after seeing the data.'],
         ['prior','What you believe before the data. A tight prior around zero = strong regularization.'],
         ['posterior predictive','Averaging over all possible models, weighted by the posterior.'],
         ['data','The whole training set.']],
    ex:'A Gaussian prior <span class="m">p(w) = N(0, τ²)</span> gives log p(w) = <span class="m">−‖w‖²/2τ²</span> — that is exactly L2 regularization with <span class="m">λ = 1/2τ²</span>. A Laplace prior gives L1. Weight decay is not a heuristic: it is a statement that you believe the weights are small. From that also follows why λ should shrink as the data grows.' },

  hyp:{ note:'The tool for deciding whether the difference you are seeing is real or noise. It appears mainly in A/B tests and in comparing models. The classic trap is multiple testing: you try 20 things and one comes out &bdquo;significant&ldquo; by pure chance.',
    f:'<i>p</i> = <i>P</i>(data at least this extreme | <i>H</i><sub>0</sub>)&nbsp;&nbsp; <span class="op">·</span>&nbsp;&nbsp; reject <i>H</i><sub>0</sub> if <i>p</i> &lt; <i>α</i>',
    sym:[['null hypothesis','&bdquo;No effect&ldquo; — the thing you are trying to reject.'],
         ['p-value','The probability of seeing a result like this if the null were true. It is NOT the probability that the hypothesis is true.'],
         ['alpha — significance level','Usually 0.05. The acceptable false-discovery rate.'],
         ['power','The probability of detecting an effect if one really exists.']],
    ex:'You test 20 model variants at α = 0.05: you should expect 1 false &bdquo;significant&ldquo; improvement by chance alone. Bonferroni correction: use <span class="m">α/20 = 0.0025</span>. The same problem afflicts hyperparameter search — the best of 100 trials looks better than it is, which is exactly why there is a separate test set.' },

  ci:{ note:'Instead of one number, a range plus a confidence level. The bootstrap is remarkably practical: you resample your own data a thousand times and get a distribution for any statistic, with no formula at all.',
    f:'CI<sub>95%</sub> = <i>x̄</i> ± 1.96 · <span class="frac"><span class="n"><i>s</i></span><span class="d">√<i>n</i></span></span>&nbsp;&nbsp; <span class="op">·</span>&nbsp;&nbsp; bootstrap: resample with replacement <i>B</i> times',
    sym:[['confidence interval','A range that, over 95% of repeats of the experiment, contains the truth.'],
         ['critical value','The number of standard errors for 95% under a normal distribution.'],
         ['plus-minus','The bounds of the interval.'],
         ['bootstrap','Draw n examples from your own n examples, with repeats. Repeat 1000 times.']],
    ex:'Accuracy of 87% on 500 test cases: <span class="m">CI = 87% ± 1.96·√(0.87·0.13/500) = 87% ± 2.9%</span>. A model at 88.5% is not demonstrably better. The bootstrap also works for metrics with no formula (AUC, F1): resample the test set 1000 times, compute the metric each time, take the 2.5th and 97.5th percentile.' },

  ols:{ note:'The simplest complete model and the yardstick everything else is measured against. It has a closed-form solution, interpretable coefficients and precisely stated assumptions. Every dense layer in a neural network is linear regression without the activation.',
    sym:[['beta — coefficients','One per feature. The change in y per unit change in that feature.'],
         ['epsilon — residual / noise','What the model fails to capture.'],
         ['design matrix','Rows = examples, columns = features.'],
         ['coefficient of determination','What fraction of the variance the model explains. 1 = perfect, 0 = no better than the mean.'],
         ['residual sum of squares','Σ(y − ŷ)².']],
    ex:'House price = 50,000 + 1200·sqm − 3000·age. The coefficients read directly: each square metre adds 1200, each year of age removes 3000. That interpretability is exactly what you give up with a neural network. The MSE loss here is MLE under a Gaussian noise assumption — not a choice, but a consequence.' },

  bvd:{ note:'The precise mathematical account of why both underfitting and overfitting are bad, and why there is an optimum in between. The error splits into three parts: systematic bias, sensitivity to the particular data, and irreducible noise.',
    sym:[['squared bias','How systematically the model is wrong. High when the model is too simple.'],
         ['variance','How much the model changes with a different sample. High when the model is too complex.'],
         ['irreducible noise','The floor on the error. No model goes below it.'],
         ['model fitted from data','The hat stresses that it depends on the particular training set.']],
    ex:'A degree-1 polynomial on a curved relationship: high bias, low variance — wrong, but stably wrong. A degree-20 polynomial: near-zero bias, enormous variance — a different sample gives a completely different curve. The optimum is usually around degree 3–4. Ensembles (bagging) attack the variance; boosting attacks the bias.' },

  cvres:{ note:'How to evaluate a model without fooling yourself. You split the data into k parts, train on k−1 and test on the rest, k times. The crucial point is that every decision made from data &bdquo;spends&ldquo; it — hence the need for a separate test set.',
    f:'CV<sub><i>k</i></sub> = <span class="frac"><span class="n">1</span><span class="d"><i>k</i></span></span> Σ<sub><i>j</i>=1</sub><sup><i>k</i></sup> <i>L</i>(model<sub>−<i>j</i></sub>, fold<sub><i>j</i></sub>)',
    sym:[['number of folds','Usually 5 or 10. k = n is leave-one-out.'],
         ['model without fold j','Trained on everything else.'],
         ['stratified','Each fold keeps the same class proportions. Mandatory on imbalanced data.'],
         ['data leakage','Information from the test set has reached training. The most common cause of &bdquo;too good&ldquo; results.']],
    ex:'A classic trap: you standardize over the whole dataset and then split — the mean and σ already contain test information. Correct: the scaler is fitted on the training fold only. For time series, k-fold is not valid at all — you need a forward split in time, otherwise you are training on the future.' },

  expfam:{ note:'The unifying framework covering the normal, Bernoulli, Poisson, gamma and a dozen more. It explains why softmax is the natural choice for categorical data and why generalized linear models have exactly the link functions they do.',
